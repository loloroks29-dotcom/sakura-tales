<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>قراءة الفصل | Sakura Tales</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#000;
  color:white;
}

body{
  min-height:100vh;
  padding-bottom:70px;
  font-family:Arial,sans-serif;
}

/* الشريط العلوي */

.top-bar{
  position:sticky;
  top:0;
  z-index:1000;

  height:58px;
  padding:0 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  background:rgba(0,0,0,.94);
  border-bottom:1px solid #333;

  backdrop-filter:blur(10px);
}

.top-title{
  flex:1;
  min-width:0;
  text-align:center;
}

.manga-name{
  font-size:14px;
  font-weight:bold;
  color:#ffd1e4;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chapter-name{
  margin-top:3px;
  font-size:12px;
  color:#c9aeb9;
}

.top-btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#24151d;
  color:#ffd1e4;

  font-size:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

/* منطقة القراءة */

#reader{
  width:100%;
  max-width:900px;
  margin:0 auto;
  background:#000;
}

/*
  في الوضع الطبيعي:
  الصفحة تتحرك مع تمرير الهاتف بشكل طبيعي.
*/

.page-wrap{
  width:100%;
  position:relative;

  background:#000;

  overflow:hidden;

  touch-action:pan-y;
}

/* الصورة */

.page{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  transform-origin:center center;

  will-change:transform;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}

/* التحميل */

.loading{
  min-height:60vh;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;
  gap:10px;

  color:#d8b8c5;
}

.loading-heart{
  font-size:30px;

  animation:heart 1s infinite;
}

@keyframes heart{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }

}

/* الخطأ */

.error{
  margin:40px 20px;
  padding:20px;

  text-align:center;

  background:#170c11;
  border:1px solid #4a2635;

  border-radius:18px;

  color:#ffd1e4;
}

/* الشريط السفلي */

.bottom-bar{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  z-index:2000;

  height:66px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:8px 10px;

  background:rgba(0,0,0,.95);

  border-top:1px solid #333;

  backdrop-filter:blur(10px);
}

.nav-btn{

  height:46px;

  padding:0 15px;

  border:0;
  border-radius:15px;

  background:#24151d;

  color:#ffd1e4;

  font-size:13px;
  font-weight:bold;

  cursor:pointer;

  white-space:nowrap;
}

.nav-btn.main{
  background:#c46b91;
  color:white;
}

.nav-btn:active{
  transform:scale(.95);
}

.nav-btn:disabled{
  opacity:.35;
}

@media(max-width:600px){

  .top-bar{
    height:54px;
  }

  .top-btn{
    width:37px;
    height:37px;
    font-size:16px;
  }

  .manga-name{
    font-size:13px;
  }

  .chapter-name{
    font-size:11px;
  }

  .bottom-bar{
    height:62px;
    gap:6px;
    padding:7px;
  }

  .nav-btn{
    height:44px;
    padding:0 11px;
    font-size:12px;
  }

}

</style>
</head>

<body>


<header class="top-bar">

  <button
    class="top-btn"
    id="backBtn">
    ↩
  </button>

  <div class="top-title">

    <div
      class="manga-name"
      id="mangaTitle">
      Sakura Tales
    </div>

    <div
      class="chapter-name"
      id="chapterTitle">
      جاري تحميل الفصل...
    </div>

  </div>

  <button
    class="top-btn"
    id="chaptersBtn">
    📚
  </button>

</header>


<main id="reader">

  <div
    class="loading"
    id="loading">

    <div class="loading-heart">
      🌸
    </div>

    <div>
      جاري تحميل الفصل...
    </div>

  </div>

</main>


<nav class="bottom-bar">

  <button
    class="nav-btn"
    id="prevBtn">
    ⬅ السابق
  </button>

  <button
    class="nav-btn main"
    id="chaptersBottomBtn">
    📚 الفصول
  </button>

  <button
    class="nav-btn"
    id="nextBtn">
    التالي ➡
  </button>

</nav>


<script type="module">


import { db } from "./firebase.js";

import {
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* الرابط */

const params =
  new URLSearchParams(
    window.location.search
  );

const mangaId =
  params.get("id");

const chapterId =
  params.get("chapter");


/* العناصر */

const reader =
  document.getElementById("reader");

const loading =
  document.getElementById("loading");

const mangaTitle =
  document.getElementById("mangaTitle");

const chapterTitle =
  document.getElementById("chapterTitle");

const backBtn =
  document.getElementById("backBtn");

const chaptersBtn =
  document.getElementById("chaptersBtn");

const chaptersBottomBtn =
  document.getElementById(
    "chaptersBottomBtn"
  );

const prevBtn =
  document.getElementById(
    "prevBtn"
  );

const nextBtn =
  document.getElementById(
    "nextBtn"
  );


/* البداية */

if(!mangaId || !chapterId){

  showError(
    "رابط الفصل غير صحيح."
  );

}else{

  loadReader();

}


/* تحميل الفصل */

async function loadReader(){

  try{

    const mangaRef =
      doc(
        db,
        "manga",
        mangaId
      );

    const mangaSnap =
      await getDoc(
        mangaRef
      );


    if(!mangaSnap.exists()){

      showError(
        "لم يتم العثور على المانهوا."
      );

      return;

    }


    const manga =
      mangaSnap.data();


    mangaTitle.textContent =
      manga.title ||
      "Sakura Tales";


    const chapterRef =
      doc(
        db,
        "manga",
        mangaId,
        "chapters",
        chapterId
      );


    const chapterSnap =
      await getDoc(
        chapterRef
      );


    if(!chapterSnap.exists()){

      showError(
        "لم يتم العثور على الفصل."
      );

      return;

    }


    const chapter =
      chapterSnap.data();


    chapterTitle.textContent =
      chapter.title
      ? `الفصل ${chapter.number || ""} — ${chapter.title}`
      : `الفصل ${chapter.number || ""}`;


    const pages =
      Array.isArray(
        chapter.pages
      )
      ? chapter.pages
      : [];


    if(pages.length === 0){

      showError(
        "هذا الفصل لا يحتوي على صفحات."
      );

      return;

    }


    loading.remove();


    pages.forEach(
      (url,index)=>{

        createPage(
          url,
          index
        );

      }
    );


    await setupChapterNavigation();


  }catch(error){

    console.error(error);

    showError(
      "حدث خطأ أثناء تحميل الفصل."
    );

  }

}


/* إنشاء الصورة */

function createPage(
  url,
  index
){

  const wrap =
    document.createElement(
      "div"
    );

  wrap.className =
    "page-wrap";


  const img =
    document.createElement(
      "img"
    );

  img.className =
    "page";

  img.src =
    url;

  img.alt =
    `صفحة ${index + 1}`;

  img.draggable =
    false;

  img.loading =
    index === 0
    ? "eager"
    : "lazy";


  img.addEventListener(
    "contextmenu",
    e => e.preventDefault()
  );


  setupZoom(
    wrap,
    img
  );


  wrap.appendChild(
    img
  );

  reader.appendChild(
    wrap
  );

}


/*
================================
نظام التكبير والتحريك الجديد
================================
*/

function setupZoom(
  wrap,
  img
){

  let scale = 1;

  let x = 0;
  let y = 0;

  let startX = 0;
  let startY = 0;

  let startXPos = 0;
  let startYPos = 0;

  let startDistance = 0;
  let startScale = 1;


  const MIN_ZOOM = 1;
  const MAX_ZOOM = 5;


  /*
    حجم الصورة الحقيقي
    بعد تحميلها
  */

  function getBounds(){

    const rect =
      wrap.getBoundingClientRect();

    const width =
      img.offsetWidth;

    const height =
      img.offsetHeight;


    const scaledWidth =
      width * scale;

    const scaledHeight =
      height * scale;


    /*
      الحد الأفقي
    */

    let maxX =
      Math.max(
        0,
        (scaledWidth - rect.width) / 2
      );


    /*
      الحد العمودي
    */

    let maxY =
      Math.max(
        0,
        (scaledHeight - rect.height) / 2
      );


    return {
      maxX,
      maxY
    };

  }


  /*
    منع الصورة من الخروج
  */

  function clamp(){

    const bounds =
      getBounds();


    x =
      Math.max(
        -bounds.maxX,
        Math.min(
          bounds.maxX,
          x
        )
      );


    y =
      Math.max(
        -bounds.maxY,
        Math.min(
          bounds.maxY,
          y
        )
      );

  }


  /*
    تطبيق الحركة
  */

  function render(){

    clamp();


    img.style.transform =
      `translate3d(${x}px,${y}px,0) scale(${scale})`;

  }


  /*
    المسافة بين إصبعين
  */

  function distance(
    a,
    b
  ){

    const dx =
      b.clientX -
      a.clientX;

    const dy =
      b.clientY -
      a.clientY;

    return Math.sqrt(
      dx * dx +
      dy * dy
    );

  }


  /*
    بداية اللمس
  */

  wrap.addEventListener(
    "touchstart",
    event => {

      /*
        إصبعين:
        بداية التكبير
      */

      if(
        event.touches.length === 2
      ){

        startDistance =
          distance(
            event.touches[0],
            event.touches[1]
          );

        startScale =
          scale;

        event.preventDefault();

        return;

      }


      /*
        إصبع واحد:
        يسمح بالتحريك فقط
        إذا كانت الصورة مكبرة
      */

      if(
        event.touches.length === 1 &&
        scale > 1
      ){

        startX =
          event.touches[0].clientX;

        startY =
          event.touches[0].clientY;

        startXPos =
          x;

        startYPos =
          y;

      }

    },
    {
      passive:false
    }
  );


  /*
    حركة اللمس
  */

  wrap.addEventListener(
    "touchmove",
    event => {


      /*
        إصبعين = تكبير وتصغير
      */

      if(
        event.touches.length === 2
      ){

        const currentDistance =
          distance(
            event.touches[0],
            event.touches[1]
          );


        if(
          startDistance > 0
        ){

          const ratio =
            currentDistance /
            startDistance;


          scale =
            startScale *
            ratio;


          scale =
            Math.max(
              MIN_ZOOM,
              Math.min(
                MAX_ZOOM,
                scale
              )
            );


          render();


          event.preventDefault();

        }


        return;

      }


      /*
        إصبع واحد + تكبير
        = تحريك كامل
      */

      if(
        event.touches.length === 1 &&
        scale > 1
      ){

        const currentX =
          event.touches[0].clientX;

        const currentY =
          event.touches[0].clientY;


        x =
          startXPos +
          (
            currentX -
            startX
          );


        y =
          startYPos +
          (
            currentY -
            startY
          );


        render();


        event.preventDefault();

      }

    },
    {
      passive:false
    }
  );


  /*
    انتهاء اللمس
  */

  wrap.addEventListener(
    "touchend",
    event => {

      /*
        إذا وصل التكبير
        للحجم الطبيعي
      */

      if(
        scale <= 1.01
      ){

        scale = 1;

        x = 0;
        y = 0;

        render();

      }

    },
    {
      passive:false
    }
  );


  /*
    إذا تغير حجم الشاشة
  */

  window.addEventListener(
    "resize",
    () => {

      render();

    }
  );


  img.addEventListener(
    "dragstart",
    e => e.preventDefault()
  );

}


/* الرجوع */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer
    ){

      history.back();

    }else{

      window.location.href =
        `./manga.html?id=${encodeURIComponent(mangaId)}`;

    }

  }
);


/* الفصول */

function goToChapters(){

  window.location.href =
    `./manga.html?id=${encodeURIComponent(mangaId)}`;

}


chaptersBtn.addEventListener(
  "click",
  goToChapters
);

chaptersBottomBtn.addEventListener(
  "click",
  goToChapters
);


/* التنقل بين الفصول */

async function setupChapterNavigation(){

  try{

    const chaptersRef =
      collection(
        db,
        "manga",
        mangaId,
        "chapters"
      );


    const q =
      query(
        chaptersRef,
        orderBy(
          "number",
          "asc"
        )
      );


    const snapshot =
      await getDocs(q);


    const chapters =
      snapshot.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    const currentIndex =
      chapters.findIndex(
        chapter =>
          chapter.id === chapterId
      );


    if(
      currentIndex === -1
    ){

      prevBtn.disabled = true;
      nextBtn.disabled = true;

      return;

    }


    /* السابق */

    if(
      currentIndex > 0
    ){

      const previous =
        chapters[
          currentIndex - 1
        ];


      prevBtn.addEventListener(
        "click",
        () => {

          openChapter(
            previous.id
          );

        }
      );

    }else{

      prevBtn.disabled = true;

    }


    /* التالي */

    if(
      currentIndex <
      chapters.length - 1
    ){

      const next =
        chapters[
          currentIndex + 1
        ];


      nextBtn.addEventListener(
        "click",
        () => {

          openChapter(
            next.id
          );

        }
      );

    }else{

      nextBtn.disabled = true;

    }

  }catch(error){

    console.error(error);

  }

}


/* فتح فصل */

function openChapter(
  id
){

  window.location.href =
    `./reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(id)}`;

}


/* خطأ */

function showError(
  message
){

  if(loading){
    loading.remove();
  }


  reader.innerHTML = `

    <div class="error">

      🌸

      <br><br>

      ${message}

    </div>

  `;

}

</script>

</body>
</html>
