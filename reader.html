<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قراءة | Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #1d1720;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #1d1720;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* الشريط العلوي */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(35, 25, 32, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 10px;
    }

    .topbar {
      max-width: 1000px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .logo {
      color: #ffd6e7;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      white-space: nowrap;
    }

    .top-title {
      color: #fff;
      text-align: center;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .home {
      color: #ffd6e7;
      text-decoration: none;
      font-size: 13px;
      white-space: nowrap;
    }

    /* عنوان الفصل */
    .chapter-title {
      text-align: center;
      padding: 20px 10px;
      background: #251c23;
    }

    .chapter-title h1 {
      margin: 0;
      color: #ffd6e7;
      font-size: 21px;
    }

    .chapter-title p {
      margin: 7px 0 0;
      color: #cbbbc4;
      font-size: 14px;
    }

    /* الصور */
    .pages {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #111;
      line-height: 0;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      background: #111;
    }

    /* التحميل */
    .loading,
    .error {
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #d9cbd2;
      padding: 30px;
      line-height: 1.7;
    }

    /* أزرار التنقل */
    .navigation {
      max-width: 900px;
      margin: 0 auto;
      padding: 18px 10px 30px;
      background: #1d1720;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .navigation a {
      display: inline-block;
      color: white;
      background: #d96f9d;
      text-decoration: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    .navigation a:hover {
      background: #c85d8d;
    }

    .navigation .chapters {
      background: #f0b4cd;
      color: #5f3d4c;
    }

    .end {
      text-align: center;
      color: #a997a0;
      font-size: 13px;
      padding: 0 10px 35px;
    }

    @media (max-width: 600px) {

      .topbar {
        gap: 5px;
      }

      .logo {
        font-size: 13px;
      }

      .home {
        font-size: 12px;
      }

      .top-title {
        font-size: 12px;
      }

      .chapter-title {
        padding: 15px 8px;
      }

      .chapter-title h1 {
        font-size: 18px;
      }

      .navigation {
        padding: 15px 8px 25px;
      }

      .navigation a {
        padding: 11px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="topbar">

      <a class="logo" href="index.html">
        🌸 Sakura Tales
      </a>

      <div class="top-title" id="topTitle">
        جاري التحميل...
      </div>

      <a class="home" id="homeLink" href="index.html">
        الرئيسية
      </a>

    </div>
  </header>


  <section class="chapter-title" id="chapterTitle">
    <h1>جاري تحميل الفصل... 📖</h1>
  </section>


  <main class="pages" id="pages">

    <div class="loading">
      جاري تحميل صفحات الفصل... 🌸
    </div>

  </main>


  <nav class="navigation" id="navigation"></nav>


  <div class="end">
    💗 نهاية الفصل — Sakura Tales
  </div>


  <script type="module">

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const mangaId =
      params.get("id");

    const chapterId =
      params.get("chapter");


    const pages =
      document.getElementById("pages");

    const chapterTitle =
      document.getElementById("chapterTitle");

    const topTitle =
      document.getElementById("topTitle");

    const navigation =
      document.getElementById("navigation");

    const homeLink =
      document.getElementById("homeLink");


    if (!mangaId || !chapterId) {

      pages.innerHTML = `
        <div class="error">
          لم يتم تحديد الفصل 🌸
        </div>
      `;

    } else {

      loadChapter();

    }


    async function loadChapter() {

      try {

        /* تحميل بيانات المانهوا */
        const mangaRef =
          doc(db, "manga", mangaId);

        const mangaSnap =
          await getDoc(mangaRef);


        let mangaName =
          "Sakura Tales";


        if (mangaSnap.exists()) {

          const manga =
            mangaSnap.data();

          mangaName =
            manga.title || "Sakura Tales";

        }


        homeLink.href =
          "manga.html?id=" +
          encodeURIComponent(mangaId);


        /* تحميل الفصل */
        const chapterRef =
          doc(
            db,
            "manga",
            mangaId,
            "chapters",
            chapterId
          );


        const chapterSnap =
          await getDoc(chapterRef);


        if (!chapterSnap.exists()) {

          pages.innerHTML = `
            <div class="error">
              الفصل غير موجود 🌸
            </div>
          `;

          return;
        }


        const chapter =
          chapterSnap.data();


        const number =
          chapter.number || "";


        const name =
          chapter.title || "";


        chapterTitle.innerHTML = `

          <h1>
            📖 الفصل ${number}
          </h1>

          ${
            name
              ? `<p>${name}</p>`
              : ""
          }

        `;


        topTitle.textContent =
          mangaName +
          " — الفصل " +
          number;


        document.title =
          mangaName +
          " | الفصل " +
          number;


        /* عرض جميع صور الفصل */
        if (
          !Array.isArray(chapter.pages) ||
          chapter.pages.length === 0
        ) {

          pages.innerHTML = `
            <div class="error">
              لا توجد صور في هذا الفصل 📖
            </div>
          `;

        } else {

          pages.innerHTML = "";


          chapter.pages.forEach(
            (imageUrl, index) => {

              const img =
                document.createElement("img");


              img.className =
                "page";


              img.src =
                imageUrl;


              img.alt =
                "صفحة " +
                (index + 1);


              /*
                loading="eager"
                للصور الأولى حتى تظهر
                بسرعة أثناء القراءة.
              */
              if (index < 3) {

                img.loading = "eager";

              } else {

                img.loading = "lazy";

              }


              img.decoding = "async";


              img.onerror = function() {

                this.style.display =
                  "none";

              };


              pages.appendChild(img);

            }
          );

        }


        await loadNavigation();


      } catch (error) {

        console.error(error);

        pages.innerHTML = `
          <div class="error">
            حدث خطأ أثناء تحميل الفصل 🌸
          </div>
        `;

      }

    }


    async function loadNavigation() {

      const snapshot =
        await getDocs(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          )
        );


      const chapters = [];


      snapshot.forEach(item => {

        chapters.push({
          id: item.id,
          ...item.data()
        });

      });


      chapters.sort(
        (a, b) =>
          Number(a.number) -
          Number(b.number)
      );


      const currentIndex =
        chapters.findIndex(
          chapter =>
            chapter.id === chapterId
        );


      let html = "";


      if (currentIndex > 0) {

        const previous =
          chapters[currentIndex - 1];


        html += `

          <a href="reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(previous.id)}">

            ⬅️ السابق

          </a>

        `;

      }


      html += `

        <a
          class="chapters"
          href="manga.html?id=${encodeURIComponent(mangaId)}"
        >

          📚 الفصول

        </a>

      `;


      if (
        currentIndex !== -1 &&
        currentIndex <
        chapters.length - 1
      ) {

        const next =
          chapters[currentIndex + 1];


        html += `

          <a href="reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(next.id)}">

            التالي ➡️

          </a>

        `;

      }


      navigation.innerHTML =
        html;

    }

  </script>

</body>

</html>
