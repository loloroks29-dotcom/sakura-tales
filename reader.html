<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <title>قارئ المانهوا — Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff5fa;
      color: #5b3b4a;
      font-family: Arial, sans-serif;
    }

    body {
      padding-bottom: 75px;
    }

    /* الشريط العلوي */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 245, 250, 0.96);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #f4d5e3;
      padding: 12px 15px;
      text-align: center;
    }

    .topbar h1 {
      margin: 0;
      font-size: 17px;
      color: #c85c87;
    }

    .chapter-title {
      margin-top: 5px;
      font-size: 13px;
      color: #8d6878;
    }

    /* منطقة الصفحة */
    .page-wrap {
      width: 100%;
      overflow: hidden;
      position: relative;

      /* يسمح بالسكرول العادي عندما الصورة طبيعية */
      touch-action: pan-y;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;

      transform-origin: center center;
      will-change: transform;

      user-select: none;
      -webkit-user-drag: none;
    }

    /* رسالة التحميل */
    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #c85c87;
      font-size: 16px;
    }

    .error {
      text-align: center;
      padding: 50px 20px;
      color: #c94f70;
    }

    /* أزرار أسفل الشاشة */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;

      padding: 10px;
      background: rgba(255, 245, 250, 0.97);
      backdrop-filter: blur(10px);
      border-top: 1px solid #f4d5e3;
    }

    .bottom-nav a,
    .bottom-nav button {
      border: none;
      text-decoration: none;
      background: #f4a7c5;
      color: white;

      padding: 9px 14px;
      border-radius: 20px;

      font-size: 13px;
      cursor: pointer;
    }

    .bottom-nav a:hover,
    .bottom-nav button:hover {
      background: #df82a8;
    }

    @media (min-width: 700px) {
      .page {
        max-width: 900px;
      }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h1 id="mangaTitle">Sakura Tales</h1>
    <div class="chapter-title" id="chapterTitle">جاري التحميل...</div>
  </div>

  <div id="pages">
    <div class="loading">جاري تحميل الفصل... 💗</div>
  </div>

  <div class="bottom-nav">
    <a id="prevBtn" href="#">← السابق</a>
    <a id="chaptersBtn" href="#">📚 الفصول</a>
    <a id="nextBtn" href="#">التالي →</a>
  </div>


  <script type="module">

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const params = new URLSearchParams(window.location.search);

    const mangaId = params.get("id");
    const chapterId = params.get("chapter");

    const mangaTitle = document.getElementById("mangaTitle");
    const chapterTitle = document.getElementById("chapterTitle");
    const pagesContainer = document.getElementById("pages");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const chaptersBtn = document.getElementById("chaptersBtn");


    if (!mangaId || !chapterId) {

      pagesContainer.innerHTML =
        '<div class="error">الرابط غير صحيح 💔</div>';

      throw new Error("Missing mangaId or chapterId");

    }


    /* =========================
       تحميل المانهوا
    ========================= */

    const mangaRef = doc(db, "manga", mangaId);
    const mangaSnap = await getDoc(mangaRef);

    if (!mangaSnap.exists()) {

      pagesContainer.innerHTML =
        '<div class="error">المانهوا غير موجودة 💔</div>';

      throw new Error("Manga not found");

    }

    const manga = mangaSnap.data();

    mangaTitle.textContent =
      manga.title || "Sakura Tales";


    chaptersBtn.href =
      "./manga.html?id=" +
      encodeURIComponent(mangaId);


    /* =========================
       تحميل الفصل
    ========================= */

    const chapterRef =
      doc(db, "manga", mangaId, "chapters", chapterId);

    const chapterSnap =
      await getDoc(chapterRef);


    if (!chapterSnap.exists()) {

      pagesContainer.innerHTML =
        '<div class="error">الفصل غير موجود 💔</div>';

      throw new Error("Chapter not found");

    }


    const chapter = chapterSnap.data();


    chapterTitle.textContent =
      "الفصل " +
      (chapter.number ?? "") +
      (chapter.title ? " — " + chapter.title : "");


    /* =========================
       إنشاء الصور
    ========================= */

    pagesContainer.innerHTML = "";


    const pages = Array.isArray(chapter.pages)
      ? chapter.pages
      : [];


    if (pages.length === 0) {

      pagesContainer.innerHTML =
        '<div class="error">لا توجد صفحات في هذا الفصل 💔</div>';

    }


    pages.forEach((url) => {

      const wrap = document.createElement("div");
      wrap.className = "page-wrap";


      const img = document.createElement("img");

      img.className = "page";

      img.src = url;

      img.draggable = false;

      img.alt = "صفحة من المانهوا";


      wrap.appendChild(img);

      pagesContainer.appendChild(wrap);


      setupZoom(wrap, img);

    });


    /* =========================
       الزوم والحركة
    ========================= */

    function setupZoom(wrap, img) {

      let scale = 1;

      let x = 0;
      let y = 0;

      let startDistance = 0;
      let startScale = 1;

      let startX = 0;
      let startY = 0;

      let startPanX = 0;
      let startPanY = 0;

      let isPinching = false;
      let isPanning = false;


      /*
       * الحد الأدنى 1
       * الحد الأقصى 5
       *
       * مهم:
       * لا نرجع مباشرة إلى 1 عند التصغير.
       */
      const MIN_SCALE = 1;
      const MAX_SCALE = 5;


      function clamp(value, min, max) {

        return Math.min(
          Math.max(value, min),
          max
        );

      }


      function distance(t1, t2) {

        const dx =
          t2.clientX - t1.clientX;

        const dy =
          t2.clientY - t1.clientY;

        return Math.sqrt(
          dx * dx + dy * dy
        );

      }


      function applyTransform() {

        /*
         * عندما نرجع للحجم الطبيعي،
         * نرجع مكان الصورة للوسط.
         */

        if (scale <= 1.001) {

          scale = 1;

          x = 0;
          y = 0;

        }


        img.style.transform =
          `translate3d(${x}px, ${y}px, 0) scale(${scale})`;

      }


      wrap.addEventListener(
        "touchstart",
        function (e) {

          if (e.touches.length === 2) {

            isPinching = true;
            isPanning = false;

            startDistance =
              distance(
                e.touches[0],
                e.touches[1]
              );

            startScale = scale;

            return;
          }


          if (
            e.touches.length === 1 &&
            scale > 1
          ) {

            isPanning = true;

            startX =
              e.touches[0].clientX;

            startY =
              e.touches[0].clientY;

            startPanX = x;
            startPanY = y;

          }

        },
        { passive: true }
      );


      wrap.addEventListener(
        "touchmove",
        function (e) {

          /* =====================
             إصبعان = Zoom
          ===================== */

          if (
            e.touches.length === 2 &&
            isPinching
          ) {

            e.preventDefault();

            const newDistance =
              distance(
                e.touches[0],
                e.touches[1]
              );


            if (startDistance === 0)
              return;


            const ratio =
              newDistance / startDistance;


            /*
             * هنا الزوم صار سلس.
             * لا يوجد رجوع مفاجئ.
             */

            scale =
              clamp(
                startScale * ratio,
                MIN_SCALE,
                MAX_SCALE
              );


            /*
             * إذا صغرتِ الصورة،
             * نخفف الحركة تدريجيًا.
             */

            if (scale === 1) {

              x *= 0.7;
              y *= 0.7;

            }


            applyTransform();

            return;

          }


          /* =====================
             إصبع واحد = تحريك
             فقط بعد التكبير
          ===================== */

          if (
            e.touches.length === 1 &&
            isPanning &&
            scale > 1
          ) {

            e.preventDefault();


            const currentX =
              e.touches[0].clientX;

            const currentY =
              e.touches[0].clientY;


            x =
              startPanX +
              (currentX - startX);


            y =
              startPanY +
              (currentY - startY);


            /*
             * نخلي الحركة حرة
             * يمين / يسار / فوق / تحت.
             */

            applyTransform();

          }

        },
        { passive: false }
      );


      wrap.addEventListener(
        "touchend",
        function (e) {

          if (e.touches.length < 2) {

            isPinching = false;

          }


          if (e.touches.length === 0) {

            isPanning = false;

          }

        },
        { passive: true }
      );


      /* =========================
         Double Tap
      ========================= */

      let lastTap = 0;


      wrap.addEventListener(
        "touchend",
        function () {

          const now =
            Date.now();


          if (now - lastTap < 300) {

            if (scale === 1) {

              scale = 2;

            } else {

              scale = 1;

              x = 0;
              y = 0;

            }


            applyTransform();

          }


          lastTap = now;

        }
      );


      /*
       * منع سحب الصورة بالماوس
       */
      img.addEventListener(
        "dragstart",
        function (e) {

          e.preventDefault();

        }
      );

    }


    /* =========================
       تحميل أزرار السابق والتالي
    ========================= */

    const chaptersRef =
      collection(
        db,
        "manga",
        mangaId,
        "chapters"
      );


    const chaptersSnap =
      await getDocs(chaptersRef);


    const chapters =
      chaptersSnap.docs
        .map(docSnap => ({
          id: docSnap.id,
          ...docSnap.data()
        }))
        .sort(
          (a, b) =>
            Number(a.number || 0) -
            Number(b.number || 0)
        );


    const currentIndex =
      chapters.findIndex(
        ch => ch.id === chapterId
      );


    if (
      currentIndex > 0 &&
      chapters[currentIndex - 1]
    ) {

      prevBtn.href =
        "./reader.html?id=" +
        encodeURIComponent(mangaId) +
        "&chapter=" +
        encodeURIComponent(
          chapters[currentIndex - 1].id
        );

    } else {

      prevBtn.style.opacity = "0.5";
      prevBtn.style.pointerEvents = "none";

    }


    if (
      currentIndex >= 0 &&
      currentIndex < chapters.length - 1
    ) {

      nextBtn.href =
        "./reader.html?id=" +
        encodeURIComponent(mangaId) +
        "&chapter=" +
        encodeURIComponent(
          chapters[currentIndex + 1].id
        );

    } else {

      nextBtn.style.opacity = "0.5";
      nextBtn.style.pointerEvents = "none";

    }

  </script>

</body>
</html>
