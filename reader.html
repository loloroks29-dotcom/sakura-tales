<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>قراءة الفصل | Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
    }

    body {
      min-height: 100vh;
      padding-bottom: 75px;
      font-family: Arial, sans-serif;
    }

    /* الشريط العلوي */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 1000;

      height: 58px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      background: rgba(0, 0, 0, 0.92);
      border-bottom: 1px solid #333;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);

      backdrop-filter: blur(10px);
    }

    .top-title {
      flex: 1;
      min-width: 0;
      text-align: center;
    }

    .manga-name {
      font-size: 14px;
      font-weight: bold;
      color: #ffd1e4;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chapter-name {
      margin-top: 3px;
      font-size: 12px;
      color: #c9aeb9;
    }

    .top-btn {
      width: 40px;
      height: 40px;

      border: 0;
      border-radius: 50%;

      background: #24151d;
      color: #ffd1e4;

      font-size: 18px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .top-btn:active {
      transform: scale(0.92);
    }

    /* منطقة القراءة */
    #reader {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      background: #000;
    }

    .page-wrap {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: #000;
      touch-action: pan-y;
    }

    .page {
      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      transform-origin: center center;

      will-change: transform;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }

    /* التحميل */
    .loading {
      min-height: 60vh;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-direction: column;
      gap: 10px;

      color: #d8b8c5;
      font-size: 15px;
      background: #000;
    }

    .loading-heart {
      font-size: 30px;
      animation: heart 1s infinite;
    }

    @keyframes heart {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.15);
      }
    }

    /* الخطأ */
    .error {
      margin: 40px 20px;
      padding: 20px;

      text-align: center;

      background: #170c11;
      border: 1px solid #4a2635;
      border-radius: 18px;

      color: #ffd1e4;
    }

    /* الشريط السفلي */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      z-index: 2000;

      height: 66px;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 8px 10px;

      background: rgba(0, 0, 0, 0.94);
      border-top: 1px solid #333;
      box-shadow: 0 -3px 15px rgba(0, 0, 0, 0.5);

      backdrop-filter: blur(10px);
    }

    .nav-btn {
      height: 46px;

      padding: 0 15px;

      border: 0;
      border-radius: 15px;

      background: #24151d;
      color: #ffd1e4;

      font-size: 13px;
      font-weight: bold;

      cursor: pointer;
      white-space: nowrap;
    }

    .nav-btn.main {
      background: #c46b91;
      color: white;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    @media (max-width: 600px) {

      .top-bar {
        height: 54px;
      }

      .top-btn {
        width: 37px;
        height: 37px;
        font-size: 16px;
      }

      .manga-name {
        font-size: 13px;
      }

      .chapter-name {
        font-size: 11px;
      }

      .bottom-bar {
        height: 62px;
        gap: 6px;
        padding: 7px;
      }

      .nav-btn {
        height: 44px;
        padding: 0 11px;
        font-size: 12px;
        border-radius: 13px;
      }
    }
  </style>
</head>

<body>

  <header class="top-bar">

    <button class="top-btn" id="backBtn">
      ↩
    </button>

    <div class="top-title">

      <div class="manga-name" id="mangaTitle">
        Sakura Tales
      </div>

      <div class="chapter-name" id="chapterTitle">
        جاري تحميل الفصل...
      </div>

    </div>

    <button class="top-btn" id="chaptersBtn">
      📚
    </button>

  </header>


  <main id="reader">

    <div class="loading" id="loading">

      <div class="loading-heart">
        🌸
      </div>

      <div>
        جاري تحميل الفصل...
      </div>

    </div>

  </main>


  <nav class="bottom-bar">

    <button class="nav-btn" id="prevBtn">
      ⬅ السابق
    </button>

    <button class="nav-btn main" id="chaptersBottomBtn">
      📚 الفصول
    </button>

    <button class="nav-btn" id="nextBtn">
      التالي ➡
    </button>

  </nav>


  <script type="module">

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const params =
      new URLSearchParams(window.location.search);

    const mangaId =
      params.get("id");

    const chapterId =
      params.get("chapter");


    const reader =
      document.getElementById("reader");

    const loading =
      document.getElementById("loading");

    const mangaTitle =
      document.getElementById("mangaTitle");

    const chapterTitle =
      document.getElementById("chapterTitle");

    const backBtn =
      document.getElementById("backBtn");

    const chaptersBtn =
      document.getElementById("chaptersBtn");

    const chaptersBottomBtn =
      document.getElementById("chaptersBottomBtn");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");


    if (!mangaId || !chapterId) {

      showError("رابط الفصل غير صحيح.");

    } else {

      loadReader();

    }


    async function loadReader() {

      try {

        const mangaRef =
          doc(db, "manga", mangaId);

        const mangaSnap =
          await getDoc(mangaRef);


        if (!mangaSnap.exists()) {

          showError("لم يتم العثور على المانهوا.");

          return;
        }


        const manga =
          mangaSnap.data();


        mangaTitle.textContent =
          manga.title || "Sakura Tales";


        const chapterRef =
          doc(
            db,
            "manga",
            mangaId,
            "chapters",
            chapterId
          );


        const chapterSnap =
          await getDoc(chapterRef);


        if (!chapterSnap.exists()) {

          showError("لم يتم العثور على هذا الفصل.");

          return;
        }


        const chapter =
          chapterSnap.data();


        chapterTitle.textContent =
          chapter.title
            ? `الفصل ${chapter.number || ""} — ${chapter.title}`
            : `الفصل ${chapter.number || ""}`;


        const pages =
          Array.isArray(chapter.pages)
            ? chapter.pages
            : [];


        if (pages.length === 0) {

          showError("هذا الفصل لا يحتوي على صفحات.");

          return;
        }


        loading.remove();


        pages.forEach((url, index) => {

          createPage(url, index);

        });


        await setupChapterNavigation();


      } catch (error) {

        console.error(error);

        showError(
          "حدث خطأ أثناء تحميل الفصل."
        );

      }

    }


    function createPage(url, index) {

      const wrap =
        document.createElement("div");

      wrap.className =
        "page-wrap";


      const img =
        document.createElement("img");

      img.className =
        "page";

      img.src =
        url;

      img.alt =
        `صفحة ${index + 1}`;

      img.draggable =
        false;

      img.loading =
        index === 0
          ? "eager"
          : "lazy";


      img.addEventListener(
        "contextmenu",
        event => event.preventDefault()
      );


      setupZoom(wrap, img);


      wrap.appendChild(img);

      reader.appendChild(wrap);

    }


    /* التكبير والتحريك */

    function setupZoom(wrap, img) {

      let scale = 1;

      let translateX = 0;
      let translateY = 0;

      let startX = 0;
      let startY = 0;

      let startTranslateX = 0;
      let startTranslateY = 0;

      let startDistance = 0;
      let startScale = 1;

      let lastTouchCount = 0;


      const MIN_ZOOM = 1;
      const MAX_ZOOM = 5;


      function applyTransform() {

        img.style.transform =
          `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;

      }


      function distance(t1, t2) {

        const dx =
          t2.clientX - t1.clientX;

        const dy =
          t2.clientY - t1.clientY;

        return Math.sqrt(
          dx * dx + dy * dy
        );

      }


      wrap.addEventListener(
        "touchstart",
        event => {

          lastTouchCount =
            event.touches.length;


          if (event.touches.length === 2) {

            startDistance =
              distance(
                event.touches[0],
                event.touches[1]
              );

            startScale =
              scale;

            event.preventDefault();

            return;
          }


          if (
            event.touches.length === 1 &&
            scale > 1
          ) {

            startX =
              event.touches[0].clientX;

            startY =
              event.touches[0].clientY;

            startTranslateX =
              translateX;

            startTranslateY =
              translateY;

          }

        },
        { passive: false }
      );


      wrap.addEventListener(
        "touchmove",
        event => {

          if (event.touches.length === 2) {

            const currentDistance =
              distance(
                event.touches[0],
                event.touches[1]
              );


            if (startDistance > 0) {

              const ratio =
                currentDistance /
                startDistance;


              scale =
                startScale * ratio;


              scale =
                Math.max(
                  MIN_ZOOM,
                  Math.min(MAX_ZOOM, scale)
                );


              applyTransform();

              event.preventDefault();

            }

            return;
          }


          if (
            event.touches.length === 1 &&
            scale > 1
          ) {

            const x =
              event.touches[0].clientX;

            const y =
              event.touches[0].clientY;


            translateX =
              startTranslateX +
              (x - startX);

            translateY =
              startTranslateY +
              (y - startY);


            applyTransform();

            event.preventDefault();

          }

        },
        { passive: false }
      );


      wrap.addEventListener(
        "touchend",
        event => {

          if (
            lastTouchCount === 2 &&
            event.touches.length === 0
          ) {

            if (scale <= 1.02) {

              scale = 1;

              translateX = 0;
              translateY = 0;

              applyTransform();

            }

          }


          lastTouchCount =
            event.touches.length;

        },
        { passive: false }
      );


      img.addEventListener(
        "dragstart",
        event => event.preventDefault()
      );

    }


    /* الرجوع */

    backBtn.addEventListener(
      "click",
      () => {

        if (document.referrer) {

          history.back();

        } else {

          window.location.href =
            `./manga.html?id=${encodeURIComponent(mangaId)}`;

        }

      }
    );


    /* الفصول */

    function goToChapters() {

      window.location.href =
        `./manga.html?id=${encodeURIComponent(mangaId)}`;

    }


    chaptersBtn.addEventListener(
      "click",
      goToChapters
    );


    chaptersBottomBtn.addEventListener(
      "click",
      goToChapters
    );


    /* السابق والتالي */

    async function setupChapterNavigation() {

      try {

        const chaptersRef =
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          );


        const q =
          query(
            chaptersRef,
            orderBy("number", "asc")
          );


        const snapshot =
          await getDocs(q);


        const chapters =
          snapshot.docs.map(docSnap => ({

            id: docSnap.id,
            ...docSnap.data()

          }));


        const currentIndex =
          chapters.findIndex(
            chapter =>
              chapter.id === chapterId
          );


        if (currentIndex === -1) {

          prevBtn.disabled = true;
          nextBtn.disabled = true;

          return;
        }


        if (currentIndex > 0) {

          const previous =
            chapters[currentIndex - 1];


          prevBtn.addEventListener(
            "click",
            () => {

              openChapter(previous.id);

            }
          );

        } else {

          prevBtn.disabled = true;

        }


        if (
          currentIndex <
          chapters.length - 1
        ) {

          const next =
            chapters[currentIndex + 1];


          nextBtn.addEventListener(
            "click",
            () => {

              openChapter(next.id);

            }
          );

        } else {

          nextBtn.disabled = true;

        }

      } catch (error) {

        console.error(error);

      }

    }


    function openChapter(id) {

      window.location.href =
        `./reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(id)}`;

    }


    function showError(message) {

      if (loading) {
        loading.remove();
      }


      reader.innerHTML = `

        <div class="error">

          🌸

          <br><br>

          ${message}

        </div>

      `;

    }

  </script>

</body>
</html>
