<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
  >

  <title>قارئ — Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff7fb;
      color: #4a3040;
      font-family: Arial, sans-serif;
    }

    body {
      padding-bottom: 80px;
    }

    /* الشريط العلوي */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 247, 251, 0.97);
      border-bottom: 1px solid #f3d8e6;
      padding: 12px 15px;
      text-align: center;
    }

    .topbar a {
      color: #c45a8a;
      text-decoration: none;
      font-weight: bold;
    }

    #mangaTitle {
      margin: 5px 0 0;
      font-size: 18px;
    }

    #chapterTitle {
      margin: 5px 0 0;
      color: #8d6477;
      font-size: 14px;
    }

    /* صفحات المانهوا */
    #pages {
      width: 100%;
      margin: 0 auto;
      padding: 0;
      text-align: center;
    }

    .page {
      display: block;

      /*
        لا يوجد ضغط أو فلتر أو تحويل للصورة.
        نعرض الملف الأصلي القادم من ImgBB.
      */
      width: auto;
      max-width: 100%;
      height: auto;

      margin: 0 auto;
      padding: 0;

      border: 0;
      box-shadow: none;

      image-rendering: auto;

      /*
        يسمح بالتكبير باللمس على الهاتف.
      */
      touch-action: pinch-zoom;
    }

    /* شريط التنقل السفلي */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;

      display: flex;
      justify-content: center;
      gap: 8px;

      padding: 10px;

      background: rgba(255, 247, 251, 0.97);
      border-top: 1px solid #f3d8e6;
    }

    .bottom-nav button,
    .bottom-nav a {
      border: 0;
      border-radius: 20px;
      padding: 10px 15px;

      background: #f3a6c8;
      color: white;

      font-size: 14px;
      font-weight: bold;

      text-decoration: none;
      cursor: pointer;
    }

    .bottom-nav button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .loading,
    .error {
      padding: 40px 20px;
      text-align: center;
    }

    .error {
      color: #b33d68;
    }

    @media (max-width: 600px) {
      #mangaTitle {
        font-size: 16px;
      }

      .bottom-nav button,
      .bottom-nav a {
        padding: 9px 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="./index.html">🌸 Sakura Tales</a>

    <div id="mangaTitle">جاري التحميل...</div>
    <div id="chapterTitle"></div>
  </header>

  <main id="pages">
    <div class="loading">جاري تحميل الفصل 💗</div>
  </main>

  <nav class="bottom-nav">
    <button id="prevBtn">الفصل السابق</button>
    <a id="chaptersBtn" href="#">الفصول</a>
    <button id="nextBtn">الفصل التالي</button>
  </nav>

  <script type="module">
    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    const params = new URLSearchParams(window.location.search);

    const mangaId = params.get("id");
    const chapterId = params.get("chapter");

    const mangaTitle = document.getElementById("mangaTitle");
    const chapterTitle = document.getElementById("chapterTitle");
    const pagesContainer = document.getElementById("pages");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const chaptersBtn = document.getElementById("chaptersBtn");

    if (!mangaId || !chapterId) {
      pagesContainer.innerHTML =
        '<div class="error">الرابط غير صحيح 💔</div>';
    } else {
      loadReader();
    }

    async function loadReader() {
      try {
        /* جلب بيانات المانهوا */
        const mangaRef = doc(db, "manga", mangaId);
        const mangaSnap = await getDoc(mangaRef);

        if (!mangaSnap.exists()) {
          throw new Error("Manga not found");
        }

        const manga = mangaSnap.data();

        mangaTitle.textContent = manga.title || "Sakura Tales";

        chaptersBtn.href =
          "./manga.html?id=" + encodeURIComponent(mangaId);

        /* جلب الفصل الحالي */
        const chapterRef = doc(
          db,
          "manga",
          mangaId,
          "chapters",
          chapterId
        );

        const chapterSnap = await getDoc(chapterRef);

        if (!chapterSnap.exists()) {
          throw new Error("Chapter not found");
        }

        const currentChapter = {
          id: chapterSnap.id,
          ...chapterSnap.data()
        };

        chapterTitle.textContent =
          "الفصل " +
          (currentChapter.number ?? "") +
          (currentChapter.title
            ? " — " + currentChapter.title
            : "");

        /* عرض الصفحات */
        const pages = Array.isArray(currentChapter.pages)
          ? currentChapter.pages
          : [];

        pagesContainer.innerHTML = "";

        if (pages.length === 0) {
          pagesContainer.innerHTML =
            '<div class="error">لا توجد صفحات في هذا الفصل 💔</div>';
        } else {
          pages.forEach((url, index) => {
            if (!url) return;

            const img = document.createElement("img");

            img.className = "page";

            /*
              نستخدم الرابط المباشر للصورة كما هو.
              لا نغير الرابط ولا نضيف أي ضغط.
            */
            img.src = url;

            img.alt =
              "صفحة " + (index + 1);

            /*
              أول 3 صور يتم تحميلها مباشرة،
              والباقي عند الحاجة لتقليل استهلاك الإنترنت.
            */
            if (index >= 3) {
              img.loading = "lazy";
            } else {
              img.loading = "eager";
            }

            img.decoding = "async";

            /*
              لا توجد أي معالجة للصورة بواسطة الموقع.
            */
            img.style.filter = "none";
            img.style.transform = "none";

            pagesContainer.appendChild(img);
          });
        }

        /* جلب جميع الفصول */
        const chaptersRef = collection(
          db,
          "manga",
          mangaId,
          "chapters"
        );

        const chaptersSnap = await getDocs(chaptersRef);

        const chapters = chaptersSnap.docs
          .map(docSnap => ({
            id: docSnap.id,
            ...docSnap.data()
          }))
          .sort(
            (a, b) =>
              Number(a.number || 0) -
              Number(b.number || 0)
          );

        const currentIndex = chapters.findIndex(
          chapter => chapter.id === chapterId
        );

        /* الفصل السابق */
        if (currentIndex > 0) {
          const previousChapter =
            chapters[currentIndex - 1];

          prevBtn.disabled = false;

          prevBtn.onclick = () => {
            window.location.href =
              "./reader.html?id=" +
              encodeURIComponent(mangaId) +
              "&chapter=" +
              encodeURIComponent(previousChapter.id);
          };
        } else {
          prevBtn.disabled = true;
        }

        /* الفصل التالي */
        if (
          currentIndex !== -1 &&
          currentIndex < chapters.length - 1
        ) {
          const nextChapter =
            chapters[currentIndex + 1];

          nextBtn.disabled = false;

          nextBtn.onclick = () => {
            window.location.href =
              "./reader.html?id=" +
              encodeURIComponent(mangaId) +
              "&chapter=" +
              encodeURIComponent(nextChapter.id);
          };
        } else {
          nextBtn.disabled = true;
        }

      } catch (error) {
        console.error(error);

        pagesContainer.innerHTML =
          '<div class="error">حدث خطأ أثناء تحميل الفصل 💔</div>';
      }
    }
  </script>

</body>
</html>
