<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قراءة | Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #181318;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #181318;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* الشريط العلوي */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(35, 25, 32, 0.97);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.12);
    }

    .topbar {
      max-width: 1000px;
      margin: auto;
      min-height: 52px;
      padding: 8px 12px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .logo,
    .home {
      color: #ffd8e8;
      text-decoration: none;
      font-weight: bold;
      white-space: nowrap;
    }

    .logo {
      font-size: 14px;
    }

    .home {
      font-size: 13px;
    }

    .top-title {
      color: white;
      font-size: 14px;
      font-weight: bold;
      text-align: center;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* عنوان الفصل */
    .chapter-title {
      text-align: center;
      padding: 18px 10px;
      background: #241d24;
    }

    .chapter-title h1 {
      margin: 0;
      color: #ffe0ec;
      font-size: 22px;
      font-weight: bold;
    }

    .chapter-title p {
      margin: 8px 0 0;
      color: #d8c8d0;
      font-size: 15px;
    }

    /* صفحات المانهوا */
    .pages {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      background: #0d0b0d;
      line-height: 0;
      text-align: center;
    }

    .page {
      display: block;

      /*
        الصورة لا تتجاوز حجمها الطبيعي،
        ولا يتم تكبيرها بشكل يسبب تشوش الكلمات.
      */
      width: 100%;
      max-width: 1000px;
      height: auto;

      margin: 0 auto;
      padding: 0;

      border: 0;
      outline: 0;

      background: #0d0b0d;

      /*
        يحافظ على جودة الصورة قدر الإمكان
      */
      image-rendering: auto;
    }

    /* شاشة التحميل والخطأ */
    .loading,
    .error {
      min-height: 280px;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 30px;

      color: #dfd1d8;
      font-size: 16px;
      line-height: 1.8;
    }

    /* شريط الأزرار الثابت */
    .fixed-navigation {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;

      z-index: 200;

      background: rgba(30, 23, 29, 0.97);
      backdrop-filter: blur(10px);

      border-top: 1px solid rgba(255,255,255,.12);

      padding: 8px;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 7px;
    }

    .fixed-navigation a {
      min-width: 105px;

      text-align: center;

      background: #d96f9d;
      color: white;

      text-decoration: none;

      padding: 11px 13px;

      border-radius: 12px;

      font-size: 14px;
      font-weight: bold;

      box-shadow:
        0 3px 10px rgba(0,0,0,.2);
    }

    .fixed-navigation a:active {
      transform: scale(.97);
    }

    .fixed-navigation .chapters {
      background: #f1b6cf;
      color: #603d4d;
    }

    /* مساحة حتى لا يغطي الشريط آخر صورة */
    .bottom-space {
      height: 75px;
    }

    .end {
      text-align: center;

      color: #bcaab3;

      font-size: 14px;

      padding: 20px 10px 10px;
    }

    @media (max-width: 600px) {

      .topbar {
        padding: 7px 8px;
      }

      .logo {
        font-size: 12px;
      }

      .home {
        font-size: 11px;
      }

      .top-title {
        font-size: 12px;
      }

      .chapter-title h1 {
        font-size: 19px;
      }

      .chapter-title p {
        font-size: 14px;
      }

      .fixed-navigation {
        padding: 7px 5px;
      }

      .fixed-navigation a {
        min-width: 0;
        flex: 1;

        padding: 11px 5px;

        font-size: 12px;
      }

      .bottom-space {
        height: 70px;
      }
    }
  </style>
</head>


<body>

  <header>

    <div class="topbar">

      <a class="logo" href="index.html">
        🌸 Sakura Tales
      </a>

      <div class="top-title" id="topTitle">
        جاري التحميل...
      </div>

      <a class="home" id="homeLink" href="index.html">
        الرئيسية
      </a>

    </div>

  </header>


  <section class="chapter-title" id="chapterTitle">

    <h1>
      جاري تحميل الفصل... 📖
    </h1>

  </section>


  <main class="pages" id="pages">

    <div class="loading">
      جاري تحميل صفحات الفصل... 🌸
    </div>

  </main>


  <div class="end">
    💗 نهاية الفصل
  </div>


  <div class="bottom-space"></div>


  <!-- الأزرار الثابتة -->
  <nav class="fixed-navigation" id="navigation"></nav>


  <script type="module">

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const params =
      new URLSearchParams(
        window.location.search
      );


    const mangaId =
      params.get("id");

    const chapterId =
      params.get("chapter");


    const pages =
      document.getElementById("pages");

    const chapterTitle =
      document.getElementById("chapterTitle");

    const topTitle =
      document.getElementById("topTitle");

    const navigation =
      document.getElementById("navigation");

    const homeLink =
      document.getElementById("homeLink");


    if (!mangaId || !chapterId) {

      pages.innerHTML = `
        <div class="error">
          لم يتم تحديد الفصل 🌸
        </div>
      `;

    } else {

      loadChapter();

    }


    async function loadChapter() {

      try {

        /* تحميل المانهوا */
        const mangaRef =
          doc(db, "manga", mangaId);

        const mangaSnap =
          await getDoc(mangaRef);


        let mangaName =
          "Sakura Tales";


        if (mangaSnap.exists()) {

          const manga =
            mangaSnap.data();

          mangaName =
            manga.title ||
            "Sakura Tales";

        }


        homeLink.href =
          "manga.html?id=" +
          encodeURIComponent(mangaId);


        /* تحميل الفصل */
        const chapterRef =
          doc(
            db,
            "manga",
            mangaId,
            "chapters",
            chapterId
          );


        const chapterSnap =
          await getDoc(chapterRef);


        if (!chapterSnap.exists()) {

          pages.innerHTML = `
            <div class="error">
              الفصل غير موجود 🌸
            </div>
          `;

          return;
        }


        const chapter =
          chapterSnap.data();


        const number =
          chapter.number || "";


        const chapterName =
          chapter.title || "";


        chapterTitle.innerHTML = `

          <h1>
            📖 الفصل ${number}
          </h1>

          ${
            chapterName
              ? `<p>${chapterName}</p>`
              : ""
          }

        `;


        topTitle.textContent =
          mangaName +
          " — الفصل " +
          number;


        document.title =
          mangaName +
          " | الفصل " +
          number;


        /* عرض الصور */
        if (
          !Array.isArray(chapter.pages) ||
          chapter.pages.length === 0
        ) {

          pages.innerHTML = `
            <div class="error">
              لا توجد صفحات في هذا الفصل 📖
            </div>
          `;

        } else {

          pages.innerHTML = "";


          chapter.pages.forEach(
            (imageUrl, index) => {

              const img =
                document.createElement("img");


              img.className =
                "page";


              img.src =
                imageUrl;


              img.alt =
                "صفحة " +
                (index + 1);


              /*
                أول 4 صور تتحمل بسرعة،
                والباقي عند النزول لها.
              */
              img.loading =
                index < 4
                  ? "eager"
                  : "lazy";


              img.decoding =
                "async";


              img.onerror =
                function() {

                  this.style.display =
                    "none";

                };


              pages.appendChild(img);

            }
          );

        }


        await loadNavigation();


      } catch (error) {

        console.error(error);

        pages.innerHTML = `
          <div class="error">
            حدث خطأ أثناء تحميل الفصل 🌸
          </div>
        `;

      }

    }


    async function loadNavigation() {

      const snapshot =
        await getDocs(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          )
        );


      const chapters = [];


      snapshot.forEach(item => {

        chapters.push({
          id: item.id,
          ...item.data()
        });

      });


      chapters.sort(
        (a, b) =>
          Number(a.number) -
          Number(b.number)
      );


      const currentIndex =
        chapters.findIndex(
          chapter =>
            chapter.id === chapterId
        );


      let html = "";


      /* السابق */
      if (currentIndex > 0) {

        const previous =
          chapters[currentIndex - 1];


        html += `

          <a
            href="reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(previous.id)}"
          >
            ⬅️ السابق
          </a>

        `;

      } else {

        html += `
          <a style="opacity:.45; pointer-events:none;">
            ⬅️ السابق
          </a>
        `;

      }


      /* الفصول */
      html += `

        <a
          class="chapters"
          href="manga.html?id=${encodeURIComponent(mangaId)}"
        >
          📚 الفصول
        </a>

      `;


      /* التالي */
      if (
        currentIndex !== -1 &&
        currentIndex <
        chapters.length - 1
      ) {

        const next =
          chapters[currentIndex + 1];


        html += `

          <a
            href="reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(next.id)}"
          >
            التالي ➡️
          </a>

        `;

      } else {

        html += `
          <a style="opacity:.45; pointer-events:none;">
            التالي ➡️
          </a>
        `;

      }


      navigation.innerHTML =
        html;

    }

  </script>

</body>

</html>
