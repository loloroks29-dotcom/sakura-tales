<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>القراءة | Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #171217;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(35, 24, 31, 0.97);
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #4d3441;
    }

    header a {
      color: #ffd2e5;
      text-decoration: none;
      font-weight: bold;
    }

    .chapter-title {
      margin-top: 8px;
      color: #ffd2e5;
    }

    .pages {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .loading,
    .error {
      padding: 70px 20px;
      text-align: center;
      font-size: 18px;
    }

    .navigation {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 40px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .navigation a {
      padding: 13px 18px;
      border-radius: 13px;
      background: #d96f9d;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .navigation a:hover {
      background: #c85d8d;
    }

    .disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .pages {
        width: 100%;
      }

      .navigation a {
        flex: 1;
        text-align: center;
        min-width: 100px;
      }
    }
  </style>
</head>

<body>

<header>

  <a id="homeLink" href="index.html">
    🌸 Sakura Tales
  </a>

  <div id="chapterTitle" class="chapter-title">
    جاري التحميل...
  </div>

</header>


<main>

  <div id="pages" class="pages">

    <div class="loading">
      جاري تحميل الفصل 📖...
    </div>

  </div>


  <div class="navigation">

    <a id="previousButton" href="#">
      ⬅️ الفصل السابق
    </a>

    <a id="mangaButton" href="#">
      📚 الفصول
    </a>

    <a id="nextButton" href="#">
      الفصل التالي ➡️
    </a>

  </div>

</main>


<script type="module">

  import { db } from "./firebase.js";

  import {
    doc,
    getDoc,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const params =
    new URLSearchParams(window.location.search);


  const mangaId =
    params.get("id");

  const chapterId =
    params.get("chapter");


  const pages =
    document.getElementById("pages");

  const chapterTitle =
    document.getElementById("chapterTitle");

  const mangaButton =
    document.getElementById("mangaButton");

  const previousButton =
    document.getElementById("previousButton");

  const nextButton =
    document.getElementById("nextButton");


  if (!mangaId || !chapterId) {

    pages.innerHTML =
      '<div class="error">رابط الفصل غير صحيح 🌸</div>';

  } else {

    mangaButton.href =
      "manga.html?id=" +
      encodeURIComponent(mangaId);

    loadChapter();

  }


  async function loadChapter() {

    try {

      const chapterRef =
        doc(
          db,
          "manga",
          mangaId,
          "chapters",
          chapterId
        );


      const chapterSnap =
        await getDoc(chapterRef);


      if (!chapterSnap.exists()) {

        pages.innerHTML =
          '<div class="error">الفصل غير موجود 🌸</div>';

        return;

      }


      const currentChapter =
        chapterSnap.data();


      chapterTitle.textContent =
        "الفصل " +
        (currentChapter.number || "") +
        (
          currentChapter.title
            ? " — " + currentChapter.title
            : ""
        );


      document.title =
        "الفصل " +
        (currentChapter.number || "") +
        " | Sakura Tales";


      if (
        !Array.isArray(currentChapter.pages) ||
        currentChapter.pages.length === 0
      ) {

        pages.innerHTML =
          '<div class="error">لا توجد صفحات في هذا الفصل 📖</div>';

      } else {

        pages.innerHTML = "";


        currentChapter.pages.forEach(
          (url, index) => {

            const img =
              document.createElement("img");

            img.className = "page";

            img.src = url;

            img.alt =
              "صفحة " + (index + 1);

            img.loading =
              index < 2
                ? "eager"
                : "lazy";


            pages.appendChild(img);

          }
        );

      }


      await loadNavigation(
        currentChapter.number
      );


    } catch (error) {

      console.error(error);

      pages.innerHTML =
        '<div class="error">حدث خطأ في تحميل الفصل 🌸</div>';

    }

  }


  async function loadNavigation(
    currentNumber
  ) {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          )
        );


      const chapters = [];


      snapshot.forEach((item) => {

        chapters.push({

          id: item.id,

          ...item.data()

        });

      });


      chapters.sort(
        (a, b) =>
          Number(a.number) -
          Number(b.number)
      );


      const currentIndex =
        chapters.findIndex(
          chapter =>
            chapter.id === chapterId
        );


      if (currentIndex > 0) {

        const previous =
          chapters[currentIndex - 1];

        previousButton.href =
          "reader.html?id=" +
          encodeURIComponent(mangaId) +
          "&chapter=" +
          encodeURIComponent(previous.id);

      } else {

        previousButton.classList.add(
          "disabled"
        );

      }


      if (
        currentIndex >= 0 &&
        currentIndex < chapters.length - 1
      ) {

        const next =
          chapters[currentIndex + 1];

        nextButton.href =
          "reader.html?id=" +
          encodeURIComponent(mangaId) +
          "&chapter=" +
          encodeURIComponent(next.id);

      } else {

        nextButton.classList.add(
          "disabled"
        );

      }


    } catch (error) {

      console.error(error);

    }

  }

</script>

</body>
</html>
