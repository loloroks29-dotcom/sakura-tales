<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>قراءة الفصل | Sakura Tales</title><style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  background:#000;
  color:white;
}

body{
  min-height:100vh;
  padding-bottom:70px;
  font-family:Arial,sans-serif;
}

/* الشريط العلوي */

.top-bar{
  position:sticky;
  top:0;
  z-index:1000;

  height:58px;
  padding:0 12px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;

  background:rgba(0,0,0,.94);
  border-bottom:1px solid #333;

  backdrop-filter:blur(10px);

  transition:.25s;
}

.top-title{
  flex:1;
  min-width:0;
  text-align:center;
}

.manga-name{
  font-size:14px;
  font-weight:bold;
  color:#ffd1e4;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chapter-name{
  margin-top:3px;
  font-size:12px;
  color:#c9aeb9;
}

.top-btn{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#24151d;
  color:#ffd1e4;

  font-size:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
}

/* عداد الصفحة */

.page-counter{
  position:fixed;
  top:68px;
  left:50%;
  transform:translateX(-50%);

  z-index:1500;

  background:rgba(30,15,22,.88);
  color:#ffd1e4;

  padding:7px 13px;

  border-radius:20px;

  font-size:12px;
  font-weight:bold;

  border:1px solid #4b2938;

  backdrop-filter:blur(8px);

  transition:.25s;
}

/* منطقة القراءة */

#reader{
  width:100%;
  max-width:900px;
  margin:0 auto;
  background:#000;
}

/* الصفحة */

.page-wrap{
  width:100%;
  position:relative;

  background:#000;

  overflow:hidden;

  touch-action:pan-y;
}

.page{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;

  transform-origin:center center;

  will-change:transform;

  user-select:none;
  -webkit-user-select:none;
  -webkit-user-drag:none;
}

/* التحميل */

.loading{
  min-height:60vh;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;
  gap:10px;

  color:#d8b8c5;
}

.loading-heart{
  font-size:30px;

  animation:heart 1s infinite;
}

@keyframes heart{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.15);
  }

}

/* الخطأ */

.error{
  margin:40px 20px;
  padding:20px;

  text-align:center;

  background:#170c11;
  border:1px solid #4a2635;

  border-radius:18px;

  color:#ffd1e4;
}

/* زر أعلى الصفحة */

#topBtn{
  position:fixed;

  right:15px;
  bottom:80px;

  z-index:2100;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#c46b91;
  color:white;

  font-size:20px;

  cursor:pointer;

  box-shadow:0 5px 18px rgba(0,0,0,.35);

  opacity:0;
  pointer-events:none;

  transition:.25s;
}

#topBtn.show{
  opacity:1;
  pointer-events:auto;
}

/* الشريط السفلي */

.bottom-bar{
  position:fixed;

  bottom:0;
  left:0;
  right:0;

  z-index:2000;

  height:66px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;

  padding:8px 10px;

  background:rgba(0,0,0,.95);

  border-top:1px solid #333;

  backdrop-filter:blur(10px);

  transition:.25s;
}

.nav-btn{

  height:46px;

  padding:0 15px;

  border:0;
  border-radius:15px;

  background:#24151d;

  color:#ffd1e4;

  font-size:13px;
  font-weight:bold;

  cursor:pointer;

  white-space:nowrap;
}

.nav-btn.main{
  background:#c46b91;
  color:white;
}

.nav-btn:active{
  transform:scale(.95);
}

.nav-btn:disabled{
  opacity:.35;
}

/* وضع القراءة الكامل */

body.fullscreen .top-bar{
  transform:translateY(-100%);
}

body.fullscreen .bottom-bar{
  transform:translateY(100%);
}

body.fullscreen .page-counter{
  opacity:.25;
}

body.fullscreen #topBtn{
  bottom:20px;
}

/* زر وضع القراءة */

.fullscreen-btn{
  position:fixed;

  left:15px;
  bottom:80px;

  z-index:2100;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#24151d;
  color:#ffd1e4;

  font-size:18px;

  cursor:pointer;

  box-shadow:0 5px 18px rgba(0,0,0,.35);
}

/* الهاتف */

@media(max-width:600px){

  .top-bar{
    height:54px;
  }

  .top-btn{
    width:37px;
    height:37px;
    font-size:16px;
  }

  .manga-name{
    font-size:13px;
  }

  .chapter-name{
    font-size:11px;
  }

  .page-counter{
    top:62px;
    font-size:11px;
    padding:6px 11px;
  }

  .bottom-bar{
    height:62px;
    gap:6px;
    padding:7px;
  }

  .nav-btn{
    height:44px;
    padding:0 11px;
    font-size:12px;
  }

  #topBtn{
    right:12px;
    bottom:72px;
  }

  .fullscreen-btn{
    left:12px;
    bottom:72px;
  }

}

</style></head><body><header class="top-bar">  <button class="top-btn" id="backBtn">
    ↩
  </button>  <div class="top-title"><div class="manga-name" id="mangaTitle">
  Sakura Tales
</div>

<div class="chapter-name" id="chapterTitle">
  جاري تحميل الفصل...
</div>

  </div>  <button class="top-btn" id="chaptersBtn">
    📚
  </button></header><!-- عداد الصفحة --><div class="page-counter" id="pageCounter">
  صفحة 0 / 0
</div><main id="reader">  <div class="loading" id="loading"><div class="loading-heart">
  🌸
</div>

<div>
  جاري تحميل الفصل...
</div>

  </div></main><!-- زر أعلى --><button id="topBtn">
  ↑
</button><!-- وضع القراءة --><button class="fullscreen-btn" id="fullscreenBtn">
  👁
</button><nav class="bottom-bar">  <button class="nav-btn" id="prevBtn">
    ⬅ السابق
  </button>  <button class="nav-btn main" id="chaptersBottomBtn">
    📚 الفصول
  </button>  <button class="nav-btn" id="nextBtn">
    التالي ➡
  </button></nav><script type="module">

import { db } from "./firebase.js";

import {
  doc,
  getDoc,
  collection,
  getDocs,
  query,
  orderBy
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* الرابط */

const params =
  new URLSearchParams(
    window.location.search
  );

const mangaId =
  params.get("id");

const chapterId =
  params.get("chapter");


/* العناصر */

const reader =
  document.getElementById("reader");

const loading =
  document.getElementById("loading");

const mangaTitle =
  document.getElementById("mangaTitle");

const chapterTitle =
  document.getElementById("chapterTitle");

const backBtn =
  document.getElementById("backBtn");

const chaptersBtn =
  document.getElementById("chaptersBtn");

const chaptersBottomBtn =
  document.getElementById(
    "chaptersBottomBtn"
  );

const prevBtn =
  document.getElementById("prevBtn");

const nextBtn =
  document.getElementById("nextBtn");

const pageCounter =
  document.getElementById(
    "pageCounter"
  );

const topBtn =
  document.getElementById(
    "topBtn"
  );

const fullscreenBtn =
  document.getElementById(
    "fullscreenBtn"
  );


/* عدد الصفحات */

let totalPages = 0;


/* البداية */

if(!mangaId || !chapterId){

  showError(
    "رابط الفصل غير صحيح."
  );

}else{

  loadReader();

}


/* تحميل الفصل */

async function loadReader(){

  try{

    const mangaRef =
      doc(
        db,
        "manga",
        mangaId
      );

    const mangaSnap =
      await getDoc(
        mangaRef
      );


    if(!mangaSnap.exists()){

      showError(
        "لم يتم العثور على المانهوا."
      );

      return;

    }


    const manga =
      mangaSnap.data();


    mangaTitle.textContent =
      manga.title ||
      "Sakura Tales";


    const chapterRef =
      doc(
        db,
        "manga",
        mangaId,
        "chapters",
        chapterId
      );


    const chapterSnap =
      await getDoc(
        chapterRef
      );


    if(!chapterSnap.exists()){

      showError(
        "لم يتم العثور على الفصل."
      );

      return;

    }


    const chapter =
      chapterSnap.data();


    chapterTitle.textContent =
      chapter.title
      ? `الفصل ${chapter.number || ""} — ${chapter.title}`
      : `الفصل ${chapter.number || ""}`;


    const pages =
      Array.isArray(
        chapter.pages
      )
      ? chapter.pages
      : [];


    if(pages.length === 0){

      showError(
        "هذا الفصل لا يحتوي على صفحات."
      );

      return;

    }


    totalPages =
      pages.length;

    pageCounter.textContent =
      `صفحة 1 / ${totalPages}`;


    loading.remove();


    pages.forEach(
      (url,index)=>{

        createPage(
          url,
          index
        );

      }
    );


    setupPageCounter();

    await setupChapterNavigation();


  }catch(error){

    console.error(error);

    showError(
      "حدث خطأ أثناء تحميل الفصل."
    );

  }

}


/* إنشاء الصورة */

function createPage(
  url,
  index
){

  const wrap =
    document.createElement(
      "div"
    );

  wrap.className =
    "page-wrap";

  wrap.dataset.page =
    index + 1;


  const img =
    document.createElement(
      "img"
    );

  img.className =
    "page";

  img.src =
    url;

  img.alt =
    `صفحة ${index + 1}`;

  img.draggable =
    false;

  img.loading =
    index === 0
    ? "eager"
    : "lazy";


  img.addEventListener(
    "contextmenu",
    e => e.preventDefault()
  );


  setupZoom(
    wrap,
    img
  );


  wrap.appendChild(
    img
  );

  reader.appendChild(
    wrap
  );

}


/* عداد الصفحة */

function setupPageCounter(){

  const pageElements =
    document.querySelectorAll(
      ".page-wrap"
    );


  const observer =
    new IntersectionObserver(
      entries => {

        let visiblePage = 1;

        entries.forEach(
          entry => {

            if(
              entry.isIntersecting
            ){

              visiblePage =
                Number(
                  entry.target.dataset.page
                );

            }

          }
        );


        pageCounter.textContent =
          `صفحة ${visiblePage} / ${totalPages}`;

      },
      {
        root:null,
        threshold:.35
      }
    );


  pageElements.forEach(
    page => {

      observer.observe(page);

    }
  );

}


/* نظام التكبير */

function setupZoom(
  wrap,
  img
){

  let scale = 1;

  let x = 0;
  let y = 0;

  let startX = 0;
  let startY = 0;

  let startXPos = 0;
  let startYPos = 0;

  let startDistance = 0;
  let startScale = 1;


  const MIN_ZOOM = 1;
  const MAX_ZOOM = 5;


  function getBounds(){

    const rect =
      wrap.getBoundingClientRect();

    const width =
      img.offsetWidth;

    const height =
      img.offsetHeight;


    const scaledWidth =
      width * scale;

    const scaledHeight =
      height * scale;


    const maxX =
      Math.max(
        0,
        (scaledWidth - rect.width) / 2
      );


    const maxY =
      Math.max(
        0,
        (scaledHeight - rect.height) / 2
      );


    return {
      maxX,
      maxY
    };

  }


  function clamp(){

    const bounds =
      getBounds();


    x =
      Math.max(
        -bounds.maxX,
        Math.min(
          bounds.maxX,
          x
        )
      );


    y =
      Math.max(
        -bounds.maxY,
        Math.min(
          bounds.maxY,
          y
        )
      );

  }


  function render(){

    clamp();


    img.style.transform =
      `translate3d(${x}px,${y}px,0) scale(${scale})`;

  }


  function distance(a,b){

    const dx =
      b.clientX -
      a.clientX;

    const dy =
      b.clientY -
      a.clientY;

    return Math.sqrt(
      dx * dx +
      dy * dy
    );

  }


  wrap.addEventListener(
    "touchstart",
    event => {

      if(
        event.touches.length === 2
      ){

        startDistance =
          distance(
            event.touches[0],
            event.touches[1]
          );

        startScale =
          scale;

        event.preventDefault();

        return;

      }


      if(
        event.touches.length === 1 &&
        scale > 1
      ){

        startX =
          event.touches[0].clientX;

        startY =
          event.touches[0].clientY;

        startXPos =
          x;

        startYPos =
          y;

      }

    },
    {
      passive:false
    }
  );


  wrap.addEventListener(
    "touchmove",
    event => {

      if(
        event.touches.length === 2
      ){

        const currentDistance =
          distance(
            event.touches[0],
            event.touches[1]
          );


        if(
          startDistance > 0
        ){

          const ratio =
            currentDistance /
            startDistance;


          scale =
            startScale *
            ratio;


          scale =
            Math.max(
              MIN_ZOOM,
              Math.min(
                MAX_ZOOM,
                scale
              )
            );


          render();

          event.preventDefault();

        }

        return;

      }


      if(
        event.touches.length === 1 &&
        scale > 1
      ){

        const currentX =
          event.touches[0].clientX;

        const currentY =
          event.touches[0].clientY;


        x =
          startXPos +
          (
            currentX -
            startX
          );


        y =
          startYPos +
          (
            currentY -
            startY
          );


        render();

        event.preventDefault();

      }

    },
    {
      passive:false
    }
  );


  wrap.addEventListener(
    "touchend",
    () => {

      if(
        scale <= 1.01
      ){

        scale = 1;

        x = 0;
        y = 0;

        render();

      }

    }
  );


  window.addEventListener(
    "resize",
    () => {

      render();

    }
  );


  img.addEventListener(
    "dragstart",
    e => e.preventDefault()
  );

}


/* زر الرجوع */

backBtn.addEventListener(
  "click",
  () => {

    if(
      document.referrer
    ){

      history.back();

    }else{

      window.location.href =
        `./manga.html?id=${encodeURIComponent(mangaId)}`;

    }

  }
);


/* الفصول */

function goToChapters(){

  window.location.href =
    `./manga.html?id=${encodeURIComponent(mangaId)}`;

}


chaptersBtn.addEventListener(
  "click",
  goToChapters
);

chaptersBottomBtn.addEventListener(
  "click",
  goToChapters
);


/* وضع القراءة الكامل */

fullscreenBtn.addEventListener(
  "click",
  () => {

    document.body.classList.toggle(
      "fullscreen"
    );


    if(
      document.body.classList.contains(
        "fullscreen"
      )
    ){

      fullscreenBtn.textContent =
        "👁️‍🗨️";

    }else{

      fullscreenBtn.textContent =
        "👁";

    }

  }
);


/* زر أعلى */

window.addEventListener(
  "scroll",
  () => {

    if(
      window.scrollY > 500
    ){

      topBtn.classList.add(
        "show"
      );

    }else{

      topBtn.classList.remove(
        "show"
      );

    }

  }
);


topBtn.addEventListener(
  "click",
  () => {

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


/* التنقل بين الفصول */

async function setupChapterNavigation(){

  try{

    const chaptersRef =
      collection(
        db,
        "manga",
        mangaId,
        "chapters"
      );


    const q =
      query(
        chaptersRef,
        orderBy(
          "number",
          "asc"
        )
      );


    const snapshot =
      await getDocs(q);


    const chapters =
      snapshot.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    const currentIndex =
      chapters.findIndex(
        chapter =>
          chapter.id === chapterId
      );


    if(
      currentIndex === -1
    ){

      prevBtn.disabled = true;
      nextBtn.disabled = true;

      return;

    }


    /* السابق */

    if(
      currentIndex > 0
    ){

      const previous =
        chapters[
          currentIndex - 1
        ];


      prevBtn.addEventListener(
        "click",
        () => {

          openChapter(
            previous.id
          );

        }
      );

    }else{

      prevBtn.disabled = true;

    }


    /* التالي */

    if(
      currentIndex <
      chapters.length - 1
    ){

      const next =
        chapters[
          currentIndex + 1
        ];


      nextBtn.addEventListener(
        "click",
        () => {

          openChapter(
            next.id
          );

        }
      );

    }else{

      nextBtn.disabled = true;

    }

  }catch(error){

    console.error(error);

  }

}


/* فتح فصل */

function openChapter(
  id
){

  window.location.href =
    `./reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(id)}`;

}


/* خطأ */

function showError(
  message
){

  if(loading){
    loading.remove();
  }


  reader.innerHTML = `

    <div class="error">

      🌸

      <br><br>

      ${message}

    </div>

  `;

}

</script></body>
</html>
