<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

  <title>Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #fff7fb;
      color: #4a3040;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    body {
      padding-bottom: 75px;
    }

    /* العنوان */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 11px;
      text-align: center;
      background: rgba(255,247,251,.97);
      border-bottom: 1px solid #f1d6e4;
    }

    .topbar a {
      color: #c45a8a;
      text-decoration: none;
      font-weight: bold;
    }

    #mangaTitle {
      margin-top: 4px;
      font-size: 17px;
      font-weight: bold;
    }

    #chapterTitle {
      margin-top: 3px;
      font-size: 13px;
      color: #8d6477;
    }

    /* منطقة القراءة */
    #pages {
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /*
      كل صورة لها مساحة خاصة.
      عندما تكون الصورة بالحجم الطبيعي:
      السحب بإصبع واحد يحرك الصفحة.

      عند التكبير:
      يمكن تحريك الصورة في جميع الاتجاهات.
    */
    .page-wrap {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: #fff;
      line-height: 0;
      text-align: center;
    }

    .page {
      display: block;

      width: 100%;
      max-width: 100%;
      height: auto;

      margin: 0 auto;

      border: 0;
      box-shadow: none;

      filter: none;
      image-rendering: auto;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      transform-origin: center center;

      /*
        المتصفح يتولى السحب العمودي والتكبير.
      */
      touch-action: pan-y pinch-zoom;

      transition: transform .08s linear;
      will-change: transform;
    }

    .loading,
    .error {
      padding: 50px 20px;
      text-align: center;
      line-height: 1.6;
    }

    .error {
      color: #b33d68;
    }

    /* أزرار الفصول */
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      z-index: 2000;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 9px;

      background: rgba(255,247,251,.97);
      border-top: 1px solid #f1d6e4;
    }

    .bottom-nav button,
    .bottom-nav a {
      border: 0;
      border-radius: 22px;

      padding: 9px 13px;

      background: #f3a6c8;
      color: white;

      font-size: 13px;
      font-weight: bold;

      text-decoration: none;
    }

    .bottom-nav button:disabled {
      opacity: .4;
    }

    @media (max-width: 600px) {

      #mangaTitle {
        font-size: 16px;
      }

      .bottom-nav button,
      .bottom-nav a {
        padding: 8px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a href="./index.html">🌸 Sakura Tales</a>

    <div id="mangaTitle">
      جاري التحميل...
    </div>

    <div id="chapterTitle"></div>
  </header>


  <main id="pages">
    <div class="loading">
      جاري تحميل الفصل 💗
    </div>
  </main>


  <nav class="bottom-nav">

    <button id="prevBtn">
      السابق
    </button>

    <a id="chaptersBtn" href="#">
      الفصول
    </a>

    <button id="nextBtn">
      التالي
    </button>

  </nav>


  <script type="module">

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const params =
      new URLSearchParams(window.location.search);

    const mangaId =
      params.get("id");

    const chapterId =
      params.get("chapter");


    const mangaTitle =
      document.getElementById("mangaTitle");

    const chapterTitle =
      document.getElementById("chapterTitle");

    const pagesContainer =
      document.getElementById("pages");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const chaptersBtn =
      document.getElementById("chaptersBtn");


    if (!mangaId || !chapterId) {

      pagesContainer.innerHTML =
        '<div class="error">الرابط غير صحيح 💔</div>';

    } else {

      loadReader();

    }


    async function loadReader() {

      try {

        /* المانهوا */

        const mangaSnap =
          await getDoc(
            doc(db, "manga", mangaId)
          );


        if (!mangaSnap.exists()) {
          throw new Error("Manga not found");
        }


        const manga =
          mangaSnap.data();


        mangaTitle.textContent =
          manga.title ||
          "Sakura Tales";


        chaptersBtn.href =
          "./manga.html?id=" +
          encodeURIComponent(mangaId);


        /* الفصل */

        const chapterSnap =
          await getDoc(
            doc(
              db,
              "manga",
              mangaId,
              "chapters",
              chapterId
            )
          );


        if (!chapterSnap.exists()) {
          throw new Error("Chapter not found");
        }


        const chapter = {
          id: chapterSnap.id,
          ...chapterSnap.data()
        };


        chapterTitle.textContent =
          "الفصل " +
          (chapter.number ?? "") +
          (
            chapter.title
              ? " — " + chapter.title
              : ""
          );


        /* الصفحات */

        const pages =
          Array.isArray(chapter.pages)
            ? chapter.pages
            : [];


        pagesContainer.innerHTML = "";


        if (pages.length === 0) {

          pagesContainer.innerHTML =
            '<div class="error">لا توجد صفحات في هذا الفصل 💔</div>';

        } else {

          pages.forEach((url, index) => {

            if (!url) return;


            const wrapper =
              document.createElement("div");

            wrapper.className =
              "page-wrap";


            const img =
              document.createElement("img");

            img.className =
              "page";


            /*
              نستخدم الرابط المباشر كما هو.
              لا يتم تغيير الصورة أو ضغطها.
            */
            img.src = url;


            img.alt =
              "صفحة " + (index + 1);


            img.loading =
              index < 3
                ? "eager"
                : "lazy";


            img.decoding =
              "async";


            wrapper.appendChild(img);

            pagesContainer.appendChild(wrapper);

          });

        }


        /* جميع الفصول */

        const chaptersSnap =
          await getDocs(
            collection(
              db,
              "manga",
              mangaId,
              "chapters"
            )
          );


        const chapters =
          chaptersSnap.docs

            .map(d => ({
              id: d.id,
              ...d.data()
            }))

            .sort(
              (a, b) =>
                Number(a.number || 0) -
                Number(b.number || 0)
            );


        const currentIndex =
          chapters.findIndex(
            c => c.id === chapterId
          );


        /* السابق */

        if (currentIndex > 0) {

          const previous =
            chapters[currentIndex - 1];


          prevBtn.disabled = false;


          prevBtn.onclick = () => {

            location.href =
              "./reader.html?id=" +
              encodeURIComponent(mangaId) +
              "&chapter=" +
              encodeURIComponent(previous.id);

          };

        } else {

          prevBtn.disabled = true;

        }


        /* التالي */

        if (
          currentIndex >= 0 &&
          currentIndex <
            chapters.length - 1
        ) {

          const next =
            chapters[currentIndex + 1];


          nextBtn.disabled = false;


          nextBtn.onclick = () => {

            location.href =
              "./reader.html?id=" +
              encodeURIComponent(mangaId) +
              "&chapter=" +
              encodeURIComponent(next.id);

          };

        } else {

          nextBtn.disabled = true;

        }


      } catch (error) {

        console.error(error);

        pagesContainer.innerHTML =
          '<div class="error">حدث خطأ أثناء تحميل الفصل 💔</div>';

      }

    }

  </script>

</body>
</html>
