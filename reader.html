<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">

  <title>Sakura Tales — قارئ المانهوا</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff5fa;
      color: #5b3b4a;
      font-family: Arial, sans-serif;
    }

    body {
      padding-bottom: 75px;
    }

    /* =========================
       الشريط العلوي
    ========================= */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;

      background: rgba(255, 245, 250, 0.96);
      backdrop-filter: blur(10px);

      border-bottom: 1px solid #f4d5e3;

      padding: 12px 15px;
      text-align: center;
    }

    .topbar h1 {
      margin: 0;
      font-size: 17px;
      color: #c85c87;
    }

    .chapter-title {
      margin-top: 5px;
      font-size: 13px;
      color: #8d6878;
    }


    /* =========================
       منطقة الصورة
    ========================= */

    .page-wrap {
      width: 100%;
      position: relative;

      overflow: hidden;

      /*
       * مهم:
       * السماح بالسكرول الطبيعي
       * عندما لا يوجد زوم.
       */
      touch-action: pan-y;
    }

    .page {
      display: block;

      width: 100%;
      height: auto;

      margin: 0 auto;

      transform-origin: center center;

      will-change: transform;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
    }


    /* =========================
       التحميل والخطأ
    ========================= */

    .loading {
      text-align: center;

      padding: 50px 20px;

      color: #c85c87;

      font-size: 16px;
    }

    .error {
      text-align: center;

      padding: 50px 20px;

      color: #c94f70;
    }


    /* =========================
       أزرار الأسفل
    ========================= */

    .bottom-nav {
      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      display: flex;

      justify-content: center;
      align-items: center;

      gap: 8px;

      padding: 10px;

      background: rgba(255, 245, 250, 0.97);

      backdrop-filter: blur(10px);

      border-top: 1px solid #f4d5e3;
    }

    .bottom-nav a {
      text-decoration: none;

      background: #f4a7c5;

      color: white;

      padding: 9px 14px;

      border-radius: 20px;

      font-size: 13px;
    }

    .bottom-nav a:hover {
      background: #df82a8;
    }


    @media (min-width: 700px) {

      .page {
        max-width: 900px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       الشريط العلوي
  ========================= -->

  <div class="topbar">

    <h1 id="mangaTitle">
      Sakura Tales
    </h1>

    <div
      class="chapter-title"
      id="chapterTitle">

      جاري التحميل...

    </div>

  </div>



  <!-- =========================
       الصفحات
  ========================= -->

  <div id="pages">

    <div class="loading">
      جاري تحميل الفصل... 💗
    </div>

  </div>



  <!-- =========================
       أزرار التنقل
  ========================= -->

  <div class="bottom-nav">

    <a id="prevBtn" href="#">
      ← السابق
    </a>

    <a id="chaptersBtn" href="#">
      📚 الفصول
    </a>

    <a id="nextBtn" href="#">
      التالي →
    </a>

  </div>



  <script type="module">


    /* =========================
       Firebase
    ========================= */

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    }
    from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



    /* =========================
       الرابط
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const mangaId =
      params.get("id");


    const chapterId =
      params.get("chapter");



    const mangaTitle =
      document.getElementById(
        "mangaTitle"
      );


    const chapterTitle =
      document.getElementById(
        "chapterTitle"
      );


    const pagesContainer =
      document.getElementById(
        "pages"
      );


    const prevBtn =
      document.getElementById(
        "prevBtn"
      );


    const nextBtn =
      document.getElementById(
        "nextBtn"
      );


    const chaptersBtn =
      document.getElementById(
        "chaptersBtn"
      );



    /* =========================
       التأكد من الرابط
    ========================= */

    if (
      !mangaId ||
      !chapterId
    ) {

      pagesContainer.innerHTML =
        '<div class="error">الرابط غير صحيح 💔</div>';

      throw new Error(
        "Missing mangaId or chapterId"
      );

    }



    /* =========================
       تحميل المانهوا
    ========================= */

    const mangaRef =
      doc(
        db,
        "manga",
        mangaId
      );


    const mangaSnap =
      await getDoc(
        mangaRef
      );


    if (
      !mangaSnap.exists()
    ) {

      pagesContainer.innerHTML =
        '<div class="error">المانهوا غير موجودة 💔</div>';

      throw new Error(
        "Manga not found"
      );

    }


    const manga =
      mangaSnap.data();


    mangaTitle.textContent =
      manga.title ||
      "Sakura Tales";


    chaptersBtn.href =
      "./manga.html?id=" +
      encodeURIComponent(
        mangaId
      );



    /* =========================
       تحميل الفصل
    ========================= */

    const chapterRef =
      doc(
        db,
        "manga",
        mangaId,
        "chapters",
        chapterId
      );


    const chapterSnap =
      await getDoc(
        chapterRef
      );


    if (
      !chapterSnap.exists()
    ) {

      pagesContainer.innerHTML =
        '<div class="error">الفصل غير موجود 💔</div>';

      throw new Error(
        "Chapter not found"
      );

    }


    const chapter =
      chapterSnap.data();


    chapterTitle.textContent =
      "الفصل " +
      (chapter.number ?? "") +
      (
        chapter.title
          ? " — " +
            chapter.title
          : ""
      );



    /* =========================
       عرض الصور
    ========================= */

    pagesContainer.innerHTML =
      "";


    const pages =
      Array.isArray(
        chapter.pages
      )
        ? chapter.pages
        : [];


    if (
      pages.length === 0
    ) {

      pagesContainer.innerHTML =
        '<div class="error">لا توجد صفحات في هذا الفصل 💔</div>';

    }



    pages.forEach(
      (url) => {

        const wrap =
          document.createElement(
            "div"
          );


        wrap.className =
          "page-wrap";


        const img =
          document.createElement(
            "img"
          );


        img.className =
          "page";


        img.src =
          url;


        img.alt =
          "صفحة من المانهوا";


        img.draggable =
          false;


        wrap.appendChild(
          img
        );


        pagesContainer.appendChild(
          wrap
        );


        setupZoom(
          wrap,
          img
        );

      }
    );



    /* =====================================================
       نظام التكبير والتحريك الجديد
    ===================================================== */

    function setupZoom(
      wrap,
      img
    ) {


      /*
       * الحجم الحالي
       */

      let scale = 1;


      /*
       * مكان الصورة
       */

      let translateX = 0;

      let translateY = 0;



      /*
       * معلومات الزوم
       */

      let initialDistance = 0;

      let initialScale = 1;



      /*
       * معلومات التحريك
       */

      let initialTouchX = 0;

      let initialTouchY = 0;

      let initialTranslateX = 0;

      let initialTranslateY = 0;



      let zooming = false;

      let moving = false;



      /*
       * حدود الزوم
       */

      const MIN_ZOOM =
        1;


      const MAX_ZOOM =
        5;



      /* =========================
         المسافة بين إصبعين
      ========================= */

      function getDistance(
        touch1,
        touch2
      ) {

        const dx =
          touch2.clientX -
          touch1.clientX;


        const dy =
          touch2.clientY -
          touch1.clientY;


        return Math.sqrt(
          dx * dx +
          dy * dy
        );

      }



      /* =========================
         تحديث الصورة
      ========================= */

      function updateImage() {

        img.style.transform =
          "translate3d(" +
          translateX +
          "px, " +
          translateY +
          "px, 0) " +
          "scale(" +
          scale +
          ")";

      }



      /* =========================
         بداية اللمس
      ========================= */

      wrap.addEventListener(
        "touchstart",
        function(e) {


          /*
           * إصبعان
           * يبدأ الزوم
           */

          if (
            e.touches.length === 2
          ) {

            zooming =
              true;

            moving =
              false;


            initialDistance =
              getDistance(
                e.touches[0],
                e.touches[1]
              );


            initialScale =
              scale;


            return;

          }



          /*
           * إصبع واحد
           * تحريك بعد التكبير
           */

          if (
            e.touches.length === 1 &&
            scale > 1
          ) {

            moving =
              true;


            initialTouchX =
              e.touches[0].clientX;


            initialTouchY =
              e.touches[0].clientY;


            initialTranslateX =
              translateX;


            initialTranslateY =
              translateY;

          }

        },
        {
          passive: true
        }
      );



      /* =========================
         الحركة
      ========================= */

      wrap.addEventListener(
        "touchmove",
        function(e) {


          /* =====================
             التكبير والتصغير
          ===================== */

          if (
            e.touches.length === 2 &&
            zooming
          ) {

            e.preventDefault();


            const currentDistance =
              getDistance(
                e.touches[0],
                e.touches[1]
              );


            if (
              initialDistance <= 0
            ) {

              return;

            }


            const zoomRatio =
              currentDistance /
              initialDistance;


            let newScale =
              initialScale *
              zoomRatio;


            /*
             * تحديد أقل وأكبر زوم
             */

            newScale =
              Math.max(
                MIN_ZOOM,
                Math.min(
                  MAX_ZOOM,
                  newScale
                )
              );


            scale =
              newScale;


            /*
             * إذا رجعنا للحجم الطبيعي
             * نرجع مكان الصورة فقط
             * بدون أي Double Tap.
             */

            if (
              scale === 1
            ) {

              translateX = 0;

              translateY = 0;

            }


            updateImage();


            return;

          }



          /* =====================
             تحريك الصورة
          ===================== */

          if (
            e.touches.length === 1 &&
            moving &&
            scale > 1
          ) {

            e.preventDefault();


            const currentX =
              e.touches[0].clientX;


            const currentY =
              e.touches[0].clientY;


            translateX =
              initialTranslateX +
              (
                currentX -
                initialTouchX
              );


            translateY =
              initialTranslateY +
              (
                currentY -
                initialTouchY
              );


            updateImage();

          }

        },
        {
          passive: false
        }
      );



      /* =========================
         انتهاء اللمس
      ========================= */

      wrap.addEventListener(
        "touchend",
        function(e) {


          /*
           * انتهاء الزوم
           */

          if (
            e.touches.length < 2
          ) {

            zooming =
              false;

          }


          /*
           * انتهاء التحريك
           */

          if (
            e.touches.length === 0
          ) {

            moving =
              false;

          }

        },
        {
          passive: true
        }
      );



      /* =========================
         منع سحب الصورة
      ========================= */

      img.addEventListener(
        "dragstart",
        function(e) {

          e.preventDefault();

        }
      );

    }



    /* =========================
       تحميل الفصول
    ========================= */

    const chaptersRef =
      collection(
        db,
        "manga",
        mangaId,
        "chapters"
      );


    const chaptersSnap =
      await getDocs(
        chaptersRef
      );


    const chapters =
      chaptersSnap.docs
        .map(
          (docSnap) => ({

            id:
              docSnap.id,

            ...docSnap.data()

          })
        )
        .sort(
          (a, b) =>
            Number(
              a.number || 0
            ) -
            Number(
              b.number || 0
            )
        );



    /* =========================
       معرفة الفصل الحالي
    ========================= */

    const currentIndex =
      chapters.findIndex(
        (chapter) =>
          chapter.id ===
          chapterId
      );



    /* =========================
       السابق
    ========================= */

    if (
      currentIndex > 0
    ) {

      prevBtn.href =
        "./reader.html?id=" +
        encodeURIComponent(
          mangaId
        ) +
        "&chapter=" +
        encodeURIComponent(
          chapters[
            currentIndex - 1
          ].id
        );

    } else {

      prevBtn.style.opacity =
        "0.5";

      prevBtn.style.pointerEvents =
        "none";

    }



    /* =========================
       التالي
    ========================= */

    if (
      currentIndex >= 0 &&
      currentIndex <
      chapters.length - 1
    ) {

      nextBtn.href =
        "./reader.html?id=" +
        encodeURIComponent(
          mangaId
        ) +
        "&chapter=" +
        encodeURIComponent(
          chapters[
            currentIndex + 1
          ].id
        );

    } else {

      nextBtn.style.opacity =
        "0.5";

      nextBtn.style.pointerEvents =
        "none";

    }

  </script>

</body>
  </html>
