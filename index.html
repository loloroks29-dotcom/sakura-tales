<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sakura Tales 🌸</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffafd;
      color: #555;
    }

    /* الهيدر */

    header {
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #f5dce7;
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #dd8eac;
      text-decoration: none;
      font-size: 21px;
      font-weight: bold;
    }

    .home-text {
      color: #b995a5;
      font-size: 13px;
    }

    /* المحتوى */

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    /* الترحيب */

    .welcome {
      background: linear-gradient(
        135deg,
        #fff0f6,
        #ffffff
      );

      border: 1px solid #f5dce7;
      border-radius: 25px;

      padding: 35px 20px;

      text-align: center;

      box-shadow:
        0 6px 25px rgba(190,120,150,.07);

      margin-bottom: 22px;
    }

    .flower {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .welcome h1 {
      color: #d984a5;
      margin: 5px 0 10px;
      font-size: 27px;
    }

    .welcome p {
      color: #8c707d;
      line-height: 1.8;
      font-size: 14px;
      margin: 0 auto 20px;
    }

    /* البحث */

    .search-box {
      max-width: 620px;
      margin: auto;
      position: relative;
    }

    .search {
      width: 100%;

      padding: 14px 18px;

      border: 1px solid #efcfdd;
      border-radius: 15px;

      background: white;

      outline: none;

      font-size: 14px;

      color: #555;

      box-shadow:
        0 3px 12px rgba(180,120,145,.05);
    }

    .search:focus {
      border-color: #eab0c7;
    }

    /* الفلاتر */

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;

      gap: 7px;

      margin: 18px 0 25px;
    }

    .filter {
      border: 1px solid #f0d4df;

      background: white;

      color: #b47f93;

      padding: 8px 15px;

      border-radius: 20px;

      cursor: pointer;

      font-size: 12px;

      transition: .2s;
    }

    .filter:hover {
      background: #fff1f6;
    }

    .filter.active {
      background: #f7b6ce;
      border-color: #f7b6ce;
      color: white;
    }

    /* العنوان */

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin: 0 2px 15px;
    }

    .section-title h2 {
      margin: 0;

      color: #d984a5;

      font-size: 20px;
    }

    .section-title span {
      color: #c4a1af;
      font-size: 12px;
    }

    /* المانهوا */

    #mangaList {
      display: grid;

      grid-template-columns:
        repeat(auto-fill, minmax(190px, 1fr));

      gap: 17px;
    }

    .card {
      background: white;

      border: 1px solid #f3dce5;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 4px 16px rgba(180,120,145,.06);

      transition: .22s ease;
    }

    .card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 9px 22px rgba(180,120,145,.12);
    }

    /* الغلاف */

    .cover {
      width: 100%;
      height: 250px;

      object-fit: cover;

      display: block;

      background: #fff0f6;
    }

    .no-cover {
      width: 100%;
      height: 250px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        linear-gradient(
          135deg,
          #fff0f6,
          #ffe5ef
        );

      font-size: 42px;
    }

    /* معلومات الكرت */

    .content {
      padding: 13px;
    }

    .content h3 {
      color: #5e4a54;

      margin: 0 0 7px;

      font-size: 15px;

      line-height: 1.5;
    }

    .description {
      color: #8b7a82;

      font-size: 12px;

      line-height: 1.7;

      display: -webkit-box;

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .genres {
      color: #bc8fa2;

      font-size: 11px;

      margin-top: 7px;

      line-height: 1.6;

      display: -webkit-box;

      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;

      overflow: hidden;
    }

    .status {
      display: inline-block;

      background: #fff0f6;

      color: #d47f9f;

      padding: 5px 9px;

      border-radius: 15px;

      font-size: 10px;

      margin-top: 8px;
    }

    /* زر القراءة */

    .read {
      display: block;

      background: #f7b6ce;

      color: white;

      text-align: center;

      text-decoration: none;

      padding: 10px;

      border-radius: 11px;

      margin-top: 10px;

      font-size: 12px;

      font-weight: bold;

      transition: .2s;
    }

    .read:hover {
      background: #ed9fbd;
    }

    /* التحميل وعدم وجود نتائج */

    .loading,
    .empty {
      grid-column: 1 / -1;

      background: white;

      border: 1px solid #f3dce5;

      border-radius: 18px;

      padding: 35px;

      text-align: center;

      color: #ba91a1;

      font-size: 13px;
    }

    /* الفوتر */

    footer {
      text-align: center;

      padding: 25px 15px;

      color: #b999a7;

      font-size: 12px;

      border-top: 1px solid #f5e1e8;

      background: white;
    }

    /* الجوال */

    @media (max-width: 600px) {

      header {
        padding: 13px 15px;
      }

      .logo {
        font-size: 18px;
      }

      .home-text {
        font-size: 11px;
      }

      main {
        padding: 15px 10px 40px;
      }

      .welcome {
        padding: 27px 15px;
        border-radius: 20px;
      }

      .flower {
        font-size: 32px;
      }

      .welcome h1 {
        font-size: 22px;
      }

      .welcome p {
        font-size: 12px;
      }

      #mangaList {
        grid-template-columns:
          repeat(2, 1fr);

        gap: 11px;
      }

      .cover,
      .no-cover {
        height: 205px;
      }

      .content {
        padding: 10px;
      }

      .content h3 {
        font-size: 13px;
      }

      .description {
        font-size: 11px;
      }

      .genres {
        font-size: 10px;
      }

      .read {
        padding: 9px 5px;
        font-size: 11px;
      }

    }

  </style>
</head>


<body>

<header>

  <div class="header-inner">

    <a class="logo" href="index.html">
      🌸 Sakura Tales
    </a>

    <span class="home-text">
      حكايات تبدأ من هنا 💗
    </span>

  </div>

</header>


<main>

  <!-- الترحيب -->

  <section class="welcome">

    <div class="flower">
      🌸
    </div>

    <h1>
      حكايات ساكورا
    </h1>

    <p>
      عالم صغير مليء بالمانهوا والقصص الجميلة
      <br>
      اختاري حكايتك وابدئي القراءة 💗
    </p>

    <div class="search-box">

      <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 ابحثي عن مانهوا..."
      >

    </div>

  </section>


  <!-- الفلاتر -->

  <div class="filters">

    <button
      class="filter active"
      data-filter="all"
    >
      الكل
    </button>

    <button
      class="filter"
      data-filter="مستمرة"
    >
      مستمرة
    </button>

    <button
      class="filter"
      data-filter="مكتملة"
    >
      مكتملة
    </button>

    <button
      class="filter"
      data-filter="متوقفة"
    >
      متوقفة
    </button>

  </div>


  <!-- عنوان المانهوا -->

  <div class="section-title">

    <h2>
      📚 المانهوا
    </h2>

    <span>
      اختاري قصتك المفضلة
    </span>

  </div>


  <!-- قائمة المانهوا -->

  <div id="mangaList">

    <div class="loading">
      جاري تحميل المانهوا... 🌸
    </div>

  </div>

</main>


<footer>

  🌸 Sakura Tales

  <br>

  جميع الحكايات تبدأ من هنا 💗

</footer>


<script type="module">

  import { db } from "./firebase.js";

  import {
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const mangaList =
    document.getElementById("mangaList");

  const search =
    document.getElementById("search");

  const filters =
    document.querySelectorAll(".filter");


  let allManga = [];

  let currentFilter = "all";


  async function loadManga() {

    mangaList.innerHTML = `
      <div class="loading">
        جاري تحميل المانهوا... 🌸
      </div>
    `;


    try {

      const snapshot =
        await getDocs(
          collection(db, "manga")
        );


      allManga = [];


      snapshot.forEach((item) => {

        allManga.push({
          id: item.id,
          ...item.data()
        });

      });


      allManga.sort((a, b) => {

        const dateA =
          a.createdAt || "";

        const dateB =
          b.createdAt || "";


        return dateB.localeCompare(dateA);

      });


      displayManga();


    } catch (error) {

      console.error(error);


      mangaList.innerHTML = `
        <div class="empty">
          حدث خطأ أثناء تحميل المانهوا 🌸
        </div>
      `;

    }

  }


  function displayManga() {

    const text =
      search.value
        .trim()
        .toLowerCase();


    const filtered =
      allManga.filter((manga) => {

        const title =
          String(
            manga.title || ""
          ).toLowerCase();


        const description =
          String(
            manga.description || ""
          ).toLowerCase();


        const status =
          String(
            manga.status || ""
          );


        const matchesSearch =
          !text ||
          title.includes(text) ||
          description.includes(text);


        const matchesFilter =
          currentFilter === "all" ||
          status === currentFilter;


        return (
          matchesSearch &&
          matchesFilter
        );

      });


    if (filtered.length === 0) {

      mangaList.innerHTML = `
        <div class="empty">
          لا توجد مانهوا مطابقة 🌸
        </div>
      `;

      return;

    }


    mangaList.innerHTML = "";


    filtered.forEach((manga) => {

      const card =
        document.createElement("div");


      card.className =
        "card";


      const title =
        manga.title ||
        "بدون اسم";


      const description =
        manga.description ||
        "لا يوجد وصف لهذه المانهوا.";


      const status =
        manga.status ||
        "مستمرة";


      let coverHTML = "";


      if (manga.cover) {

        coverHTML = `
          <img
            class="cover"
            src="${manga.cover}"
            alt="${title}"
          >
        `;

      } else {

        coverHTML = `
          <div class="no-cover">
            🌸
          </div>
        `;

      }


      const genresHTML =
        Array.isArray(manga.genres)
          ? manga.genres.join(" • ")
          : "";


      card.innerHTML = `

        ${coverHTML}

        <div class="content">

          <h3>
            ${title}
          </h3>

          <div class="description">
            ${description}
          </div>

          ${
            genresHTML
              ? `
                <div class="genres">
                  ${genresHTML}
                </div>
              `
              : ""
          }

          <span class="status">
            ${status}
          </span>

          <a
            class="read"
            href="manga.html?id=${encodeURIComponent(manga.id)}"
          >
            📖 قراءة المانهوا
          </a>

        </div>

      `;


      mangaList.appendChild(card);

    });

  }


  search.addEventListener(
    "input",
    () => {

      displayManga();

    }
  );


  filters.forEach((button) => {

    button.addEventListener(
      "click",
      () => {

        filters.forEach((item) => {

          item.classList.remove(
            "active"
          );

        });


        button.classList.add(
          "active"
        );


        currentFilter =
          button.dataset.filter;


        displayManga();

      }
    );

  });


  loadManga();

</script>

</body>
</html>
