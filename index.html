<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Sakura Tales 🌸</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    /* الشريط العلوي */
    header {
      background: linear-gradient(135deg, #ffd9e9, #efa8c7);
      padding: 18px 15px;
      box-shadow: 0 4px 15px rgba(160, 80, 120, .12);
    }

    .nav {
      max-width: 1000px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .logo {
      color: white;
      font-size: 23px;
      font-weight: bold;
      text-decoration: none;
    }

    .admin {
      background: white;
      color: #a64f78;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    /* الترحيب */
    .hero {
      max-width: 1000px;
      margin: 25px auto 15px;
      padding: 30px 20px;
      text-align: center;
    }

    .hero h1 {
      margin: 0;
      color: #9b4770;
      font-size: 34px;
    }

    .hero p {
      color: #8b6878;
      line-height: 1.8;
      margin: 12px auto 20px;
      max-width: 600px;
    }

    /* البحث */
    .search-box {
      max-width: 650px;
      margin: auto;
    }

    .search-box input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid #efc4d7;
      border-radius: 18px;
      background: white;
      outline: none;
      font-size: 15px;
      color: #633f51;
      box-shadow: 0 5px 20px rgba(180, 100, 140, .08);
    }

    .search-box input:focus {
      border-color: #d96f9d;
    }

    /* العنوان */
    .section {
      max-width: 1000px;
      margin: auto;
      padding: 10px 15px 50px;
    }

    .section-title {
      text-align: center;
      color: #a64f78;
      margin: 10px 0 25px;
      font-size: 25px;
    }

    /* شبكة المانهوا */
    #mangaList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(160, 80, 120, .10);
      border: 1px solid #f5dce7;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(160, 80, 120, .16);
    }

    .cover {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      background: #ffeaf2;
    }

    .no-cover {
      width: 100%;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffe5ef, #fff5f9);
      color: #c47799;
      font-size: 45px;
    }

    .card-content {
      padding: 15px;
    }

    .card h3 {
      color: #963f6a;
      margin: 0 0 9px;
      font-size: 18px;
      line-height: 1.5;
    }

    .description {
      color: #80606f;
      font-size: 13px;
      line-height: 1.7;
      min-height: 44px;
    }

    .status {
      display: inline-block;
      background: #ffe5ef;
      color: #9b4770;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      margin-top: 8px;
    }

    .read {
      display: block;
      text-align: center;
      background: #d96f9d;
      color: white;
      text-decoration: none;
      padding: 11px;
      border-radius: 12px;
      margin-top: 12px;
      font-weight: bold;
    }

    .read:hover {
      background: #c85d8d;
    }

    .loading,
    .empty {
      grid-column: 1 / -1;
      background: white;
      border-radius: 18px;
      padding: 35px;
      text-align: center;
      color: #9a7182;
    }

    /* الفوتر */
    footer {
      text-align: center;
      padding: 25px 15px;
      color: #a4778b;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      .hero h1 {
        font-size: 27px;
      }

      #mangaList {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .cover,
      .no-cover {
        height: 210px;
      }

      .card-content {
        padding: 11px;
      }

      .card h3 {
        font-size: 15px;
      }

      .description {
        font-size: 12px;
      }

      .logo {
        font-size: 19px;
      }
    }
  </style></head><body><header>
  <div class="nav">
    <a class="logo" href="index.html">🌸 Sakura Tales</a>
    <a class="admin" href="admin.html">⚙️ لوحة التحكم</a>
  </div>
</header><section class="hero">
  <h1>🌸 حكايات ساكورا</h1>  <p>
    عالم من المانهوا والقصص الجميلة 💗
    <br>
    اختاري قصتك المفضلة وابدئي القراءة.
  </p>  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="🔍 ابحثي عن مانهوا..."
    >
  </div>
</section><section class="section">  <h2 class="section-title">
    📚 المانهوا
  </h2>  <div id="mangaList">
    <div class="loading">
      جاري تحميل المانهوا... 🌸
    </div>
  </div></section><footer>
  🌸 Sakura Tales
  <br>
  جميع الحكايات تبدأ من هنا 💗
</footer><script type="module">

  import { db } from "./firebase.js";

  import {
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const mangaList = document.getElementById("mangaList");
  const search = document.getElementById("search");

  let allManga = [];


  async function loadManga() {

    mangaList.innerHTML = `
      <div class="loading">
        جاري تحميل المانهوا... 🌸
      </div>
    `;

    try {

      const snapshot = await getDocs(
        collection(db, "manga")
      );

      allManga = [];

      snapshot.forEach((item) => {

        allManga.push({
          id: item.id,
          ...item.data()
        });

      });


      allManga.sort((a, b) => {

        const dateA = a.createdAt || "";
        const dateB = b.createdAt || "";

        return dateB.localeCompare(dateA);

      });


      displayManga(allManga);

    } catch (error) {

      console.error(error);

      mangaList.innerHTML = `
        <div class="empty">
          حدث خطأ أثناء تحميل المانهوا 🌸
        </div>
      `;

    }

  }


  function displayManga(list) {

    if (list.length === 0) {

      mangaList.innerHTML = `
        <div class="empty">
          لا توجد مانهوا حتى الآن 🌸
        </div>
      `;

      return;
    }


    mangaList.innerHTML = "";


    list.forEach((manga) => {

      const card = document.createElement("div");

      card.className = "card";


      const title = manga.title || "بدون اسم";

      const description =
        manga.description || "لا يوجد وصف لهذه المانهوا.";

      const status =
        manga.status || "مستمرة";


      let coverHTML = "";

      if (manga.cover) {

        coverHTML = `
          <img
            class="cover"
            src="${manga.cover}"
            alt="${title}"
          >
        `;

      } else {

        coverHTML = `
          <div class="no-cover">
            🌸
          </div>
        `;

      }


      card.innerHTML = `

        ${coverHTML}

        <div class="card-content">

          <h3>${title}</h3>

          <div class="description">
            ${description}
          </div>

          <span class="status">
            ${status}
          </span>

          <a
            class="read"
            href="manga.html?id=${encodeURIComponent(manga.id)}"
          >
            📖 قراءة
          </a>

        </div>

      `;


      mangaList.appendChild(card);

    });

  }


  search.addEventListener("input", () => {

    const text =
      search.value.trim().toLowerCase();


    if (!text) {

      displayManga(allManga);

      return;

    }


    const filtered =
      allManga.filter((manga) => {

        const title =
          String(manga.title || "").toLowerCase();

        const description =
          String(manga.description || "").toLowerCase();

        return (
          title.includes(text) ||
          description.includes(text)
        );

      });


    displayManga(filtered);

  });


  loadManga();

</script></body>
</html>
