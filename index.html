<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Tales 🌸</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #ffd6e8, #efa8c7);
      padding: 28px 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: #8f4668;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #75485e;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .welcome {
      text-align: center;
      margin-bottom: 25px;
    }

    .welcome h2 {
      color: #a64f78;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 18px rgba(160, 80, 120, .12);
      cursor: pointer;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #f8dce9;
    }

    .card-content {
      padding: 13px;
    }

    .card h3 {
      margin: 0 0 8px;
      color: #9b4770;
    }

    .genres {
      font-size: 13px;
      color: #8b6878;
    }

    .empty {
      text-align: center;
      padding: 40px;
    }
  </style>
</head>

<body>

<header>
  <h1>🌸 Sakura Tales</h1>
  <p>حكايات جميلة... تبدأ من هنا 💗</p>
</header>

<main>

  <div class="welcome">
    <h2>📚 المانهوا</h2>
    <p>اختاري مانهوا لبدء القراءة</p>
  </div>

  <div id="mangaList" class="grid">
    جاري تحميل المانهوا... 🌸
  </div>

</main>

<script type="module">

  import { db } from "./firebase.js";

  import {
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const mangaList = document.getElementById("mangaList");


  async function loadManga() {

    try {

      const snapshot =
        await getDocs(collection(db, "manga"));


      if (snapshot.empty) {

        mangaList.innerHTML =
          '<div class="empty">لا توجد مانهوا حتى الآن 🌸</div>';

        return;

      }


      mangaList.innerHTML = "";


      snapshot.forEach((item) => {

        const data = item.data();

        const card =
          document.createElement("div");

        card.className = "card";


        const genres =
          Array.isArray(data.genres)
            ? data.genres.join(" • ")
            : data.genres || "";


        card.innerHTML = `

          <img
            src="${data.cover || ""}"
            alt="${data.title || "مانهوا"}"
          >

          <div class="card-content">

            <h3>
              ${data.title || "بدون اسم"}
            </h3>

            <div class="genres">
              ${genres}
            </div>

          </div>

        `;


        card.addEventListener("click", () => {

          window.location.href =
            "manga.html?id=" + encodeURIComponent(item.id);

        });


        mangaList.appendChild(card);

      });


    } catch (error) {

      console.error(error);

      mangaList.innerHTML =
        '<div class="empty">حدث خطأ في تحميل المانهوا 🌸</div>';

    }

  }


  loadManga();

</script>

</body>
</html>
