<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Tales — حكايات ساكورا</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #5c4050;
    }

    header {
      background: linear-gradient(135deg, #ffd6e8, #f8b9d4);
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 3px 15px #e9b6ca;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #9b4770;
    }

    .subtitle {
      margin-top: 8px;
      color: #80536a;
    }

    .search {
      margin: 25px auto;
      max-width: 600px;
      padding: 14px 20px;
      border: none;
      border-radius: 30px;
      width: 90%;
      box-shadow: 0 3px 15px #ead4df;
      outline: none;
      font-size: 16px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 20px;
      color: #9b4770;
    }

    .manga-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      max-width: 240px;
      box-shadow: 0 5px 20px #ead4df;
      transition: 0.3s;
    }

    .manga-card:hover {
      transform: translateY(-6px);
    }

    .manga-card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      color: #9b4770;
      margin-bottom: 8px;
    }

    .status {
      display: inline-block;
      background: #ffe1ee;
      color: #a84f78;
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 13px;
      margin-top: 8px;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      text-align: center;
      background: #ffd6e8;
      color: #80536a;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🌸 Sakura Tales</div>
    <div class="subtitle">حكايات ساكورا — عالم من المانهوا والقصص الجميلة</div>

    <input
      class="search"
      type="text"
      placeholder="🔎 ابحثي عن مانهوا..."
    >
  </header>

  <main>
    <h2>🌷 أحدث المانهوا</h2>

    <div class="manga-card">

      <img
        src="https://i.ibb.co/9m9LP2Pn/file-0000000077dc820a9d7822727ba9ab60.png"
        alt="غلاف المانهوا"
      >

      <div class="info">
        <h3>مانهوا جديدة</h3>

        <p>
          قصة رومانسية جميلة تجدينها هنا في حكايات ساكورا 💗
        </p>

        <span class="status">مستمرة</span>
      </div>

    </div>
  </main>
