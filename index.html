<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Sakura Tales 🌸</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #ffd9e9, #efa8c7);
      padding: 20px;
      text-align: center;
    }

    header a {
      color: #8f4668;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .welcome {
      background: white;
      border-radius: 24px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 7px 25px rgba(160, 80, 120, .12);
      margin-bottom: 25px;
    }

    .welcome h1 {
      color: #9b4770;
      margin-top: 0;
    }

    .welcome p {
      line-height: 1.8;
      color: #80606f;
    }

    .search {
      width: 100%;
      max-width: 650px;
      padding: 14px 16px;
      border: 1px solid #efc4d7;
      border-radius: 15px;
      outline: none;
      font-size: 15px;
      margin-top: 10px;
    }

    .filters {
      text-align: center;
      margin: 20px 0;
    }

    .filter {
      border: 0;
      background: #ffe5ef;
      color: #9b4770;
      padding: 9px 14px;
      border-radius: 12px;
      margin: 4px;
      cursor: pointer;
    }

    .filter.active {
      background: #d96f9d;
      color: white;
    }

    .title {
      text-align: center;
      color: #a64f78;
      margin: 25px 0;
    }

    #mangaList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 18px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 22px rgba(160, 80, 120, .10);
      border: 1px solid #f5dce7;
      transition: .2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .cover {
      width: 100%;
      height: 260px;
      object-fit: cover;
      display: block;
      background: #ffeaf2;
    }

    .no-cover {
      width: 100%;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffeaf2;
      font-size: 45px;
    }

    .content {
      padding: 15px;
    }

    .content h3 {
      color: #963f6a;
      margin: 0 0 10px;
      line-height: 1.5;
    }

    .description {
      color: #80606f;
      font-size: 13px;
      line-height: 1.7;
    }

    .genres {
      color: #b15c82;
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.6;
    }

    .status {
      display: inline-block;
      background: #ffe5ef;
      color: #9b4770;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      margin-top: 9px;
    }

    .read {
      display: block;
      background: #d96f9d;
      color: white;
      text-align: center;
      text-decoration: none;
      padding: 11px;
      border-radius: 12px;
      margin-top: 12px;
      font-weight: bold;
    }

    .loading,
    .empty {
      grid-column: 1 / -1;
      background: white;
      border-radius: 18px;
      padding: 35px;
      text-align: center;
      color: #9a7182;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #a4778b;
      font-size: 13px;
    }

    @media (max-width: 500px) {
      #mangaList {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .cover,
      .no-cover {
        height: 210px;
      }

      .content {
        padding: 11px;
      }

      .content h3 {
        font-size: 15px;
      }

      .description {
        font-size: 12px;
      }
    }
  </style></head><body><header>
  <a href="index.html">🌸 Sakura Tales</a>
</header><main>  <section class="welcome">
    <h1>🌸 حكايات ساكورا</h1><p>
  عالم من المانهوا والقصص الجميلة 💗
  <br>
  اختاري قصتك المفضلة وابدئي القراءة.
</p>

<input
  class="search"
  id="search"
  type="text"
  placeholder="🔍 ابحثي عن مانهوا..."
>

  </section>  <div class="filters">
    <button class="filter active" data-filter="all">
      الكل
    </button><button class="filter" data-filter="مستمرة">
  مستمرة
</button>

<button class="filter" data-filter="مكتملة">
  مكتملة
</button>

<button class="filter" data-filter="متوقفة">
  متوقفة
</button>

  </div>  <h2 class="title">
    📚 المانهوا
  </h2>  <div id="mangaList">
    <div class="loading">
      جاري تحميل المانهوا... 🌸
    </div>
  </div></main><footer>
  🌸 Sakura Tales
  <br>
  جميع الحكايات تبدأ من هنا 💗
</footer><script type="module">

  import { db } from "./firebase.js";

  import {
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const mangaList = document.getElementById("mangaList");
  const search = document.getElementById("search");
  const filters = document.querySelectorAll(".filter");

  let allManga = [];
  let currentFilter = "all";


  async function loadManga() {

    mangaList.innerHTML = `
      <div class="loading">
        جاري تحميل المانهوا... 🌸
      </div>
    `;

    try {

      const snapshot = await getDocs(
        collection(db, "manga")
      );

      allManga = [];

      snapshot.forEach((item) => {

        allManga.push({
          id: item.id,
          ...item.data()
        });

      });

      allManga.sort((a, b) => {

        const dateA = a.createdAt || "";
        const dateB = b.createdAt || "";

        return dateB.localeCompare(dateA);

      });

      displayManga();

    } catch (error) {

      console.error(error);

      mangaList.innerHTML = `
        <div class="empty">
          حدث خطأ أثناء تحميل المانهوا 🌸
        </div>
      `;

    }

  }


  function displayManga() {

    const text =
      search.value.trim().toLowerCase();


    const filtered = allManga.filter((manga) => {

      const title =
        String(manga.title || "").toLowerCase();

      const description =
        String(manga.description || "").toLowerCase();

      const status =
        String(manga.status || "");


      const matchesSearch =
        !text ||
        title.includes(text) ||
        description.includes(text);


      const matchesFilter =
        currentFilter === "all" ||
        status === currentFilter;


      return matchesSearch && matchesFilter;

    });


    if (filtered.length === 0) {

      mangaList.innerHTML = `
        <div class="empty">
          لا توجد مانهوا مطابقة 🌸
        </div>
      `;

      return;

    }


    mangaList.innerHTML = "";


    filtered.forEach((manga) => {

      const card = document.createElement("div");

      card.className = "card";


      const title =
        manga.title || "بدون اسم";

      const description =
        manga.description ||
        "لا يوجد وصف لهذه المانهوا.";

      const status =
        manga.status ||
        "مستمرة";


      let coverHTML = "";

      if (manga.cover) {

        coverHTML = `
          <img
            class="cover"
            src="${manga.cover}"
            alt="${title}"
          >
        `;

      } else {

        coverHTML = `
          <div class="no-cover">
            🌸
          </div>
        `;

      }


      const genresHTML =
        Array.isArray(manga.genres)
          ? manga.genres.join(" • ")
          : "";


      card.innerHTML = `

        ${coverHTML}

        <div class="content">

          <h3>
            ${title}
          </h3>

          <div class="description">
            ${description}
          </div>

          ${
            genresHTML
              ? `<div class="genres">
                   ${genresHTML}
                 </div>`
              : ""
          }

          <span class="status">
            ${status}
          </span>

          <a
            class="read"
            href="manga.html?id=${encodeURIComponent(manga.id)}"
          >
            📖 قراءة المانهوا
          </a>

        </div>

      `;


      mangaList.appendChild(card);

    });

  }


  search.addEventListener("input", () => {

    displayManga();

  });


  filters.forEach((button) => {

    button.addEventListener("click", () => {

      filters.forEach((item) => {
        item.classList.remove("active");
      });

      button.classList.add("active");

      currentFilter =
        button.dataset.filter;

      displayManga();

    });

  });


  loadManga();

</script></body>
</html>
