<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة تحكم Sakura Tales 🌸</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5fa;
      color: #5b4050;
    }

    header {
      background: linear-gradient(135deg, #ffb6d9, #ffd6e9);
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    header h1 {
      margin: 0;
      color: #8f3f68;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 15px;
      color: #795468;
    }

    button {
      border: 0;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .logout {
      background: #fff;
      color: #d85c91;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .stat span {
      display: block;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      color: #d85c91;
    }

    .stat small {
      color: #8c7180;
    }

    .box {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 18px rgba(0,0,0,.06);
    }

    .box h2 {
      margin-top: 0;
      color: #a34473;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #704b60;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #efc5d9;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      background: #fffafd;
      color: #5b4050;
      font-size: 15px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #e98ab4;
      box-shadow: 0 0 0 3px rgba(233,138,180,.12);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .main-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #e989b5, #d95d91);
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .message {
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      display: none;
      line-height: 1.7;
    }

    .message.success {
      display: block;
      background: #e8f8ee;
      color: #31804c;
    }

    .message.error {
      display: block;
      background: #ffe9ee;
      color: #b33e59;
    }

    .search-box {
      margin-bottom: 20px;
    }

    #mangaList {
      display: grid;
      gap: 20px;
    }

    .manga-card {
      border: 1px solid #f1d5e2;
      border-radius: 18px;
      padding: 18px;
      background: #fffafd;
    }

    .manga-top {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .cover {
      width: 110px;
      height: 150px;
      border-radius: 12px;
      object-fit: cover;
      background: #f9e4ee;
      flex-shrink: 0;
    }

    .cover-placeholder {
      width: 110px;
      height: 150px;
      border-radius: 12px;
      background: #f9e4ee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      flex-shrink: 0;
    }

    .manga-info {
      flex: 1;
      min-width: 0;
    }

    .manga-info h3 {
      margin-top: 0;
      margin-bottom: 8px;
      color: #963f6b;
      font-size: 21px;
    }

    .description {
      color: #765c69;
      line-height: 1.7;
      margin: 8px 0;
      white-space: pre-wrap;
    }

    .genres {
      color: #b25882;
      margin: 8px 0;
      font-size: 14px;
    }

    .status {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 20px;
      background: #ffe0ed;
      color: #b44776;
      font-size: 13px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .edit-btn,
    .delete-btn {
      padding: 9px 15px;
      border-radius: 12px;
      font-weight: bold;
    }

    .edit-btn {
      background: #ffe1ee;
      color: #a84370;
    }

    .delete-btn {
      background: #ffe5e8;
      color: #c13e55;
    }

    .chapters {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #f0dce5;
    }

    .chapters h4 {
      margin: 0 0 12px;
      color: #8f4969;
    }

    .chapter-item {
      background: white;
      border: 1px solid #f2dce6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .chapter-name {
      flex: 1;
      line-height: 1.7;
    }

    .chapter-delete {
      background: #fff0f2;
      color: #c64b60;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 13px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #9a7c8b;
      background: white;
      border-radius: 15px;
      line-height: 1.8;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #a25b7c;
      line-height: 1.8;
    }

    .error-box {
      background: #fff0f2;
      color: #a52d49;
      border: 1px solid #f3b8c6;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      line-height: 1.8;
    }

    .refresh-btn {
      margin-top: 10px;
      background: #e989b5;
      color: white;
      padding: 9px 18px;
      border-radius: 12px;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .stats {
        grid-template-columns: 1fr;
      }

      .box {
        padding: 18px;
      }

      .manga-top {
        flex-direction: column;
      }

      .cover,
      .cover-placeholder {
        width: 140px;
        height: 190px;
        margin: auto;
      }

      .manga-info {
        width: 100%;
      }

      .chapter-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .chapter-delete {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>🌸 لوحة تحكم Sakura Tales</h1>

  <p>
    إدارة المانهوا والفصول الخاصة بموقعك
  </p>

  <button class="logout" id="logoutBtn">
    تسجيل الخروج
  </button>

</header>


<div class="container">

  <!-- ========================= -->
  <!-- الإحصائيات -->
  <!-- ========================= -->

  <div class="stats">

    <div class="stat">
      <span>📚</span>
      <strong id="mangaCount">0</strong>
      <small>عدد المانهوا</small>
    </div>

    <div class="stat">
      <span>📖</span>
      <strong id="chapterCount">0</strong>
      <small>عدد الفصول</small>
    </div>

  </div>


  <!-- ========================= -->
  <!-- إضافة مانهوا -->
  <!-- ========================= -->

  <div class="box">

    <h2>🌸 إضافة مانهوا جديدة</h2>

    <label for="title">
      اسم المانهوا
    </label>

    <input
      id="title"
      type="text"
      placeholder="مثال: Sakura Love"
    >


    <label for="description">
      الوصف
    </label>

    <textarea
      id="description"
      placeholder="اكتبي وصف المانهوا..."
    ></textarea>


    <label for="genres">
      التصنيفات
    </label>

    <input
      id="genres"
      type="text"
      placeholder="رومانسي, كوميدي, مدرسي"
    >


    <label for="status">
      الحالة
    </label>

    <select id="status">

      <option value="مستمرة">
        🟢 مستمرة
      </option>

      <option value="مكتملة">
        🔵 مكتملة
      </option>

      <option value="متوقفة">
        🟡 متوقفة
      </option>

    </select>


    <label for="cover">
      رابط صورة الغلاف
    </label>

    <input
      id="cover"
      type="url"
      placeholder="https://..."
    >


    <button
      class="main-btn"
      id="addBtn"
    >
      ➕ إضافة المانهوا
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- ========================= -->
  <!-- إضافة فصل -->
  <!-- ========================= -->

  <div class="box">

    <h2>📖 إضافة فصل جديد</h2>


    <label for="mangaSelect">
      اختاري المانهوا
    </label>

    <select id="mangaSelect">

      <option value="">
        -- اختاري المانهوا --
      </option>

    </select>


    <label for="chapterNumber">
      رقم الفصل
    </label>

    <input
      id="chapterNumber"
      type="number"
      min="1"
      placeholder="مثال: 1"
    >


    <label for="chapterTitle">
      عنوان الفصل
    </label>

    <input
      id="chapterTitle"
      type="text"
      placeholder="مثال: بداية الحكاية"
    >


    <label for="pages">
      روابط صفحات الفصل
    </label>

    <textarea
      id="pages"
      placeholder="ضعي كل رابط صورة في سطر منفصل
https://example.com/page1.jpg
https://example.com/page2.jpg"
    ></textarea>


    <button
      class="main-btn"
      id="addChapterBtn"
    >
      📖 إضافة الفصل
    </button>


    <div
      id="chapterMessage"
      class="message"
    ></div>

  </div>


  <!-- ========================= -->
  <!-- قائمة المانهوا -->
  <!-- ========================= -->

  <div class="box">

    <h2>
      📚 المانهوا الموجودة
    </h2>


    <div class="search-box">

      <input
        id="searchInput"
        type="search"
        placeholder="🔎 ابحثي عن مانهوا..."
      >

    </div>


    <div id="mangaList">

      <div class="loading">
        🌸 جاري تحميل المانهوا...
      </div>

    </div>

  </div>

</div>


<script type="module">

  import { auth, db } from "./firebase.js";


  import {
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    updateDoc,
    doc
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  // =========================================
  // عناصر الصفحة
  // =========================================

  const title =
    document.getElementById("title");

  const description =
    document.getElementById("description");

  const genres =
    document.getElementById("genres");

  const status =
    document.getElementById("status");

  const cover =
    document.getElementById("cover");

  const addBtn =
    document.getElementById("addBtn");

  const message =
    document.getElementById("message");


  const mangaSelect =
    document.getElementById("mangaSelect");

  const chapterNumber =
    document.getElementById("chapterNumber");

  const chapterTitle =
    document.getElementById("chapterTitle");

  const pages =
    document.getElementById("pages");

  const addChapterBtn =
    document.getElementById("addChapterBtn");

  const chapterMessage =
    document.getElementById("chapterMessage");


  const mangaList =
    document.getElementById("mangaList");

  const searchInput =
    document.getElementById("searchInput");


  const mangaCount =
    document.getElementById("mangaCount");

  const chapterCount =
    document.getElementById("chapterCount");


  const logoutBtn =
    document.getElementById("logoutBtn");


  let allManga = [];


  // =========================================
  // رسائل
  // =========================================

  function showMessage(element, text, type) {

    element.textContent = text;

    element.className =
      "message " + type;

    setTimeout(() => {

      element.className = "message";

      element.textContent = "";

    }, 4000);

  }


  // =========================================
  // تسجيل الدخول
  // =========================================

  onAuthStateChanged(auth, async (user) => {

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    console.log(
      "تم تسجيل الدخول:",
      user.email
    );


    await loadManga();

  });


  // =========================================
  // تسجيل الخروج
  // =========================================

  logoutBtn.addEventListener(
    "click",
    async () => {

      try {

        await signOut(auth);

        window.location.href =
          "login.html";

      } catch (error) {

        console.error(error);

        alert(
          "حدث خطأ أثناء تسجيل الخروج"
        );

      }

    }
  );


  // =========================================
  // إضافة مانهوا
  // =========================================

  addBtn.addEventListener(
    "click",
    async () => {

      const mangaTitle =
        title.value.trim();


      const mangaDescription =
        description.value.trim();


      const mangaGenres =
        genres.value
          .split(",")
          .map(x => x.trim())
          .filter(x => x);


      const mangaStatus =
        status.value;


      const mangaCover =
        cover.value.trim();


      if (!mangaTitle) {

        showMessage(
          message,
          "اكتبي اسم المانهوا أولاً 🌸",
          "error"
        );

        return;

      }


      addBtn.disabled = true;

      addBtn.textContent =
        "جاري الإضافة...";


      try {

        await addDoc(
          collection(db, "manga"),
          {

            title: mangaTitle,

            description:
              mangaDescription,

            genres:
              mangaGenres,

            status:
              mangaStatus,

            cover:
              mangaCover,

            createdAt:
              new Date().toISOString()

          }
        );


        showMessage(
          message,
          "تمت إضافة المانهوا بنجاح 🌸",
          "success"
        );


        title.value = "";

        description.value = "";

        genres.value = "";

        status.value = "مستمرة";

        cover.value = "";


        await loadManga();

      } catch (error) {

        console.error(
          "خطأ إضافة المانهوا:",
          error
        );


        showMessage(
          message,
          "لم تتم الإضافة. تأكدي من صلاحيات Firestore ❌",
          "error"
        );

      }


      addBtn.disabled = false;

      addBtn.textContent =
        "➕ إضافة المانهوا";

    }
  );


  // =========================================
  // إضافة فصل
  // =========================================

  addChapterBtn.addEventListener(
    "click",
    async () => {

      const mangaId =
        mangaSelect.value;


      const number =
        Number(chapterNumber.value);


      const titleValue =
        chapterTitle.value.trim();


      const pageLinks =
        pages.value
          .split("\n")
          .map(x => x.trim())
          .filter(x => x);


      if (!mangaId) {

        showMessage(
          chapterMessage,
          "اختاري المانهوا أولاً 🌸",
          "error"
        );

        return;

      }


      if (!number || number < 1) {

        showMessage(
          chapterMessage,
          "اكتبي رقم فصل صحيح 📖",
          "error"
        );

        return;

      }


      if (!titleValue) {

        showMessage(
          chapterMessage,
          "اكتبي عنوان الفصل 🌸",
          "error"
        );

        return;

      }


      if (pageLinks.length === 0) {

        showMessage(
          chapterMessage,
          "أضيفي روابط صفحات الفصل 📷",
          "error"
        );

        return;

      }


      addChapterBtn.disabled = true;

      addChapterBtn.textContent =
        "جاري إضافة الفصل...";


      try {

        await addDoc(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          ),
          {

            number: number,

            title: titleValue,

            pages: pageLinks,

            createdAt:
              new Date().toISOString()

          }
        );


        showMessage(
          chapterMessage,
          "تمت إضافة الفصل بنجاح 📖🌸",
          "success"
        );


        chapterNumber.value = "";

        chapterTitle.value = "";

        pages.value = "";


        await loadManga();

      } catch (error) {

        console.error(
          "خطأ إضافة الفصل:",
          error
        );


        showMessage(
          chapterMessage,
          "حدث خطأ أثناء إضافة الفصل ❌",
          "error"
        );

      }


      addChapterBtn.disabled = false;

      addChapterBtn.textContent =
        "📖 إضافة الفصل";

    }
  );


  // =========================================
  // تحميل المانهوا
  // =========================================

  async function loadManga() {

    mangaList.innerHTML =
      `
      <div class="loading">
        🌸 جاري تحميل المانهوا...
      </div>
      `;


    try {

      console.log(
        "جاري قراءة مجموعة manga..."
      );


      const snapshot =
        await getDocs(
          collection(db, "manga")
        );


      console.log(
        "عدد المانهوا:",
        snapshot.size
      );


      allManga = [];


      snapshot.forEach((item) => {

        allManga.push({

          id: item.id,

          ...item.data()

        });

      });


      allManga.sort(
        (a, b) => {

          return String(
            b.createdAt || ""
          ).localeCompare(
            String(
              a.createdAt || ""
            )
          );

        }
      );


      mangaCount.textContent =
        allManga.length;


      updateMangaSelect();


      await renderManga(allManga);


    } catch (error) {

      console.error(
        "خطأ تحميل المانهوا:",
        error
      );


      mangaList.innerHTML =
        `
        <div class="error-box">

          ❌ لم يتم تحميل المانهوا

          <br><br>

          <small>
            ${error.code || "خطأ غير معروف"}
          </small>

          <br>

          <small>
            ${error.message || ""}
          </small>

          <br>

          <button
            class="refresh-btn"
            id="refreshBtn"
          >
            🔄 إعادة المحاولة
          </button>

        </div>
        `;


      const refreshBtn =
        document.getElementById(
          "refreshBtn"
        );


      if (refreshBtn) {

        refreshBtn.addEventListener(
          "click",
          loadManga
        );

      }

    }

  }


  // =========================================
  // قائمة اختيار المانهوا
  // =========================================

  function updateMangaSelect() {

    mangaSelect.innerHTML =
      `
      <option value="">
        -- اختاري المانهوا --
      </option>
      `;


    allManga.forEach((item) => {

      const option =
        document.createElement("option");


      option.value =
        item.id;


      option.textContent =
        item.title || "بدون اسم";


      mangaSelect.appendChild(
        option
      );

    });

  }


  // =========================================
  // البحث
  // =========================================

  searchInput.addEventListener(
    "input",
    () => {

      const value =
        searchInput.value
          .trim()
          .toLowerCase();


      if (!value) {

        renderManga(allManga);

        return;

      }


      const filtered =
        allManga.filter((item) => {

          const titleText =
            String(
              item.title || ""
            ).toLowerCase();


          const descriptionText =
            String(
              item.description || ""
            ).toLowerCase();


          const genresText =
            Array.isArray(item.genres)
              ? item.genres.join(" ").toLowerCase()
              : String(
                  item.genres || ""
