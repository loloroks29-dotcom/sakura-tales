<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة التحكم | Sakura Tales</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #f7b6d2, #e99abd);
      padding: 25px 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(180,100,140,.15);
    }

    header h1 {
      margin: 0;
      color: white;
      font-size: 27px;
    }

    header p {
      color: white;
      margin: 8px 0 15px;
    }

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(180,100,140,.12);
    }

    h2 {
      color: #a64f78;
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #efc4d7;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: white;
      color: #633f51;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #d96f9d;
      box-shadow: 0 0 0 3px rgba(217,111,157,.10);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      background: #d96f9d;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .delete {
      background: #d9536f;
    }

    .edit {
      background: #8e79c9;
    }

    .refresh {
      background: #77a6b6;
    }

    .logout {
      background: white;
      color: #a64f78;
    }

    .message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      background: #fff0f6;
      min-height: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: #fff0f6;
      border-radius: 17px;
      padding: 18px;
      text-align: center;
    }

    .stat:nth-child(2) {
      background: #f7f0ff;
    }

    .stat-icon {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
      color: #a64f78;
    }

    .stat-title {
      font-size: 13px;
      color: #8b6878;
      margin-top: 4px;
    }

    .search-area {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .search-area input {
      margin: 0;
    }

    .manga {
      border: 1px solid #f0d4df;
      border-radius: 18px;
      padding: 17px;
      margin-top: 15px;
      background: #fffdfE;
    }

    .manga-header {
      display: flex;
      gap: 15px;
      align-items: flex-start;
    }

    .manga img {
      width: 110px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      flex-shrink: 0;
      background: #fff0f6;
    }

    .manga-info {
      flex: 1;
    }

    .manga h3 {
      margin-top: 0;
      color: #9b4770;
    }

    .manga p {
      line-height: 1.7;
    }

    .status {
      display: inline-block;
      background: #ffe5ef;
      color: #9b4770;
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 13px;
    }

    .chapter {
      background: #fff7fb;
      padding: 13px;
      border-radius: 13px;
      margin-top: 10px;
      border: 1px solid #f0d4df;
    }

    .chapter-actions {
      margin-top: 7px;
    }

    .small {
      font-size: 13px;
      color: #8b6878;
    }

    .empty {
      text-align: center;
      padding: 25px;
      color: #8b6878;
    }

    .cover-preview {
      display: none;
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 13px;
      margin-top: 8px;
      border: 2px solid #f0d4df;
    }

    @media (max-width: 600px) {

      .container {
        padding: 10px;
      }

      .box {
        padding: 17px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .manga-header {
        flex-direction: column;
      }

      .manga img {
        width: 130px;
        height: 175px;
      }

      .search-area {
        flex-direction: column;
        align-items: stretch;
      }

      .search-area button {
        width: 100%;
      }

    }

  </style>
</head>

<body>

<header>

  <h1>🌸 لوحة تحكم Sakura Tales</h1>

  <p>إدارة المانهوا والفصول</p>

  <button class="logout" id="logoutBtn">
    تسجيل الخروج
  </button>

</header>


<div class="container">


  <!-- الإحصائيات -->

  <div class="box">

    <div class="stats">

      <div class="stat">

        <div class="stat-icon">📚</div>

        <div
          class="stat-number"
          id="mangaCount"
        >
          0
        </div>

        <div class="stat-title">
          عدد المانهوا
        </div>

      </div>


      <div class="stat">

        <div class="stat-icon">📖</div>

        <div
          class="stat-number"
          id="chapterCount"
        >
          0
        </div>

        <div class="stat-title">
          عدد الفصول
        </div>

      </div>

    </div>

    <button
      class="refresh"
      id="refreshBtn"
    >
      🔄 تحديث البيانات
    </button>

  </div>



  <!-- إضافة مانهوا -->

  <div class="box">

    <h2>📚 إضافة مانهوا جديدة</h2>

    <input
      id="title"
      placeholder="اسم المانهوا"
    >

    <textarea
      id="description"
      placeholder="وصف المانهوا"
    ></textarea>

    <input
      id="genres"
      placeholder="التصنيفات، مثال: رومانسية, كوميديا, مدرسية"
    >

    <select id="status">

      <option value="مستمرة">
        مستمرة
      </option>

      <option value="مكتملة">
        مكتملة
      </option>

      <option value="متوقفة">
        متوقفة
      </option>

    </select>

    <input
      id="cover"
      placeholder="رابط صورة الغلاف"
    >

    <img
      id="coverPreview"
      class="cover-preview"
      alt="معاينة الغلاف"
    >

    <br>

    <button id="addBtn">
      ➕ إضافة المانهوا
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </div>



  <!-- إضافة فصل -->

  <div class="box">

    <h2>📖 إضافة فصل جديد</h2>

    <select id="mangaSelect">

      <option value="">
        اختاري المانهوا
      </option>

    </select>

    <input
      id="chapterNumber"
      type="number"
      placeholder="رقم الفصل، مثال: 1"
    >

    <input
      id="chapterTitle"
      placeholder="اسم الفصل، مثال: البداية"
    >

    <textarea
      id="pages"
      placeholder="ضعي روابط صور صفحات الفصل هنا، كل رابط في سطر منفصل"
    ></textarea>

    <p class="small">

      💡 كل رابط في سطر منفصل.

      <br>

      مثال:

      <br>

      https://i.ibb.co/xxxx/page1.jpg

      <br>

      https://i.ibb.co/xxxx/page2.jpg

    </p>

    <button id="addChapterBtn">
      ➕ إضافة الفصل
    </button>

    <div
      class="message"
      id="chapterMessage"
    ></div>

  </div>



  <!-- المانهوا -->

  <div class="box">

    <h2>📚 المانهوا الموجودة</h2>

    <div class="search-area">

      <input
        id="searchManga"
        type="search"
        placeholder="🔎 ابحثي عن مانهوا..."
      >

      <button
        class="refresh"
        id="refreshListBtn"
      >
        🔄 تحديث
      </button>

    </div>

    <div id="mangaList">
      جاري تحميل المانهوا...
    </div>

  </div>


</div>



<script type="module">

  import { auth, db }
  from "./firebase.js";


  import {
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    updateDoc,
    doc
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



  const title =
    document.getElementById("title");

  const description =
    document.getElementById("description");

  const genres =
    document.getElementById("genres");

  const status =
    document.getElementById("status");

  const cover =
    document.getElementById("cover");

  const coverPreview =
    document.getElementById("coverPreview");

  const addBtn =
    document.getElementById("addBtn");

  const message =
    document.getElementById("message");

  const mangaList =
    document.getElementById("mangaList");

  const logoutBtn =
    document.getElementById("logoutBtn");

  const mangaSelect =
    document.getElementById("mangaSelect");

  const chapterNumber =
    document.getElementById("chapterNumber");

  const chapterTitle =
    document.getElementById("chapterTitle");

  const pages =
    document.getElementById("pages");

  const addChapterBtn =
    document.getElementById("addChapterBtn");

  const chapterMessage =
    document.getElementById("chapterMessage");

  const mangaCount =
    document.getElementById("mangaCount");

  const chapterCount =
    document.getElementById("chapterCount");

  const searchManga =
    document.getElementById("searchManga");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const refreshListBtn =
    document.getElementById("refreshListBtn");


  let allManga = [];



  // التأكد من تسجيل الدخول

  onAuthStateChanged(
    auth,
    (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }

      loadManga();

    }
  );



  // تسجيل الخروج

  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

      window.location.href =
        "login.html";

    }
  );



  // معاينة الغلاف

  cover.addEventListener(
    "input",
    () => {

      const url =
        cover.value.trim();

      if (!url) {

        coverPreview.style.display =
          "none";

        coverPreview.src = "";

        return;

      }

      coverPreview.src = url;

      coverPreview.style.display =
        "block";

    }
  );



  // إضافة مانهوا

  addBtn.addEventListener(
    "click",
    async () => {

      if (!title.value.trim()) {

        message.textContent =
          "اكتبي اسم المانهوا أولاً 🌸";

        return;

      }


      message.textContent =
        "جاري إضافة المانهوا...";


      try {

        await addDoc(
          collection(db, "manga"),
          {

            title:
              title.value.trim(),

            description:
              description.value.trim(),

            genres:
              genres.value
                .split(",")
                .map(x => x.trim())
                .filter(x => x),

            status:
              status.value,

            cover:
              cover.value.trim(),

            createdAt:
              new Date().toISOString()

          }
        );


        message.textContent =
          "تمت إضافة المانهوا بنجاح 💗";


        title.value = "";
        description.value = "";
        genres.value = "";
        cover.value = "";

        coverPreview.src = "";
        coverPreview.style.display =
          "none";

        status.value =
          "مستمرة";


        loadManga();


      } catch (error) {

        console.error(error);

        message.textContent =
          "حدث خطأ: " +
          error.message;

      }

    }
  );



  // إضافة فصل

  addChapterBtn.addEventListener(
    "click",
    async () => {

      const mangaId =
        mangaSelect.value;


      if (!mangaId) {

        chapterMessage.textContent =
          "اختاري المانهوا أولاً 🌸";

        return;

      }


      if (!chapterNumber.value) {

        chapterMessage.textContent =
          "اكتبي رقم الفصل 🌸";

        return;

      }


      const pageLinks =
        pages.value
          .split("\n")
          .map(x => x.trim())
          .filter(x => x);


      if (pageLinks.length === 0) {

        chapterMessage.textContent =
          "ضعي رابط صفحة واحدة على الأقل 🌸";

        return;

      }


      chapterMessage.textContent =
        "جاري إضافة الفصل...";


      try {

        await addDoc(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          ),
          {

            number:
              Number(chapterNumber.value),

            title:
              chapterTitle.value.trim(),

            pages:
              pageLinks,

            createdAt:
              new Date().toISOString()

          }
        );


        chapterMessage.textContent =
          "تمت إضافة الفصل بنجاح 💗";


        chapterNumber.value = "";
        chapterTitle.value = "";
        pages.value = "";


        loadManga();


      } catch (error) {

        console.error(error);

        chapterMessage.textContent =
          "حدث خطأ: " +
          error.message;

      }

    }
  );



  // البحث

  searchManga.addEventListener(
    "input",
    () => {

      renderManga();

    }
  );



  // تحديث

  refreshBtn.addEventListener(
    "click",
    () => {

      loadManga();

    }
  );


  refreshListBtn.addEventListener(
    "click",
    () => {

      loadManga();

    }
  );



  // تحميل المانهوا

  async function loadManga() {

    mangaList.innerHTML =
      "جاري التحميل... 🌸";


    mangaSelect.innerHTML =
      '<option value="">اختاري المانهوا</option>';


    try {

      const snapshot =
        await getDocs(
          collection(db, "manga")
        );


      allManga = [];


      if (snapshot.empty) {

        mangaList.innerHTML =
          '<div class="empty">لا توجد مانهوا حتى الآن 🌸</div>';

        mangaCount.textContent =
          "0";

        chapterCount.textContent =
          "0";

        return;

      }


      snapshot.forEach(
        (item) => {

          const data =
            item.data();


          allManga.push({

            id:
              item.id,

            ...data

          });


          const option =
            document.createElement(
              "option"
            );

          option.value =
            item.id;

          option.textContent =
            data.title ||
            "بدون اسم";

          mangaSelect.appendChild(
            option
          );

        }
      );


      mangaCount.textContent =
        allManga.length;


      // حساب عدد الفصول

      let totalChapters = 0;


      for (
        const manga
        of allManga
      ) {

        try {

          const snapshot =
            await getDocs(
              collection(
                db,
                "manga",
                manga.id,
                "chapters"
              )
            );

          totalChapters +=
            snapshot.size;

        } catch (error) {

          console.error(
            "خطأ في حساب الفصول:",
            error
          );

        }

      }


      chapterCount.textContent =
        totalChapters;


      renderManga();


    } catch (error) {

      console.error(error);

      mangaList.innerHTML =
        "حدث خطأ أثناء تحميل المانهوا: " +
        error.message;

    }

  }



  // عرض المانهوا

  function renderManga() {

    const search =
      searchManga.value
        .trim()
        .toLowerCase();


    const filtered =
      allManga.filter(
        manga =>
          (manga.title || "")
            .toLowerCase()
            .includes(search)
      );


    if (
      filtered.length === 0
    ) {

      mangaList.innerHTML =
        '<div class="empty">لم يتم العثور على مانهوا بهذا الاسم 🔎🌸</div>';

      return;

    }


    mangaList.innerHTML = "";


    filtered.forEach(
      (manga) => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "manga";


        const mangaHeader =
          document.createElement(
            "div"
          );

        mangaHeader.className =
          "manga-header";


        if (manga.cover) {

          const img =
            document.createElement(
              "img"
            );

          img.src =
            manga.cover;

          img.alt =
            "غلاف " +
            (manga.title || "");

          img.onerror =
            () => {

              img.style.display =
                "none";

            };

          mangaHeader.appendChild(
            img
          );

        }


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "manga-info";


        const h3 =
          document.createElement(
            "h3"
          );

        h3.textContent =
          manga.title ||
          "بدون اسم";


        const descriptionEl =
          document.createElement(
            "p"
          );

        descriptionEl.textContent =
          manga.description ||
          "";


        const genresEl =
          document.createElement(
            "p"
          );


        const genresText =
          Array.isArray(
            manga.genres
          )
            ? manga.genres.join("، ")
            : "";


        genresEl.innerHTML =
          "<strong>التصنيفات:</strong> " +
          genresText;


        const statusEl =
          document.createElement(
            "span"
          );

        statusEl.className =
          "status";

        statusEl.textContent =
          manga.status ||
          "مستمرة";


        const editBtn =
          document.createElement(
            "button"
          );

        editBtn.className =
          "edit";

        editBtn.textContent =
          "✏️ تعديل";


        const deleteBtn =
          document.createElement(
            "button"
          );

        deleteBtn.className =
          "delete";

        deleteBtn.textContent =
          "🗑️ حذف";


        info.appendChild(h3);

        info.appendChild(
          statusEl
        );

        info.appendChild(
          descriptionEl
        );

        info.appendChild(
          genresEl
        );

        info.appendChild(
          editBtn
        );

        info.appendChild(
          deleteBtn
        );


        mangaHeader.appendChild(
          info
        );


        div.appendChild(
          mangaHeader
        );


        const chapterList =
          document.createElement(
            "div"
          );

        chapterList.className =
          "chapterList";


        chapterList.innerHTML =
          "جاري تحميل الفصول... 📖";


        div.appendChild(
          chapterList
        );


        mangaList.appendChild(
          div
        );



        // حذف المانهوا

        deleteBtn.addEventListener(
          "click",
          async () => {

            const ok =
              confirm(
                "⚠️ هل أنتِ متأكدة من حذف هذه المانهوا؟\n\n" +
                "هذا سيحذف وثيقة المانهوا فقط.\n" +
                "تأكدي قبل المتابعة."
              );


            if (!ok)
              return;


            try {

              await deleteDoc(
                doc(
                  db,
                  "manga",
                  manga.id
                )
              );


              message.textContent =
                "تم حذف المانهوا 🗑️";


              loadManga();


            } catch (error) {

              console.error(error);

              message.textContent =
                "خطأ في الحذف: " +
                error.message;

            }

          }
        );



        // تعديل المانهوا

        editBtn.addEventListener(
          "click",
          async () => {

            const newTitle =
              prompt(
                "اسم المانهوا:",
                manga.title || ""
              );


            if (
              newTitle === null
            )
              return;


            const newDescription =
              prompt(
