<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | Sakura Tales</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #f7b6d2, #e99abd);
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: white;
    }

    header p {
      color: white;
      margin: 8px 0;
    }

    .container {
      max-width: 900px;
      margin: 25px auto;
      padding: 15px;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(180,100,140,.12);
    }

    h2 {
      color: #a64f78;
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #efc4d7;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      background: white;
      color: #633f51;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      border: 0;
      padding: 12px 18px;
      border-radius: 12px;
      background: #d96f9d;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      background: #c85d8d;
    }

    .delete {
      background: #d9536f;
    }

    .edit {
      background: #8e79c9;
    }

    .logout {
      background: white;
      color: #a64f78;
    }

    .message {
      padding: 10px;
      margin-top: 10px;
      border-radius: 10px;
      background: #fff0f6;
    }

    .manga {
      border: 1px solid #f0d4df;
      border-radius: 15px;
      padding: 15px;
      margin-top: 15px;
    }

    .manga img {
      width: 110px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      display: block;
      margin-bottom: 10px;
    }

    .chapter {
      background: #fff7fb;
      padding: 12px;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid #f0d4df;
    }

    .small {
      font-size: 13px;
      color: #8b6878;
    }


    /* =========================
       نافذة التعديل
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(70, 30, 50, .45);
      z-index: 9999;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.show {
      display: block;
    }

    .modal-box {
      max-width: 650px;
      margin: 30px auto;
      background: white;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 15px 50px rgba(100, 40, 70, .25);
    }

    .modal-title {
      text-align: center;
      color: #a64f78;
      margin-top: 0;
    }

    .close-modal {
      float: left;
      width: 40px;
      height: 40px;
      padding: 0;
      margin: 0;
      border-radius: 50%;
      background: #ffe5ef;
      color: #a64f78;
      font-size: 20px;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-buttons button {
      flex: 1;
      margin: 0;
    }

    .save-edit {
      background: #d96f9d;
    }

    .cancel-edit {
      background: #eee;
      color: #633f51;
    }

    .edit-cover-preview {
      display: none;
      width: 120px;
      height: 160px;
      object-fit: cover;
      border-radius: 14px;
      margin: 8px auto;
      border: 2px solid #f0d4df;
    }


    @media (max-width: 600px) {

      .container {
        padding: 10px;
      }

      .box {
        padding: 16px;
      }

      .modal {
        padding: 10px;
      }

      .modal-box {
        margin: 10px auto;
        padding: 17px;
      }

      .modal-buttons {
        flex-direction: column;
      }

    }

  </style>
</head>


<body>


<header>

  <h1>🌸 لوحة تحكم Sakura Tales</h1>

  <p>إدارة المانهوا والفصول</p>

  <button class="logout" id="logoutBtn">
    تسجيل الخروج
  </button>

</header>



<div class="container">


  <!-- إضافة مانهوا -->

  <div class="box">

    <h2>📚 إضافة مانهوا جديدة</h2>

    <input
      id="title"
      placeholder="اسم المانهوا"
    >

    <textarea
      id="description"
      placeholder="وصف المانهوا"
    ></textarea>

    <input
      id="genres"
      placeholder="التصنيفات، مثال: Romance, Comedy, School"
    >

    <select id="status">

      <option value="مستمرة">
        مستمرة
      </option>

      <option value="مكتملة">
        مكتملة
      </option>

      <option value="متوقفة">
        متوقفة
      </option>

    </select>

    <input
      id="cover"
      placeholder="رابط صورة الغلاف"
    >

    <button id="addBtn">
      ➕ إضافة المانهوا
    </button>

    <div
      class="message"
      id="message"
    ></div>

  </div>



  <!-- إضافة فصل -->

  <div class="box">

    <h2>📖 إضافة فصل جديد</h2>

    <select id="mangaSelect">

      <option value="">
        اختاري المانهوا
      </option>

    </select>

    <input
      id="chapterNumber"
      type="number"
      placeholder="رقم الفصل، مثال: 1"
    >

    <input
      id="chapterTitle"
      placeholder="اسم الفصل، مثال: البداية"
    >

    <textarea
      id="pages"
      placeholder="ضعي روابط صور صفحات الفصل هنا، كل رابط في سطر منفصل"
    ></textarea>

    <p class="small">

      💡 كل رابط في سطر منفصل.

      <br>

      https://i.ibb.co/xxxx/page1.jpg

      <br>

      https://i.ibb.co/xxxx/page2.jpg

    </p>

    <button id="addChapterBtn">
      ➕ إضافة الفصل
    </button>

    <div
      class="message"
      id="chapterMessage"
    ></div>

  </div>



  <!-- المانهوا -->

  <div class="box">

    <h2>📚 المانهوا الموجودة</h2>

    <div id="mangaList">
      جاري تحميل المانهوا...
    </div>

  </div>


</div>



<!-- =========================
     نافذة تعديل المانهوا
========================= -->

<div
  class="modal"
  id="editModal"
>

  <div class="modal-box">

    <button
      class="close-modal"
      id="closeModal"
    >
      ×
    </button>

    <h2 class="modal-title">
      ✏️ تعديل المانهوا
    </h2>


    <label>
      اسم المانهوا
    </label>

    <input
      id="editTitle"
      placeholder="اسم المانهوا"
    >


    <label>
      وصف المانهوا
    </label>

    <textarea
      id="editDescription"
      placeholder="وصف المانهوا"
    ></textarea>


    <label>
      التصنيفات
    </label>

    <input
      id="editGenres"
      placeholder="مثال: كوميديا, فانتازيا, مدرسية"
    >


    <label>
      الحالة
    </label>

    <select id="editStatus">

      <option value="مستمرة">
        مستمرة
      </option>

      <option value="مكتملة">
        مكتملة
      </option>

      <option value="متوقفة">
        متوقفة
      </option>

    </select>


    <label>
      رابط الغلاف
    </label>

    <input
      id="editCover"
      placeholder="رابط صورة الغلاف"
    >


    <img
      id="editCoverPreview"
      class="edit-cover-preview"
      alt="معاينة الغلاف"
    >


    <div class="modal-buttons">

      <button
        class="save-edit"
        id="saveEdit"
      >
        💾 حفظ التعديلات
      </button>

      <button
        class="cancel-edit"
        id="cancelEdit"
      >
        ❌ إلغاء
      </button>

    </div>


    <div
      class="message"
      id="editMessage"
    ></div>

  </div>

</div>



<script type="module">


  import {
    auth,
    db
  }
  from "./firebase.js";


  import {
    onAuthStateChanged,
    signOut
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    updateDoc,
    doc
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



  /* =========================
     العناصر
  ========================= */

  const title =
    document.getElementById("title");

  const description =
    document.getElementById("description");

  const genres =
    document.getElementById("genres");

  const status =
    document.getElementById("status");

  const cover =
    document.getElementById("cover");

  const addBtn =
    document.getElementById("addBtn");

  const message =
    document.getElementById("message");

  const mangaList =
    document.getElementById("mangaList");

  const logoutBtn =
    document.getElementById("logoutBtn");


  const mangaSelect =
    document.getElementById("mangaSelect");

  const chapterNumber =
    document.getElementById("chapterNumber");

  const chapterTitle =
    document.getElementById("chapterTitle");

  const pages =
    document.getElementById("pages");

  const addChapterBtn =
    document.getElementById("addChapterBtn");

  const chapterMessage =
    document.getElementById("chapterMessage");


  /* =========================
     عناصر نافذة التعديل
  ========================= */

  const editModal =
    document.getElementById("editModal");

  const closeModal =
    document.getElementById("closeModal");

  const cancelEdit =
    document.getElementById("cancelEdit");

  const saveEdit =
    document.getElementById("saveEdit");

  const editTitle =
    document.getElementById("editTitle");

  const editDescription =
    document.getElementById("editDescription");

  const editGenres =
    document.getElementById("editGenres");

  const editStatus =
    document.getElementById("editStatus");

  const editCover =
    document.getElementById("editCover");

  const editCoverPreview =
    document.getElementById("editCoverPreview");

  const editMessage =
    document.getElementById("editMessage");


  let editingMangaId = null;



  /* =========================
     تسجيل الدخول
  ========================= */

  onAuthStateChanged(
    auth,
    (user) => {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }

      loadManga();

    }
  );



  /* =========================
     تسجيل الخروج
  ========================= */

  logoutBtn.addEventListener(
    "click",
    async () => {

      await signOut(auth);

      window.location.href =
        "login.html";

    }
  );



  /* =========================
     إضافة مانهوا
  ========================= */

  addBtn.addEventListener(
    "click",
    async () => {

      if (!title.value.trim()) {

        message.textContent =
          "اكتبي اسم المانهوا أولاً 🌸";

        return;

      }


      message.textContent =
        "جاري إضافة المانهوا...";


      try {

        await addDoc(
          collection(db, "manga"),
          {

            title:
              title.value.trim(),

            description:
              description.value.trim(),

            genres:
              genres.value
                .split(",")
                .map(
                  x => x.trim()
                )
                .filter(
                  x => x
                ),

            status:
              status.value,

            cover:
              cover.value.trim(),

            createdAt:
              new Date().toISOString()

          }
        );


        message.textContent =
          "تمت إضافة المانهوا بنجاح 💗";


        title.value = "";
        description.value = "";
        genres.value = "";
        cover.value = "";

        status.value =
          "مستمرة";


        loadManga();


      } catch (error) {

        console.error(error);

        message.textContent =
          "حدث خطأ: " +
          error.message;

      }

    }
  );



  /* =========================
     إضافة فصل
  ========================= */

  addChapterBtn.addEventListener(
    "click",
    async () => {

      const mangaId =
        mangaSelect.value;


      if (!mangaId) {

        chapterMessage.textContent =
          "اختاري المانهوا أولاً 🌸";

        return;

      }


      if (!chapterNumber.value) {

        chapterMessage.textContent =
          "اكتبي رقم الفصل 🌸";

        return;

      }


      const pageLinks =
        pages.value
          .split("\n")
          .map(
            x => x.trim()
          )
          .filter(
            x => x
          );


      if (
        pageLinks.length === 0
      ) {

        chapterMessage.textContent =
          "ضعي رابط صفحة واحدة على الأقل 🌸";

        return;

      }


      chapterMessage.textContent =
        "جاري إضافة الفصل...";


      try {

        await addDoc(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          ),
          {

            number:
              Number(
                chapterNumber.value
              ),

            title:
              chapterTitle.value.trim(),

            pages:
              pageLinks,

            createdAt:
              new Date().toISOString()

          }
        );


        chapterMessage.textContent =
          "تمت إضافة الفصل بنجاح 💗";


        chapterNumber.value = "";
        chapterTitle.value = "";
        pages.value = "";


        loadManga();


      } catch (error) {

        console.error(error);

        chapterMessage.textContent =
          "حدث خطأ: " +
          error.message;

      }

    }
  );



  /* =========================
     تحميل المانهوا
  ========================= */

  async function loadManga() {

    mangaList.innerHTML =
      "جاري التحميل...";


    mangaSelect.innerHTML =
      '<option value="">اختاري المانهوا</option>';


    try {

      const snapshot =
        await getDocs(
          collection(db, "manga")
        );


      if (
        snapshot.empty
      ) {

        mangaList.innerHTML =
          "لا توجد مانهوا حتى الآن 🌸";

        return;

      }


      mangaList.innerHTML = "";


      snapshot.forEach(
        (item) => {

          const data =
            item.data();


          /* إضافة للقائمة */

          const option =
            document.createElement(
              "option"
            );

          option.value =
            item.id;

          option.textContent =
            data.title ||
            "بدون اسم";

          mangaSelect.appendChild(
            option
          );


          /* بطاقة المانهوا */

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "manga";


          div.innerHTML = `

            ${
              data.cover
                ? `
                  <img
                    src="${data.cover}"
                    alt="غلاف المانهوا"
                  >
                `
                : ""
            }

            <h3>
              ${data.title || "بدون اسم"}
            </h3>

            <p>
              ${data.description || ""}
            </p>

            <p>

              <strong>
                التصنيفات:
              </strong>

              ${
                Array.isArray(
                  data.genres
                )
                  ? data.genres.join("، ")
                  : ""
              }

            </p>

            <p>

              <strong>
                الحالة:
              </strong>

              ${data.status || "مستمرة"}

            </p>

            <button
              class="edit"
            >
              ✏️ تعديل
            </button>

            <button
              class="delete"
            >
              🗑️ حذف
            </button>

            <div
              class="chapterList"
            >
              جاري تحميل الفصول...
            </div>

          `;


          /* =========================
             زر التعديل
          ========================= */

          div.querySelector(
            ".edit"
          ).addEventListener(
            "click",
            () => {

              openEditModal(
                item.id,
                data
              );

            }
          );



          /* =========================
             حذف المانهوا
          ========================= */

          div.querySelector(
            ".delete"
          ).addEventListener(
            "click",
            async () => {

              const ok =
                confirm(
                  "⚠️ هل تريدين حذف هذه المانهوا؟"
                );


              if (!ok)
                return;


              try {

                await deleteDoc(
                  doc(
                    db,
                    "manga",
                    item.id
                  )
                );


                message.textContent =
                  "تم حذف المانهوا 🗑️";


                loadManga();


              } catch (error) {

                console.error(
                  error
                );

                message.textContent =
                  "خطأ في الحذف: " +
                  error.message;

              }

            }
          );



          mangaList.appendChild(
            div
          );


          /* تحميل الفصول */

          loadChapters(
            item.id,
            div.querySelector(
              ".chapterList"
            )
          );

        }
      );


    } catch (error) {

      console.error(
        error
      );

      mangaList.innerHTML =
        "حدث خطأ أثناء تحميل المانهوا: " +
        error.message;

    }

  }



  /* =========================
     فتح نافذة التعديل
  ========================= */

  function openEditModal(
    mangaId,
    data
  ) {

    editingMangaId =
      mangaId;


    editTitle.value =
      data.title || "";


    editDescription.value =
      data.description || "";


    editGenres.value =
      Array.isArray(
        data.genres
      )
        ? data.genres.join(", ")
        : "";


    editStatus.value =
      data.status || "مستمرة";


    editCover.value =
      data.cover || "";


    updateCoverPreview();


    editMessage.textContent =
      "";


    editModal.classList.add(
      "show"
    );

  }



  /* =========================
     معاينة الغلاف
  ========================= */

  editCover.addEventListener(
    "input",
    () => {

      updateCoverPreview();

    }
  );


  function updateCoverPreview() {

    const url =
      editCover.value.trim();


    if (!url) {

      editCoverPreview.style.display =
        "none";

      editCoverPreview.src =
        "";

      return;

    }


    editCoverPreview.src =
      url;

    editCoverPreview.style.display =
      "block";

  }



  /* =========================
     إغلاق نافذة التعديل
  ========================= */

  function closeEditModal() {

    editModal.classList.remove(
      "show"
    );

    editingMangaId =
      null;

  }


  closeModal.addEventListener(
    "click",
    closeEditModal
  );


  cancelEdit.addEventListener(
    "click",
    closeEditModal
  );


  editModal.addEventListener(
    "click",
    (event) => {

      if (
        event.target ===
        editModal
      ) {

        closeEditModal();

      }

    }
  );



  /* =========================
     حفظ التعديل
  ========================= */

  saveEdit.addEventListener(
    "click",
    async () => {

      if (!editingMangaId)
        return;


      if (
        !editTitle.value.trim()
      ) {

        editMessage.textContent =
          "اكتبي اسم المانهوا 🌸";

        return;

      }


      const allowedStatuses = [
        "مستمرة",
        "متوقفة",
        "مكتملة"
      ];


      if (
        !allowedStatuses.includes(
          editStatus.value
        )
      ) {

        editMessage.textContent =
          "الحالة غير صحيحة 🌸";

        return;

      }


      editMessage.textContent =
        "جاري حفظ التعديلات...";


      try {

        await updateDoc(
          doc(
            db,
            "manga",
            editingMangaId
          ),
          {

            title:
              editTitle.value.trim(),

            description:
              editDescription.value.trim(),

            genres:
