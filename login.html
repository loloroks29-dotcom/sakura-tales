<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Sakura Tales</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff5fa;
      font-family: Arial, sans-serif;
      color: #633f51;
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(180, 100, 140, 0.15);
      text-align: center;
    }

    h1 {
      color: #a64f78;
      margin-bottom: 10px;
    }

    p {
      color: #8d6879;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #edc5d7;
      border-radius: 12px;
      box-sizing: border-box;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: #d96f9d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #c85d8d;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      background: #fff0f6;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <h1>🌸 Sakura Tales</h1>

    <p>تسجيل الدخول إلى لوحة التحكم</p>

    <input
      type="email"
      id="email"
      placeholder="البريد الإلكتروني"
      autocomplete="email"
    >

    <input
      type="password"
      id="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <button id="loginBtn">
      تسجيل الدخول
    </button>

    <div id="message"></div>

  </div>


  <script type="module">

    import { auth } from "./firebase.js";

    import {
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    loginBtn.addEventListener("click", async () => {

      const emailValue = email.value.trim();
      const passwordValue = password.value;

      if (!emailValue || !passwordValue) {

        message.textContent =
          "اكتبي البريد الإلكتروني وكلمة المرور 🌸";

        return;
      }

      message.textContent =
        "جاري تسجيل الدخول...";


      try {

        await signInWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );

        message.textContent =
          "تم تسجيل الدخول بنجاح 💗";

        setTimeout(() => {

          window.location.href = "admin.html";

        }, 700);


      } catch (error) {

        console.error(error);

        if (error.code === "auth/invalid-credential") {

          message.textContent =
            "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        } else if (error.code === "auth/invalid-email") {

          message.textContent =
            "البريد الإلكتروني غير صحيح.";

        } else if (error.code === "auth/too-many-requests") {

          message.textContent =
            "محاولات كثيرة. انتظري قليلًا ثم حاولي مرة أخرى.";

        } else {

          message.textContent =
            "حدث خطأ: " + error.message;

        }

      }

    });

  </script>

</body>
</html>
