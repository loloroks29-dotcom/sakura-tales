<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | حكايات ساكورا</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7fb, #ffd6e8);
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 35px 25px;
      background: white;
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(150, 80, 110, 0.2);
      text-align: center;
    }

    .logo {
      font-size: 30px;
      color: #a84f78;
      font-weight: bold;
    }

    h2 {
      color: #84668a;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: 1px solid #f0c5d8;
      border-radius: 15px;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 15px;
      background: #a84f78;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      color: #a84f78;
    }

    .back {
      display: block;
      margin-top: 20px;
      color: #a84f78;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🌸 حكايات ساكورا</div>

    <h2>لوحة التحكم</h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني">

    <input id="password" type="password" placeholder="كلمة المرور">

    <button id="loginBtn">تسجيل الدخول</button>

    <div id="message"></div>

    <a class="back" href="index.html">العودة للموقع</a>

  </div>

  <script type="module">

    import { signInWithEmailAndPassword }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import { auth } from "./firebase.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");

    loginBtn.addEventListener("click", async () => {

      message.textContent = "جاري تسجيل الدخول...";

      try {

        await signInWithEmailAndPassword(
          auth,
          email.value,
          password.value
        );

        message.textContent = "تم تسجيل الدخول بنجاح 🌸";

        setTimeout(() => {
          window.location.href = "admin.html";
        }, 700);

      } catch (error) {

        message.textContent =
          "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

      }

    });

  </script>

</body>
</html>
