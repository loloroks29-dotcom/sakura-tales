<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Sakura Tales</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff5fa;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 380px;
      padding: 30px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(180,100,140,.15);
      text-align: center;
    }

    h1 {
      color: #a64f78;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #edc5d7;
      border-radius: 12px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #d96f9d;
      color: white;
      font-size: 16px;
    }

    #message {
      margin-top: 15px;
      padding: 10px;
      color: #8f4668;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>🌸 Sakura Tales</h1>

  <p>تسجيل الدخول إلى لوحة التحكم</p>

  <input
    type="email"
    id="email"
    placeholder="البريد الإلكتروني"
  >

  <input
    type="password"
    id="password"
    placeholder="كلمة المرور"
  >

  <button id="loginBtn">
    تسجيل الدخول
  </button>

  <div id="message"></div>

</div>

<script type="module">

  import { auth } from "./firebase.js";

  import {
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const message = document.getElementById("message");

  loginBtn.addEventListener("click", async () => {

    message.textContent = "جاري تسجيل الدخول...";

    try {

      await signInWithEmailAndPassword(
        auth,
        email.value.trim(),
        password.value
      );

      message.textContent = "تم تسجيل الدخول 💗";

      setTimeout(() => {
        window.location.href = "admin.html";
      }, 700);

    } catch (error) {

      console.error(error);

      message.textContent =
        "خطأ في تسجيل الدخول: " + error.code;

    }

  });

</script>

</body>
</html>
