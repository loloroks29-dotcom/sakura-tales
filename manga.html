<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #ffd9e9, #efa8c7);
      padding: 20px;
      text-align: center;
    }

    header a {
      color: #8f4668;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    /* معلومات المانهوا */

    .info {
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 7px 25px rgba(160, 80, 120, .12);
      margin-bottom: 22px;
    }

    .cover {
      width: 200px;
      height: 280px;
      object-fit: cover;
      border-radius: 18px;
    }

    h1 {
      color: #9b4770;
    }

    .genres {
      color: #b15c82;
      margin: 10px 0;
    }

    .description {
      line-height: 1.9;
      max-width: 650px;
      margin: 15px auto;
    }

    .status {
      display: inline-block;
      background: #ffe5ef;
      color: #9b4770;
      padding: 7px 13px;
      border-radius: 12px;
    }

    /* قسم الفصول */

    .chapters {
      background: #111111;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .18);
    }

    .chapters h2 {
      text-align: center;
      color: #ffd1e3;
      margin-top: 0;
      margin-bottom: 20px;
    }

    /* بطاقة الفصل */

    .chapter {
      display: flex;
      align-items: center;
      gap: 15px;

      padding: 14px;
      margin: 12px 0;

      background: #1c1c1c;
      border: 1px solid #f8c4da;
      border-radius: 18px;

      box-shadow: 0 5px 15px rgba(0, 0, 0, .25);

      transition: .25s ease;
    }

    .chapter:hover {
      transform: translateY(-3px);
      background: #242424;
      box-shadow: 0 8px 22px rgba(255, 193, 216, .18);
    }

    /* دائرة رقم الفصل */

    .chapter-number {
      min-width: 52px;
      height: 52px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffd1e3;
      color: #111111;

      border-radius: 50%;

      font-size: 18px;
      font-weight: bold;

      box-shadow: 0 4px 12px rgba(255, 209, 227, .25);
    }

    /* معلومات الفصل */

    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-label {
      color: #ffd1e3;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .chapter-name {
      color: white;
      font-weight: bold;
      line-height: 1.6;
    }

    /* زر القراءة */

    .read {
      background: #ffd1e3;
      color: #111111;

      text-decoration: none;

      padding: 11px 17px;

      border-radius: 13px;

      white-space: nowrap;

      font-weight: bold;

      transition: .25s ease;
    }

    .read:hover {
      background: #ffe3ee;
      transform: scale(1.04);
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #ffd1e3;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #9b4770;
      text-decoration: none;
      font-weight: bold;
    }

    /* الهاتف */

    @media (max-width: 600px) {

      .chapters {
        padding: 15px;
        border-radius: 20px;
      }

      .chapter {
        gap: 10px;
        padding: 11px;
      }

      .chapter-number {
        min-width: 45px;
        height: 45px;
        font-size: 15px;
      }

      .chapter-label {
        font-size: 12px;
      }

      .chapter-name {
        font-size: 13px;
      }

      .read {
        padding: 9px 11px;
        font-size: 12px;
      }
    }

    @media (max-width: 420px) {

      .chapter {
        flex-wrap: wrap;
      }

      .chapter-info {
        flex: 1;
      }

      .read {
        width: 100%;
        text-align: center;
        margin-top: 3px;
      }
    }

  </style>
</head>

<body>

<header>
  <a href="index.html">🌸 Sakura Tales</a>
</header>

<main>

  <section class="info" id="mangaInfo">
    جاري تحميل المانهوا... 🌸
  </section>


  <section class="chapters">

    <h2>📖 فصول المانهوا</h2>

    <div id="chapterList">
      جاري تحميل الفصول...
    </div>

  </section>


  <a class="back" href="index.html">
    ← العودة للرئيسية
  </a>

</main>


<script type="module">

  import { db } from "./firebase.js";

  import {
    doc,
    getDoc,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const params = new URLSearchParams(
    window.location.search
  );


  const mangaId = params.get("id");


  const mangaInfo =
    document.getElementById("mangaInfo");


  const chapterList =
    document.getElementById("chapterList");


  if (!mangaId) {

    mangaInfo.innerHTML =
      "لم يتم تحديد المانهوا 🌸";

    chapterList.innerHTML = "";

  } else {

    loadManga();
    loadChapters();

  }


  async function loadManga() {

    try {

      const mangaRef =
        doc(db, "manga", mangaId);


      const mangaSnap =
        await getDoc(mangaRef);


      if (!mangaSnap.exists()) {

        mangaInfo.innerHTML =
          "المانهوا غير موجودة 🌸";

        return;
      }


      const data =
        mangaSnap.data();


      const genres =
        Array.isArray(data.genres)
          ? data.genres.join(" • ")
          : data.genres || "";


      mangaInfo.innerHTML = `

        ${
          data.cover
            ? `<img
                class="cover"
                src="${data.cover}"
                alt="${data.title || ""}"
              >`
            : ""
        }

        <h1>
          ${data.title || "بدون اسم"}
        </h1>

        <div class="status">
          ${data.status || "غير محددة"}
        </div>

        <div class="genres">
          ${genres}
        </div>

        <div class="description">
          ${data.description || "لا يوجد وصف."}
        </div>

      `;


      document.title =
        data.title || "Sakura Tales";


    } catch (error) {

      console.error(error);

      mangaInfo.innerHTML =
        "حدث خطأ أثناء تحميل المانهوا 🌸";

    }

  }


  async function loadChapters() {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          )
        );


      if (snapshot.empty) {

        chapterList.innerHTML = `
          <div class="empty">
            لا توجد فصول حتى الآن 📖🌸
          </div>
        `;

        return;
      }


      const chapters = [];


      snapshot.forEach(item => {

        chapters.push({
          id: item.id,
          ...item.data()
        });

      });


      chapters.sort(
        (a, b) =>
          Number(a.number) -
          Number(b.number)
      );


      chapterList.innerHTML = "";


      chapters.forEach(chapter => {

        const div =
          document.createElement("div");


        div.className =
          "chapter";


        const number =
          document.createElement("div");


        number.className =
          "chapter-number";


        number.textContent =
          chapter.number || "";


        const info =
          document.createElement("div");


        info.className =
          "chapter-info";


        const label =
          document.createElement("div");


        label.className =
          "chapter-label";


        label.textContent =
          "📖 الفصل " +
          (chapter.number || "");


        const name =
          document.createElement("div");


        name.className =
          "chapter-name";


        name.textContent =
          chapter.title ||
          "بدون عنوان";


        info.appendChild(label);
        info.appendChild(name);


        const link =
          document.createElement("a");


        link.className =
          "read";


        link.textContent =
          "قراءة 💗";


        link.href =
          "./reader.html?id=" +
          encodeURIComponent(mangaId) +
          "&chapter=" +
          encodeURIComponent(chapter.id);


        div.appendChild(number);
        div.appendChild(info);
        div.appendChild(link);


        chapterList.appendChild(div);

      });


    } catch (error) {

      console.error(error);

      chapterList.innerHTML = `
        <div class="empty">
          حدث خطأ أثناء تحميل الفصول 🌸
        </div>
      `;

    }

  }

</script>

</body>
</html>
