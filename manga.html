<!DOCTYPE html><html lang="ar" dir="rtl"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Tales</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #ffd9e9, #efa8c7);
      padding: 20px;
      text-align: center;
    }

    header a {
      color: #8f4668;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .info {
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 7px 25px rgba(160, 80, 120, .12);
      margin-bottom: 22px;
    }

    .cover {
      width: 200px;
      height: 280px;
      object-fit: cover;
      border-radius: 18px;
    }

    h1 {
      color: #9b4770;
    }

    .genres {
      color: #b15c82;
      margin: 10px 0;
    }

    .description {
      line-height: 1.9;
      max-width: 650px;
      margin: 15px auto;
    }

    .status {
      display: inline-block;
      background: #ffe5ef;
      color: #9b4770;
      padding: 7px 13px;
      border-radius: 12px;
    }

    /* قسم الفصول */
    .chapters {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 7px 25px rgba(160, 80, 120, .12);
    }

    .chapters h2 {
      text-align: center;
      color: #a64f78;
      margin-top: 5px;
      margin-bottom: 20px;
    }

    /* بطاقة الفصل */
    .chapter {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin: 12px 0;
      background: linear-gradient(135deg, #fff8fb, #fff1f7);
      border: 1px solid #f2d4e1;
      border-radius: 18px;
      transition: .2s;
    }

    .chapter:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 16px rgba(160, 80, 120, .10);
      border-color: #eab5cc;
    }

    /* رقم الفصل */
    .chapter-number {
      min-width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f4a9c8, #d96f9d);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(217, 111, 157, .20);
    }

    /* اسم الفصل */
    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-name {
      font-weight: bold;
      color: #70465a;
      line-height: 1.6;
      word-break: break-word;
    }

    .chapter-label {
      color: #b47b91;
      font-size: 12px;
      margin-top: 3px;
    }

    /* زر القراءة */
    .read {
      background: linear-gradient(135deg, #df79a5, #c95f8d);
      color: white;
      text-decoration: none;
      padding: 11px 17px;
      border-radius: 13px;
      white-space: nowrap;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(201, 95, 141, .15);
      transition: .2s;
    }

    .read:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 14px rgba(201, 95, 141, .22);
    }

    .empty {
      text-align: center;
      padding: 30px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #9b4770;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .chapters {
        padding: 15px;
      }

      .chapter {
        padding: 11px;
        gap: 10px;
      }

      .chapter-number {
        min-width: 42px;
        height: 42px;
        font-size: 13px;
      }

      .chapter-name {
        font-size: 13px;
      }

      .chapter-label {
        font-size: 11px;
      }

      .read {
        padding: 9px 11px;
        font-size: 12px;
      }
    }

    @media (max-width: 380px) {

      .chapter {
        flex-wrap: wrap;
      }

      .chapter-info {
        flex: 1;
      }

      .read {
        width: 100%;
        text-align: center;
      }
    }
  </style></head><body><header>
  <a href="index.html">🌸 Sakura Tales</a>
</header><main>  <section class="info" id="mangaInfo">
    جاري تحميل المانهوا... 🌸
  </section>  <section class="chapters"><h2>📖 فصول المانهوا</h2>

<div id="chapterList">
  جاري تحميل الفصول...
</div>

  </section>  <a class="back" href="index.html">
    ← العودة للرئيسية
  </a></main><script type="module">

  import { db } from "./firebase.js";

  import {
    doc,
    getDoc,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const params = new URLSearchParams(
    window.location.search
  );

  const mangaId = params.get("id");

  const mangaInfo =
    document.getElementById("mangaInfo");

  const chapterList =
    document.getElementById("chapterList");


  if (!mangaId) {

    mangaInfo.innerHTML =
      "لم يتم تحديد المانهوا 🌸";

    chapterList.innerHTML = "";

  } else {

    loadManga();
    loadChapters();

  }


  async function loadManga() {

    const mangaRef =
      doc(db, "manga", mangaId);

    const mangaSnap =
      await getDoc(mangaRef);


    if (!mangaSnap.exists()) {

      mangaInfo.innerHTML =
        "المانهوا غير موجودة 🌸";

      return;
    }


    const data = mangaSnap.data();


    const genres =
      Array.isArray(data.genres)
        ? data.genres.join(" • ")
        : data.genres || "";


    mangaInfo.innerHTML = `

      ${
        data.cover
          ? `<img
              class="cover"
              src="${data.cover}"
              alt="${data.title || ""}"
            >`
          : ""
      }

      <h1>${data.title || "بدون اسم"}</h1>

      <div class="status">
        ${data.status || "غير محددة"}
      </div>

      <div class="genres">
        ${genres}
      </div>

      <div class="description">
        ${data.description || "لا يوجد وصف."}
      </div>
    `;


    document.title =
      data.title || "Sakura Tales";
  }


  async function loadChapters() {

    const snapshot =
      await getDocs(
        collection(
          db,
          "manga",
          mangaId,
          "chapters"
        )
      );


    if (snapshot.empty) {

      chapterList.innerHTML = `
        <div class="empty">
          لا توجد فصول حتى الآن 📖🌸
        </div>
      `;

      return;
    }


    const chapters = [];


    snapshot.forEach(item => {

      chapters.push({
        id: item.id,
        ...item.data()
      });

    });


    chapters.sort(
      (a, b) =>
        Number(a.number) -
        Number(b.number)
    );


    chapterList.innerHTML = "";


    chapters.forEach(chapter => {

      const div =
        document.createElement("div");

      div.className = "chapter";


      /* رقم الفصل */

      const number =
        document.createElement("div");

      number.className =
        "chapter-number";

      number.textContent =
        chapter.number || "";


      /* معلومات الفصل */

      const info =
        document.createElement("div");

      info.className =
        "chapter-info";


      const name =
        document.createElement("div");

      name.className =
        "chapter-name";

      name.textContent =
        chapter.title
          ? chapter.title
          : "الفصل " + (chapter.number || "");


      const label =
        document.createElement("div");

      label.className =
        "chapter-label";

      label.textContent =
        "📖 الفصل " +
        (chapter.number || "");


      info.appendChild(name);
      info.appendChild(label);


      /* زر القراءة */

      const link =
        document.createElement("a");

      link.className = "read";

      link.textContent =
        "قراءة 💗";


      link.href =
        "./reader.html?id=" +
        encodeURIComponent(mangaId) +
        "&chapter=" +
        encodeURIComponent(chapter.id);


      div.appendChild(number);
      div.appendChild(info);
      div.appendChild(link);

      chapterList.appendChild(div);

    });

  }

</script></body>
</html>
