<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #633f51;
    }

    header {
      background: linear-gradient(135deg, #ffd9e9, #efa8c7);
      padding: 20px;
      text-align: center;
    }

    header a {
      color: #8f4668;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    .info {
      background: white;
      border-radius: 24px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 7px 25px rgba(160, 80, 120, .12);
      margin-bottom: 22px;
    }

    .cover {
      width: 200px;
      height: 280px;
      object-fit: cover;
      border-radius: 18px;
    }

    h1 {
      color: #9b4770;
    }

    .genres {
      color: #b15c82;
      margin: 10px 0;
    }

    .description {
      line-height: 1.9;
      max-width: 650px;
      margin: 15px auto;
    }

    .status {
      display: inline-block;
      background: #ffe5ef;
      color: #9b4770;
      padding: 7px 13px;
      border-radius: 12px;
    }

    .chapters {
      background: white;
      border-radius: 24px;
      padding: 22px;
      box-shadow: 0 7px 25px rgba(160, 80, 120, .12);
    }

    .chapters h2 {
      text-align: center;
      color: #a64f78;
    }

    .chapter {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      margin: 10px 0;
      background: #fff8fb;
      border: 1px solid #f2d4e1;
      border-radius: 15px;
      gap: 10px;
    }

    .chapter-name {
      font-weight: bold;
    }

    .read {
      background: #d96f9d;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 11px;
      white-space: nowrap;
    }

    .empty {
      text-align: center;
      padding: 30px;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #9b4770;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">🌸 Sakura Tales</a>
</header>

<main>

  <section class="info" id="mangaInfo">
    جاري تحميل المانهوا... 🌸
  </section>

  <section class="chapters">
    <h2>📖 فصول المانهوا</h2>
    <div id="chapterList">
      جاري تحميل الفصول...
    </div>
  </section>

  <a class="back" href="index.html">
    ← العودة للرئيسية
  </a>

</main>

<script type="module">

  import { db } from "./firebase.js";

  import {
    doc,
    getDoc,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const params = new URLSearchParams(
    window.location.search
  );

  const mangaId = params.get("id");

  const mangaInfo =
    document.getElementById("mangaInfo");

  const chapterList =
    document.getElementById("chapterList");


  if (!mangaId) {

    mangaInfo.innerHTML =
      "لم يتم تحديد المانهوا 🌸";

    chapterList.innerHTML = "";

  } else {

    loadManga();
    loadChapters();

  }


  async function loadManga() {

    const mangaRef =
      doc(db, "manga", mangaId);

    const mangaSnap =
      await getDoc(mangaRef);


    if (!mangaSnap.exists()) {

      mangaInfo.innerHTML =
        "المانهوا غير موجودة 🌸";

      return;
    }


    const data = mangaSnap.data();


    const genres =
      Array.isArray(data.genres)
        ? data.genres.join(" • ")
        : data.genres || "";


    mangaInfo.innerHTML = `

      ${
        data.cover
          ? `<img
              class="cover"
              src="${data.cover}"
              alt="${data.title || ""}"
            >`
          : ""
      }

      <h1>${data.title || "بدون اسم"}</h1>

      <div class="status">
        ${data.status || "غير محددة"}
      </div>

      <div class="genres">
        ${genres}
      </div>

      <div class="description">
        ${data.description || "لا يوجد وصف."}
      </div>
    `;


    document.title =
      data.title || "Sakura Tales";
  }


  async function loadChapters() {

    const snapshot =
      await getDocs(
        collection(
          db,
          "manga",
          mangaId,
          "chapters"
        )
      );


    if (snapshot.empty) {

      chapterList.innerHTML = `
        <div class="empty">
          لا توجد فصول حتى الآن 📖🌸
        </div>
      `;

      return;
    }


    const chapters = [];


    snapshot.forEach(item => {

      chapters.push({
        id: item.id,
        ...item.data()
      });

    });


    chapters.sort(
      (a, b) =>
        Number(a.number) -
        Number(b.number)
    );


    chapterList.innerHTML = "";


    chapters.forEach(chapter => {

      const div =
        document.createElement("div");

      div.className = "chapter";


      const link =
        document.createElement("a");

      link.className = "read";

      link.textContent = "قراءة 💗";


      /*
        هنا نرسل رقم المانهوا
        ورقم الفصل إلى reader.html
      */

      link.href =
        "./reader.html?id=" +
        encodeURIComponent(mangaId) +
        "&chapter=" +
        encodeURIComponent(chapter.id);


      const name =
        document.createElement("div");

      name.className =
        "chapter-name";

      name.textContent =
        "📖 الفصل " +
        (chapter.number || "") +
        (
          chapter.title
            ? " — " + chapter.title
            : ""
        );


      div.appendChild(name);
      div.appendChild(link);

      chapterList.appendChild(div);

    });

  }

</script>

</body>
</html>
