<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>قراءة | Sakura Tales</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff7fb;
      color: #633f51;
      font-family: Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255, 222, 235, 0.96);
      padding: 14px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(120, 60, 90, 0.12);
    }

    header a {
      color: #914665;
      text-decoration: none;
      font-weight: bold;
    }

    .title {
      text-align: center;
      padding: 20px 10px 10px;
    }

    .title h1 {
      color: #a34d76;
      margin: 5px;
      font-size: 22px;
    }

    .title p {
      color: #8a6677;
      margin: 8px;
    }

    .pages {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 0;
    }

    .page {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      padding: 0;
      border: 0;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px 15px;
      color: #8b6878;
    }

    .navigation {
      max-width: 900px;
      margin: 25px auto 45px;
      padding: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .navigation a {
      background: #d96f9d;
      color: white;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 13px;
      font-weight: bold;
    }

    .navigation a:hover {
      background: #c85d8d;
    }

    .navigation .chapters {
      background: #f1b3cc;
      color: #70485a;
    }

    .bottom {
      text-align: center;
      color: #9b7182;
      padding-bottom: 30px;
    }

    @media (max-width: 600px) {
      .title h1 {
        font-size: 19px;
      }

      .navigation a {
        padding: 11px 13px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">🌸 Sakura Tales</a>
  </header>

  <div class="title" id="title">
    جاري تحميل الفصل... 🌸
  </div>

  <div class="pages" id="pages">
    <div class="loading">
      جاري تحميل صفحات الفصل... 📖
    </div>
  </div>

  <div class="navigation" id="navigation"></div>

  <div class="bottom">
    💗 شكراً لقراءتك في Sakura Tales
  </div>

  <script type="module">

    import { db } from "./firebase.js";

    import {
      doc,
      getDoc,
      collection,
      getDocs
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    const params = new URLSearchParams(
      window.location.search
    );

    const mangaId = params.get("id");
    const chapterId = params.get("chapter");

    const title = document.getElementById("title");
    const pages = document.getElementById("pages");
    const navigation = document.getElementById("navigation");


    if (!mangaId || !chapterId) {

      pages.innerHTML = `
        <div class="error">
          لم يتم تحديد الفصل 🌸
        </div>
      `;

    } else {

      loadChapter();

    }


    async function loadChapter() {

      try {

        // تحميل بيانات الفصل
        const chapterRef = doc(
          db,
          "manga",
          mangaId,
          "chapters",
          chapterId
        );

        const chapterSnap = await getDoc(
          chapterRef
        );


        if (!chapterSnap.exists()) {

          pages.innerHTML = `
            <div class="error">
              الفصل غير موجود 🌸
            </div>
          `;

          return;
        }


        const chapter = chapterSnap.data();


        title.innerHTML = `
          <h1>
            📖 الفصل ${chapter.number || ""}
          </h1>

          ${
            chapter.title
              ? `<p>${chapter.title}</p>`
              : ""
          }
        `;


        document.title =
          `الفصل ${chapter.number || ""} | Sakura Tales`;


        // عرض الصور واحدة تحت الثانية
        if (
          !chapter.pages ||
          !Array.isArray(chapter.pages) ||
          chapter.pages.length === 0
        ) {

          pages.innerHTML = `
            <div class="error">
              لا توجد صفحات في هذا الفصل 📖
            </div>
          `;

        } else {

          pages.innerHTML = "";

          chapter.pages.forEach(
            (imageUrl, index) => {

              const img =
                document.createElement("img");

              img.className = "page";

              img.src = imageUrl;

              img.alt =
                `صفحة ${index + 1}`;

              img.loading = "lazy";

              pages.appendChild(img);

            }
          );

        }


        // تحميل كل الفصول
        await loadNavigation();

      } catch (error) {

        console.error(error);

        pages.innerHTML = `
          <div class="error">
            حدث خطأ أثناء تحميل الفصل 🌸
          </div>
        `;

      }

    }


    async function loadNavigation() {

      const snapshot = await getDocs(
        collection(
          db,
          "manga",
          mangaId,
          "chapters"
        )
      );


      const chapters = [];

      snapshot.forEach(item => {

        chapters.push({
          id: item.id,
          ...item.data()
        });

      });


      // ترتيب الفصول من الأصغر للأكبر
      chapters.sort(
        (a, b) =>
          Number(a.number) -
          Number(b.number)
      );


      const currentIndex =
        chapters.findIndex(
          chapter =>
            chapter.id === chapterId
        );


      let html = "";


      // الفصل السابق
      if (currentIndex > 0) {

        const previous =
          chapters[currentIndex - 1];

        html += `
          <a href="reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(previous.id)}">
            ⬅️ الفصل السابق
          </a>
        `;

      }


      // زر الفصول
      html += `
        <a
          class="chapters"
          href="manga.html?id=${encodeURIComponent(mangaId)}"
        >
          📚 الفصول
        </a>
      `;


      // الفصل التالي
      if (
        currentIndex !== -1 &&
        currentIndex < chapters.length - 1
      ) {

        const next =
          chapters[currentIndex + 1];

        html += `
          <a href="reader.html?id=${encodeURIComponent(mangaId)}&chapter=${encodeURIComponent(next.id)}">
            الفصل التالي ➡️
          </a>
        `;

      }


      navigation.innerHTML = html;

    }

  </script>

</body>

</html>
