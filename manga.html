<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sakura Tales 🌸</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fffafd;
      color: #555;
    }

    /* الهيدر */

    header {
      background: #ffffff;
      border-bottom: 1px solid #f5dce7;
      padding: 18px;
      text-align: center;
    }

    header a {
      color: #e39ab8;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }

    /* الصفحة */

    main {
      max-width: 900px;
      margin: auto;
      padding: 25px 15px 50px;
    }

    /* معلومات المانهوا */

    .info {
      background: #ffffff;
      border: 1px solid #f4dce6;
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(180, 120, 145, .07);
      margin-bottom: 20px;
    }

    .manga-top {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .cover-box {
      flex-shrink: 0;
    }

    .cover {
      width: 190px;
      height: 270px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid #f1d3df;
      box-shadow: 0 5px 18px rgba(180, 100, 135, .12);
      display: block;
    }

    .no-cover {
      width: 190px;
      height: 270px;
      border-radius: 18px;
      background: #fff1f6;
      border: 1px solid #f1d3df;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 55px;
    }

    .manga-details {
      flex: 1;
    }

    h1 {
      color: #d984a5;
      font-size: 27px;
      margin: 0 0 12px;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      background: #fff0f6;
      color: #d47f9f;
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .genres {
      color: #b98a9d;
      font-size: 13px;
      line-height: 1.8;
    }

    /* الوصف */

    .description-box {
      margin-top: 22px;
      padding: 17px 18px;

      background: #fffafd;
      border: 1px solid #f4dce6;
      border-radius: 16px;
    }

    .description-title {
      color: #d984a5;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .description {
      line-height: 1.9;
      color: #777;
      font-size: 14px;
    }

    /* قسم الفصول */

    .chapters {
      background: #ffffff;
      border: 1px solid #f5dce7;
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(180, 120, 145, .06);
    }

    .chapters h2 {
      text-align: center;
      color: #d984a5;
      font-size: 20px;
      margin: 5px 0 20px;
    }

    /* بطاقة الفصل */

    .chapter {
      display: flex;
      align-items: center;
      gap: 13px;

      background: #fffafd;
      border: 1px solid #f3dce6;

      border-radius: 15px;

      padding: 12px 14px;
      margin: 9px 0;

      transition: .2s ease;
    }

    .chapter:hover {
      background: #fff5f9;
      border-color: #efc8d8;
      transform: translateY(-1px);
    }

    .chapter-number {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffe6f0;
      color: #d47f9f;

      border-radius: 12px;

      font-size: 14px;
      font-weight: bold;
    }

    .chapter-info {
      flex: 1;
      min-width: 0;
    }

    .chapter-label {
      color: #bfa0ad;
      font-size: 11px;
      margin-bottom: 3px;
    }

    .chapter-name {
      color: #555;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.5;

      overflow: hidden;
      text-overflow: ellipsis;
    }

    .read {
      flex-shrink: 0;

      background: #f7b6ce;
      color: #ffffff;

      text-decoration: none;

      padding: 9px 14px;

      border-radius: 11px;

      font-size: 12px;
      font-weight: bold;

      transition: .2s ease;
    }

    .read:hover {
      background: #ed9fbd;
    }

    .empty {
      text-align: center;
      padding: 30px 10px;
      color: #c39aaa;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #d984a5;
      text-decoration: none;
      font-size: 13px;
    }

    /* الجوال */

    @media (max-width: 600px) {

      main {
        padding: 15px 10px 40px;
      }

      .info {
        padding: 18px 14px;
        border-radius: 19px;
      }

      .manga-top {
        gap: 15px;
        align-items: flex-start;
      }

      .cover {
        width: 125px;
        height: 180px;
        border-radius: 14px;
      }

      .no-cover {
        width: 125px;
        height: 180px;
        border-radius: 14px;
        font-size: 40px;
      }

      h1 {
        font-size: 19px;
        margin-bottom: 9px;
      }

      .status {
        padding: 6px 10px;
        font-size: 11px;
      }

      .genres {
        font-size: 11px;
      }

      .description-box {
        margin-top: 17px;
        padding: 14px;
      }

      .description {
        font-size: 12px;
        line-height: 1.8;
      }

      .chapters {
        padding: 15px 10px;
        border-radius: 18px;
      }

      .chapter {
        gap: 9px;
        padding: 10px;
      }

      .chapter-number {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        font-size: 13px;
      }

      .chapter-name {
        font-size: 12px;
      }

      .read {
        padding: 8px 10px;
        font-size: 11px;
      }
    }

    @media (max-width: 380px) {

      .manga-top {
        gap: 10px;
      }

      .cover {
        width: 110px;
        height: 160px;
      }

      .no-cover {
        width: 110px;
        height: 160px;
      }

      h1 {
        font-size: 17px;
      }

      .chapter-name {
        font-size: 11px;
      }

      .read {
        padding: 8px;
      }
    }

  </style>
</head>


<body>

<header>
  <a href="index.html">🌸 Sakura Tales</a>
</header>


<main>

  <section class="info" id="mangaInfo">
    جاري تحميل المانهوا... 🌸
  </section>


  <section class="chapters">

    <h2>📖 فصول المانهوا</h2>

    <div id="chapterList">
      جاري تحميل الفصول...
    </div>

  </section>


  <a class="back" href="index.html">
    ← العودة للرئيسية
  </a>

</main>


<script type="module">

  import { db } from "./firebase.js";

  import {
    doc,
    getDoc,
    collection,
    getDocs
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  const params =
    new URLSearchParams(window.location.search);

  const mangaId =
    params.get("id");


  const mangaInfo =
    document.getElementById("mangaInfo");

  const chapterList =
    document.getElementById("chapterList");


  if (!mangaId) {

    mangaInfo.innerHTML =
      "لم يتم تحديد المانهوا 🌸";

    chapterList.innerHTML = "";

  } else {

    loadManga();
    loadChapters();

  }


  async function loadManga() {

    try {

      const mangaRef =
        doc(db, "manga", mangaId);

      const mangaSnap =
        await getDoc(mangaRef);


      if (!mangaSnap.exists()) {

        mangaInfo.innerHTML =
          "المانهوا غير موجودة 🌸";

        return;
      }


      const data =
        mangaSnap.data();


      const genres =
        Array.isArray(data.genres)
          ? data.genres.join(" • ")
          : data.genres || "";


      const coverHTML =
        data.cover
          ? `
            <img
              class="cover"
              src="${data.cover}"
              alt="${data.title || ""}"
            >
          `
          : `
            <div class="no-cover">
              🌸
            </div>
          `;


      mangaInfo.innerHTML = `

        <div class="manga-top">

          <div class="cover-box">
            ${coverHTML}
          </div>

          <div class="manga-details">

            <h1>
              ${data.title || "بدون اسم"}
            </h1>

            <div class="status">
              ${data.status || "غير محددة"}
            </div>

            ${
              genres
                ? `
                  <div class="genres">
                    ${genres}
                  </div>
                `
                : ""
            }

          </div>

        </div>


        <div class="description-box">

          <div class="description-title">
            ✿ نبذة عن المانهوا
          </div>

          <div class="description">
            ${data.description || "لا يوجد وصف لهذه المانهوا."}
          </div>

        </div>

      `;


      document.title =
        data.title || "Sakura Tales";


    } catch (error) {

      console.error(error);

      mangaInfo.innerHTML =
        "حدث خطأ أثناء تحميل المانهوا 🌸";

    }

  }


  async function loadChapters() {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "manga",
            mangaId,
            "chapters"
          )
        );


      if (snapshot.empty) {

        chapterList.innerHTML = `
          <div class="empty">
            لا توجد فصول حتى الآن 📖🌸
          </div>
        `;

        return;
      }


      const chapters = [];


      snapshot.forEach(item => {

        chapters.push({
          id: item.id,
          ...item.data()
        });

      });


      chapters.sort(
        (a, b) =>
          Number(a.number) -
          Number(b.number)
      );


      chapterList.innerHTML = "";


      chapters.forEach(chapter => {

        const div =
          document.createElement("div");


        div.className =
          "chapter";


        const number =
          document.createElement("div");


        number.className =
          "chapter-number";


        number.textContent =
          chapter.number || "";


        const info =
          document.createElement("div");


        info.className =
          "chapter-info";


        const label =
          document.createElement("div");


        label.className =
          "chapter-label";


        label.textContent =
          "الفصل " +
          (chapter.number || "");


        const name =
          document.createElement("div");


        name.className =
          "chapter-name";


        name.textContent =
          chapter.title ||
          "بدون عنوان";


        info.appendChild(label);
        info.appendChild(name);


        const link =
          document.createElement("a");


        link.className =
          "read";


        link.textContent =
          "قراءة 💗";


        link.href =
          "./reader.html?id=" +
          encodeURIComponent(mangaId) +
          "&chapter=" +
          encodeURIComponent(chapter.id);


        div.appendChild(number);
        div.appendChild(info);
        div.appendChild(link);


        chapterList.appendChild(div);

      });


    } catch (error) {

      console.error(error);

      chapterList.innerHTML = `
        <div class="empty">
          حدث خطأ أثناء تحميل الفصول 🌸
        </div>
      `;

    }

  }

</script>

</body>
</html>
